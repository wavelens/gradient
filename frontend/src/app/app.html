<a class="gr-skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>
<app-header />

@if (authService.isAuthenticated()) {
  <app-command-palette />
  <app-whats-new-dialog />
}

<main #main id="main-content" class="app-main" tabindex="-1">
  <router-outlet />
</main>
<app-confirm-dialog />
<gr-toast />

@if (showFooter()) {
  <gr-footer [links]="footerLinks" [note]="version" />
}
