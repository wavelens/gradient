<gr-dialog header="Connect Gradient.CI Servers" [(visible)]="visible" width="480px">
  <p>Create a key on servers.gradient.ci, then paste its connection token.</p>
  <button grButton label="Open servers.gradient.ci" icon="open_in_new" severity="secondary" (click)="openShop()"></button>
  <gr-form-field label="Connection token" for="gradient-ci-token">
    <input
      grInput
      id="gradient-ci-token"
      autocomplete="off"
      placeholder="gci1_..."
      [(ngModel)]="token"
      [disabled]="waiting()"
      (keyup.enter)="submit()"
    />
  </gr-form-field>
  @if (waiting()) {
    <p class="text-secondary">Waiting for the first connection...</p>
  }
  @if (errorMessage()) {
    <gr-message-banner type="error">{{ errorMessage() }}</gr-message-banner>
  }
  <div grDialogFooter>
    <button grButton label="Close" severity="secondary" (click)="close()"></button>
    <button
      grButton
      label="Connect"
      icon="link"
      [loading]="submitting() || waiting()"
      [disabled]="!token.trim() || submitting() || waiting()"
      (click)="submit()"
    ></button>
  </div>
</gr-dialog>
