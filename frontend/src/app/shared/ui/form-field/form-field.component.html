<div class="form-field" [class.has-error]="showError()">
  @if (label()) {
    <label [attr.for]="for() ?? null">
      {{ label() }}
      <ng-content select="[slot=label]"></ng-content>
      @if (required()) {
        <span class="required" aria-hidden="true">*</span>
      }
    </label>
  }
  <ng-content></ng-content>
  @if (showError()) {
    <small class="field-error">{{ errorText() }}</small>
  } @else if (hint()) {
    <small class="hint">{{ hint() }}</small>
  }
</div>
