<div class="password-input">
  <input
    class="gr-input password-input__field"
    [type]="show() ? 'text' : 'password'"
    [id]="inputId() || null"
    [value]="value()"
    [disabled]="isDisabled()"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  <button
    type="button"
    class="password-input__toggle"
    (click)="toggle()"
    [attr.aria-label]="show() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="show()"
  >
    <gr-icon [name]="show() ? 'visibility_off' : 'visibility'" />
  </button>
</div>
