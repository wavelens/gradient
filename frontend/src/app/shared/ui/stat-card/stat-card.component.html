<div class="stat-card">
  @if (icon(); as name) {
    <div class="stat-icon">
      <gr-icon [name]="name" size="xl" />
    </div>
  }
  <div class="stat-content">
    <div class="stat-value">{{ value() }}</div>
    <div class="stat-label">{{ label() }}</div>
  </div>
</div>
