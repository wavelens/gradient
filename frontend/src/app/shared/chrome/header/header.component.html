<gr-header [brand]="brand" [nav]="nav()">
  @if (authService.isAuthenticated()) {
    <button slot="search" type="button" class="search-box search-trigger" aria-label="Search" (click)="palette.open()">
      <gr-icon name="search" size="sm" />
      <span>Search</span>
      <kbd>/</kbd>
    </button>
  }

  <div slot="actions" class="header-user">
    @if (authService.user(); as user) {
      <button type="button" class="user-menu-trigger" aria-haspopup="menu" [attr.aria-expanded]="userMenu.isOpen()" (click)="userMenu.toggle($event)"
              [attr.aria-label]="invites.count() ? user.name + ', ' + invites.count() + ' pending invitations' : null">
        <gr-icon name="account_circle" />
        <span class="user-name" [title]="user.name">{{ user.name }}</span>
        @if (invites.count(); as count) { <gr-badge severity="info">{{ count }}</gr-badge> }
        <gr-icon name="expand_more" size="sm" />
      </button>
      <gr-menu #userMenu [model]="userMenuItems()" />
    } @else {
      <a [routerLink]="links.login(router.url.startsWith('/account/') ? null : router.url)" class="user-link">Login</a>
      @if (!registrationDisabled) {
        <a [routerLink]="links.register()" class="user-link">Register</a>
      }
    }
  </div>
</gr-header>
