<header class="main-header">
  <div class="header-content">
    <div class="header-logo">
      <a routerLink="/">
        <gr-logo />
      </a>
    </div>

    <nav class="header-nav">
      @if (authService.isAuthenticated()) {
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Dashboard
        </a>
        <a routerLink="/board" routerLinkActive="active">
          Job Board
        </a>
      }
      <a routerLink="/projects" routerLinkActive="active">
        Projects
      </a>
      <a routerLink="/caches" routerLinkActive="active">
        Caches
      </a>
    </nav>

    @if (authService.isAuthenticated()) {
      <button type="button" class="search-trigger" aria-label="Search" (click)="palette.open()">
        <gr-icon name="search" size="sm" />
        <span>Search</span>
        <kbd>/</kbd>
      </button>
    }

    @if (authService.user(); as user) {
      <div class="header-user">
        <span class="user-name">{{ user.name }}</span>
        <a routerLink="/settings/profile" class="user-link">Settings</a>
        <button class="logout-btn" (click)="logout()">
          <gr-icon name="logout" />
        </button>
      </div>
    } @else {
      <div class="header-user">
        <a routerLink="/account/login" [queryParams]="router.url.startsWith('/account/') ? null : { next: router.url }" class="user-link">Login</a>
        @if (!registrationDisabled) {
          <a routerLink="/account/register" class="user-link">Register</a>
        }
      </div>
    }
  </div>
</header>
