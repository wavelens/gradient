<gr-header [brand]="brand" [nav]="nav()">
  @if (authService.isAuthenticated()) {
    <button slot="search" type="button" class="search-box search-trigger" aria-label="Search" (click)="palette.open()">
      <gr-icon name="search" size="sm" />
      <span>Search</span>
      <kbd>/</kbd>
    </button>
  }

  <div slot="actions" class="header-user">
    @if (authService.user(); as user) {
      <button #userTrigger type="button" class="user-menu-trigger" aria-haspopup="menu" [attr.aria-expanded]="userMenu()?.isOpen() ?? false" (click)="toggleUserMenu(userTrigger)">
        <gr-icon name="account_circle" />
        <span class="user-name" [title]="user.name">{{ user.name }}</span>
        <gr-icon name="expand_more" size="sm" />
      </button>
      @defer (on idle; on interaction(userTrigger)) {
        <app-user-menu #userMenu />
      }
    } @else if (!authService.serverUnreachable()) {
      <a [routerLink]="links.login(router.url.startsWith('/account/') ? null : router.url)" class="user-link">Sign In</a>
      @if (!registrationDisabled) {
        <a [routerLink]="links.register()" class="user-link">Sign Up</a>
      }
    }
  </div>
</gr-header>
