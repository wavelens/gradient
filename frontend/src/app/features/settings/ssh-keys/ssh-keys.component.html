<gr-page-layout [breadcrumb]="[{ label: 'Settings', link: links.settings('profile') }, { label: 'SSH Keys' }]" title="SSH Keys" subtitle="Keys for ssh-ng:// substituters, nix copy and build hosts">
  <button slot="actions" grButton label="Add SSH Key" icon="add" (click)="openDialog()"></button>

  <gr-form-field label="Store address">
    <gr-copy-field [value]="storeUrl" />
  </gr-form-field>
  <gr-form-field label="Build host">
    <gr-copy-field [value]="buildHostCommand" />
  </gr-form-field>
  <gr-form-field label="SSH config">
    <gr-copy-field [value]="sshConfig" multiline />
  </gr-form-field>

  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="keys().length === 0"
    loadingMessage="Loading SSH keys..."
    errorTitle="Failed to load SSH keys"
    emptyIcon="terminal"
    emptyTitle="No SSH keys"
    emptyMessage="Add a public key to connect over ssh-ng://."
    (retry)="loadKeys()"
  >
    <button slot="empty-action" grButton label="Add SSH Key" icon="add" (click)="openDialog()"></button>
      <gr-row-list>
        @for (key of keys(); track key.id) {
          <gr-row icon="terminal">
            {{ key.name }}
            <div slot="meta">
              <span>{{ key.fingerprint }}</span>
              <span>
                · Last used: {{ key.last_used_at ? (key.last_used_at | date: 'medium') : 'never' }}
              </span>
            </div>
            <div slot="actions">
              <button
                grButton
                label="Delete"
                icon="delete"
                severity="danger"
                (click)="deleteKey(key)"
              ></button>
            </div>
          </gr-row>
        }
      </gr-row-list>
  </gr-load-state>
</gr-page-layout>

<gr-dialog [(visible)]="showDialog" width="520px" header="Add SSH Key" [error]="errorMessage()" [busy]="saving()">
  <gr-form-field label="Name" for="ssh-key-name" [invalid]="!!nameError()" [error]="nameError() ?? ''">
    <input grInput id="ssh-key-name" [(ngModel)]="formName" placeholder="e.g. Laptop" (keyup.enter)="addKey()" />
  </gr-form-field>

  <gr-form-field label="Public key" for="ssh-key-public" [invalid]="!!publicKeyError()" [error]="publicKeyError() ?? ''">
    <textarea
      grInput
      id="ssh-key-public"
      rows="4"
      [ngModel]="formPublicKey"
      (ngModelChange)="onPublicKeyChange($event)"
      placeholder="ssh-ed25519 AAAA... user@host"
    ></textarea>
  </gr-form-field>

  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="showDialog.set(false)" [disabled]="saving()"></button>
    <button
      grButton
      label="Add"
      icon="add"
      (click)="addKey()"
      [loading]="saving()"
    ></button>
  </div>
</gr-dialog>
