<gr-page-layout width="settings" title="Sessions" subtitle="Devices currently signed in to your account">
  <app-settings-nav slot="banner" />
  <gr-load-state
    [loading]="sessions.loading()"
    [error]="sessions.error()"
    [empty]="sessions.items().length === 0"
    loadingMessage="Loading sessions..."
    errorTitle="Failed to load sessions"
    emptyIcon="devices"
    emptyTitle="No active sessions"
    emptyMessage="Sessions appear here once you sign in on a device."
    (retry)="sessions.reload()"
  >
    <gr-row-list>
      @for (s of sessions.items(); track s.id) {
        <gr-row icon="computer">
          <span [title]="s.user_agent ?? ''">{{ deviceName(s.user_agent) }}</span>
          @if (s.current) {
            <gr-badge severity="info">This device</gr-badge>
          }
          <span slot="meta">
            IP: {{ s.ip || 'unknown' }} ·
            Last used {{ s.last_used_at | serverDate }} ·
            Expires {{ s.expires_at | serverDate }}
          </span>
          @if (s.current) {
            <button slot="actions" grButton label="Log out" icon="logout" severity="secondary" (click)="signOutCurrentDevice()"></button>
          } @else {
            <button slot="actions" grButton label="Revoke" icon="logout" severity="danger" (click)="revoke(s)"></button>
          }
        </gr-row>
      }
    </gr-row-list>
    <gr-load-more [shown]="sessions.items().length" [total]="sessions.total()" [loading]="sessions.loadingMore()" (more)="sessions.loadMore()" />
  </gr-load-state>
</gr-page-layout>
