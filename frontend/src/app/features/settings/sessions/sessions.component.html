<gr-page-layout width="settings" [breadcrumb]="[{ label: 'Settings', link: links.settings('profile') }, { label: 'Sessions' }]" title="Active Sessions" subtitle="Devices currently signed in to your account">
  <app-settings-nav slot="banner" />
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="sessions().length === 0"
    loadingMessage="Loading sessions..."
    errorTitle="Failed to load sessions"
    emptyIcon="devices"
    emptyTitle="No active sessions"
    emptyMessage="Sessions appear here once you sign in on a device."
    (retry)="load()"
  >
    <gr-row-list>
      @for (s of sessions(); track s.id) {
        <gr-row icon="computer">
          <span [title]="s.user_agent ?? ''">{{ deviceName(s.user_agent) }}</span>
          @if (s.current) {
            <gr-badge severity="info">This device</gr-badge>
          }
          <span slot="meta">
            IP: {{ s.ip || 'unknown' }} ·
            Last used {{ s.last_used_at | serverDate }} ·
            Expires {{ s.expires_at | serverDate }}
          </span>
          <button
            slot="actions"
            grButton
            label="Revoke"
            icon="logout"
            severity="danger"
            [disabled]="s.current"
            (click)="revoke(s)"
          ></button>
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-page-layout>
