<div class="sg-shell">
  <aside class="sg-nav">
    <h2>Style Guide</h2>
    @for (section of nav; track section.path) {
      <a
        [routerLink]="section.path ? ['/styleguide', section.path] : ['/styleguide']"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: section.path === '' }"
        >{{ section.label }}</a
      >
    }
    <div class="sg-theme">
      @for (pref of themes; track pref) {
        <button type="button" [class.is-active]="theme() === pref" (click)="setTheme(pref)">
          {{ pref }}
        </button>
      }
    </div>
  </aside>
  <main class="sg-content">
    <gr-page-layout [breadcrumb]="crumbs()" [title]="section().title" maxWidth="none">
      <router-outlet />
    </gr-page-layout>
  </main>
</div>
