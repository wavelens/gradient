<gr-page-layout width="settings" [breadcrumb]="breadcrumb()" title="General">
  <app-team-settings-navigation slot="settings-navigation" [teamUrlName]="teamName" />
  @if (team()) {
    <app-settings-access-state-badge slot="after-title" [access]="access()" kind="team" showReadOnlyNote />
  }
  @if (team(); as team) {
    <gr-settings-section>
      <gr-form-field label="Display Name" for="team-display-name" [invalid]="!!displayNameError" [error]="displayNameError ?? ''">
        <input grInput id="team-display-name" [maxlength]="maxDisplayNameCharacterCount" [(ngModel)]="form.display_name" [appManagedDisable]="access()" (keyup.enter)="save()" />
      </gr-form-field>
      @if (isSuperuser()) {
        <gr-form-field hint="Applies to projects created from now on.">
          <gr-checkbox inputId="new-project-users" [(ngModel)]="form.new_project_users" [binary]="true"
            (ngModelChange)="setDefaultNewProjectRoleIfNoneChosen($event)"
            label="Default role for members on team projects" [appManagedDisable]="access()" />
        </gr-form-field>
        <gr-form-field label="Role of the team's users in new projects" for="new-project-role">
          <gr-select inputId="new-project-role" [(ngModel)]="form.new_project_role" [options]="roleOptions" optionLabel="label"
            optionValue="value" [appManagedDisable]="access()" [disabled]="!form.new_project_users" />
        </gr-form-field>
        <gr-form-field hint="All projects created from now on get this setting. Projects that people outside the team create also get this setting.">
          <gr-checkbox inputId="new-project-workers" [(ngModel)]="form.new_project_workers" [binary]="true"
            label="Add team workers to all new projects" [appManagedDisable]="access()" />
        </gr-form-field>
        <gr-form-field label="OIDC group" for="team-oidc-group" hint="Members of this group join the team, taken from the groups claim at each sign-in.">
          <input grInput id="team-oidc-group" [(ngModel)]="form.oidc_group" [appManagedDisable]="access()" (keyup.enter)="save()" />
        </gr-form-field>
        <gr-form-field label="SCIM group" for="team-scim-group" hint="Members of this group join the team.">
          <input grInput id="team-scim-group" [(ngModel)]="form.scim_group" [appManagedDisable]="access()" (keyup.enter)="save()" />
        </gr-form-field>
      }

      @if (accessService.isWritable(access())) {
        <div class="gr-form-actions">
          <button grButton label="Save Changes" icon="check" [loading]="saving()" (grSubmit)="save()"
            [disabled]="!unsaved.changed()"></button>
        </div>
      }
    </gr-settings-section>

    @if (accessService.isWritable(access())) {
      <gr-settings-section title="Danger Zone" danger>
        <gr-row>
          Delete Team
          <span slot="meta">Removes the team, its grants, requests, invitations and workers.</span>
          <button slot="actions" grButton label="Delete Team" icon="delete" severity="danger" (click)="remove()"></button>
        </gr-row>
      </gr-settings-section>
    }
  }
</gr-page-layout>
