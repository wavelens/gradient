<gr-settings-section title="Teams" [card]="false">
  @if (canEdit()) {
    <button slot="actions" grButton severity="secondary" label="Grant Team" icon="add" (click)="openGrant()"></button>
  }
  <gr-load-state [loading]="loading()" [error]="loadError()" [empty]="shownGrants().length === 0"
    loadingMessage="Loading teams..." errorTitle="Failed to load teams" (retry)="load()"
    emptyIcon="groups" emptyTitle="No teams"
    [emptyMessage]="emptyMessage()">
    <gr-row-list>
      @for (grant of shownGrants(); track grant.team) {
        <gr-row [icon]="entityKindToIconName.team" [link]="teamLink(grant.team)" [linkLabel]="'Open team ' + grant.display_name">
          {{ grant.display_name }}
          @if (part() === 'users') {
            <span slot="meta">Role {{ grant.role }}</span>
          }
          <div slot="actions">
            @if (grant.pending) {
              <gr-badge severity="warning">Pending</gr-badge>
            }
            @if (canEdit()) {
              <button grButton label="Remove" icon="close" severity="danger" [attr.aria-label]="(part() === 'workers' ? 'Stop using workers of ' : 'Remove role of ') + grant.display_name" (click)="remove(grant)"></button>
            }
          </div>
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-settings-section>

<gr-dialog header="Grant Team" [(visible)]="showGrant" width="420px" [error]="grantError()" [busy]="granting()">
  <gr-form-field label="Team" for="grant-team" hint="A team you are not Admin of receives a request to approve."
    [invalid]="!!teamError()" [error]="teamError() ?? ''">
    <gr-autocomplete inputId="grant-team" [(ngModel)]="form.team" [suggestions]="suggestions()" (completeMethod)="search($event)"
      [forceSelection]="false" (enter)="grant()" />
  </gr-form-field>
  @if (canCreateTeam()) {
    <p class="gr-form-aside">
      Can't find a team?
      <button grButton label="Create new team" icon="add" severity="secondary" size="small" (click)="createInsteadOfPick()"></button>
    </p>
  }
  @if (part() === 'users') {
    <gr-form-field label="Role" for="grant-team-role">
      <gr-select inputId="grant-team-role" [(ngModel)]="form.role" [options]="roleOptions()" optionLabel="label" optionValue="value" />
    </gr-form-field>
  }
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" [disabled]="granting()" (click)="showGrant.set(false)"></button>
    <button grButton label="Grant" [loading]="granting()" (click)="grant()"></button>
  </div>
</gr-dialog>

<app-create-team-dialog [(visible)]="showCreateTeam" (visibleChange)="createTeamClosed($event)" (created)="teamCreated($event)" />
