<gr-page-layout title="Teams" subtitle="Manage teams">
  @if (canCreateTeam()) {
    <button slot="actions" grButton label="New Team" icon="add" (click)="openCreate()"></button>
  }
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="items().length === 0"
    loadingMessage="Loading teams..."
    errorTitle="Failed to load teams"
    emptyIcon="groups"
    emptyTitle="No teams"
    emptyMessage="Teams share their members and workers with projects and caches."
    (retry)="load()"
  >
    @if (canCreateTeam()) {
      <button slot="empty-action" grButton label="New Team" icon="add" (click)="openCreate()"></button>
    }
    <gr-row-list>
      @for (team of items(); track team.name) {
        <gr-row icon="groups" [link]="links.team(team.name)" linkLabel="Open team">
          {{ team.display_name }}
          <gr-badge severity="info">{{ team.role }}</gr-badge>
          <span slot="meta">{{ team.name }}</span>
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-page-layout>

<app-create-team-dialog [(visible)]="showCreate" (created)="openTeam($event)" />
