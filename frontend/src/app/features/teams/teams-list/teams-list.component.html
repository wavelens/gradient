<gr-page-layout title="Teams">
  @if (canCreateTeam() && items().length) {
    <button slot="actions" grButton label="Create Team" icon="add" (click)="openCreate()"></button>
  }
  <app-pending-invitations-banner kind="team" />
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="items().length === 0"
    loadingMessage="Loading teams..."
    errorTitle="Failed to load teams"
    emptyIcon="groups"
    emptyTitle="No teams"
    (retry)="load()"
  >
    @if (canCreateTeam()) {
      <button slot="empty-action" grButton label="Create Team" icon="add" (click)="openCreate()"></button>
    }
    <gr-card-grid>
      @for (team of items(); track team.name) {
        <gr-nav-card [icon]="entityKindToIconName.team" [title]="formatEntityLabel(team)" [link]="links.team(team.name)">
          <gr-entity-name slot="title" [displayName]="team.display_name" [name]="team.name" />
          <div slot="meta">
            @if (team.role !== 'admin') {
              <gr-badge>{{ teamRoleDisplayLabels[team.role] }}</gr-badge>
            }
          </div>
        </gr-nav-card>
      }
    </gr-card-grid>
  </gr-load-state>
</gr-page-layout>

<app-create-team-dialog [(visible)]="showCreate" (created)="openTeam($event)" />
