<gr-page-layout title="Teams">
  @if (canCreateTeam) {
    <button slot="actions" grButton label="New Team" icon="add" (click)="openCreate()"></button>
  }
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="items().length === 0"
    loadingMessage="Loading teams..."
    errorTitle="Failed to load teams"
    emptyIcon="groups"
    emptyTitle="No teams"
    (retry)="load()"
  >
    <gr-row-list>
      @for (team of items(); track team.name) {
        <gr-row icon="groups" [link]="['/team', team.name]" linkLabel="Open team">
          {{ team.display_name }}
          <span slot="meta">{{ team.name }}</span>
          <div slot="actions"><gr-badge severity="info">{{ team.role }}</gr-badge></div>
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-page-layout>

<gr-dialog header="New Team" [(visible)]="showCreate" width="420px">
  @if (error(); as message) {
    <gr-message-banner type="error">{{ message }}</gr-message-banner>
  }
  <app-name-fields
    noun="team"
    [names]="names"
    [(displayName)]="form.displayName"
    [(name)]="form.name"
    (submitted)="create()"
  />
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="showCreate.set(false)"></button>
    <button grButton label="Create" [loading]="creating()" [disabled]="!canSubmit()" (click)="create()"></button>
  </div>
</gr-dialog>
