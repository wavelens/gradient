<gr-page-layout width="settings" [breadcrumb]="breadcrumb()" title="Secrets" subtitle="Values for exec jobs, set here and never shown again">
  <a slot="actions" grButton label="Docs" icon="open_in_new" severity="secondary" [href]="docsUrl" target="_blank" rel="noopener noreferrer"></a>
  <button slot="actions" *appWritable="access()" grButton label="Set secret" icon="add" (click)="startCreate()"></button>

  @if (!access().canEdit) {
    <gr-load-state [error]="missingPermission()" />
  } @else {
    <gr-load-state
      [loading]="loading()"
      [error]="loadError()"
      [empty]="secrets().length === 0"
      loadingMessage="Loading secrets..."
      errorTitle="Failed to load secrets"
      emptyIcon="key"
      emptyTitle="No secrets"
      emptyMessage="Exec jobs read a secret by listing its name."
      (retry)="loadSecrets()"
    >
      <gr-row-list>
        @for (secret of secrets(); track secret.name) {
          <gr-row icon="key">
            <span class="secret-name">{{ secret.name }}</span>
            @if (secret.managed) {
              <gr-badge severity="info">Managed</gr-badge>
            }
            <span slot="meta">
              Updated {{ secret.updated_at | relativeTime }}@if (secret.updated_by) { by {{ secret.updated_by }}}
            </span>
            <div slot="actions" class="phone-icon-buttons">
              <button
                *appWritable="access()"
                grButton
                label="Replace"
                icon="edit"
                severity="secondary"
                size="small"
                [disabledReason]="secret.managed ? managedItemDisabledReason : null"
                (click)="startReplace(secret)"
              ></button>
              <button
                *appWritable="access()"
                grButton
                label="Delete"
                icon="delete"
                severity="danger"
                size="small"
                [disabledReason]="secret.managed ? managedItemDisabledReason : null"
                (click)="startDelete(secret.name)"
              ></button>
            </div>
          </gr-row>
        }
      </gr-row-list>
    </gr-load-state>
  }

  @if (sopsRecipient(); as recipient) {
    <gr-settings-section
      title="Repository Sops Files"
      description="Encrypt sops files in the repository for this recipient, derived from the project SSH key."
    >
      <gr-form-field
        label="Sops recipient"
        for="sops-recipient"
        [hint]="recipient.age ? undefined : 'Use this SSH key as the age recipient (sops 3.10 or newer)'"
      >
        <gr-label-help slot="label" doc="exec/secrets/#3-encrypt-repository-sops-files" title="Encrypt repository sops files" />
        <gr-copy-field inputId="sops-recipient" [value]="recipient.age ?? recipient.ssh" />
      </gr-form-field>
    </gr-settings-section>
  }
</gr-page-layout>

<gr-dialog
  [header]="replacing() ? 'Replace secret' : 'Set secret'"
  [visible]="formOpen()"
  (visibleChange)="$event || closeForm()"
  [error]="formError()"
  [busy]="saving()"
  width="520px"
>
  <gr-form-field
    label="Name"
    for="secret-name"
    hint="Lowercase letters, digits and dashes, up to 64 characters"
    [invalid]="nameInvalid()"
    error="Start with a letter or digit, then use lowercase letters, digits and dashes"
  >
    <input
      grInput
      id="secret-name"
      autocomplete="off"
      placeholder="e.g. wandb-token"
      [disabled]="replacing()"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
  </gr-form-field>
  <gr-form-field label="Value" for="secret-value" hint="Stored encrypted, never shown again">
    <textarea
      grInput
      id="secret-value"
      rows="4"
      autocomplete="off"
      spellcheck="false"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
    ></textarea>
  </gr-form-field>
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="closeForm()" [disabled]="saving()"></button>
    <button grButton label="Save" icon="check" (click)="save()" [loading]="saving()" [disabled]="!canSave()"></button>
  </div>
</gr-dialog>
