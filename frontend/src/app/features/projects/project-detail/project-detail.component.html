@if (project(); as project) {
  <gr-page-layout [breadcrumb]="breadcrumb()" [title]="project.display_name" [subtitle]="project.description || 'No description'">
  <div slot="actions">
    @if (project.role) {
      <button grButton label="Create Task" icon="add" (click)="openCreateDialog()"></button>
      <a grButton label="Settings" icon="settings" severity="secondary" [routerLink]="['/project', projectName, 'settings']"></a>
    }
    @if (authService.isAuthenticated()) {
      <gr-star-button labeled [target]="starTarget" [(starred)]="starred" />
    }
  </div>
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="tasks().length === 0"
    loadingMessage="Loading project..."
    errorTitle="Failed to load tasks"
    emptyIcon="folder"
    emptyTitle="No tasks yet"
    [emptyMessage]="project.role ? 'Create your first task to start evaluating Nix builds' : 'No tasks have been created yet'"
    (retry)="loadTasks()"
  >
    @if (project.role) {
      <button slot="empty-action" grButton label="Create Task" (click)="openCreateDialog()"></button>
    }
    <div class="section">
      <h2>Tasks</h2>
      <gr-card-grid>
        @for (task of tasks(); track task.id) {
          <gr-nav-card
            icon="folder"
            [title]="task.display_name || task.name"
            [description]="task.description || 'No description'"
            [link]="['/project', projectName, 'task', task.name]"
          >
            <div slot="meta">
              @if (task.last_evaluation_status) {
                <gr-eval-status-badge [status]="task.last_evaluation_status" />
              }
            </div>
          </gr-nav-card>
        }
      </gr-card-grid>
    </div>
  </gr-load-state>
</gr-page-layout>
}

<!-- Create Task Dialog -->
<gr-dialog
header="Create Task"
[(visible)]="showCreateDialog"
[error]="createError()"
width="550px"
>
<div>
  <app-name-fields
    noun="task"
    [names]="names"
    [(displayName)]="newTask.display_name"
    [(name)]="newTask.name"
    (submitted)="createTask()"
  />

  <gr-form-field label="Description" for="proj-desc">
    <textarea
      grInput
      id="proj-desc"
      [(ngModel)]="newTask.description"
      placeholder="Describe your task..."
      rows="2"
    ></textarea>
  </gr-form-field>

  <gr-form-field
    label="Repository URL *"
    for="proj-repo"
    hint="Git repository URL to evaluate"
    [invalid]="!!repositoryError"
    [error]="repositoryError ?? ''"
  >
    <gr-label-help slot="label" doc="concepts/projects-and-tasks/#repository-url" title="Accepted forms: ssh://git@host/path, git@host:path, https://host/path" />
    <input
      grInput
      id="proj-repo"
      [(ngModel)]="newTask.repository"
      placeholder="https://github.com/user/repo"
      (keyup.enter)="createTask()"
    />
  </gr-form-field>

  <gr-form-field
    label="Evaluation Wildcard"
    for="proj-wildcard"
    [invalid]="wildcardInvalid"
    error="Each pattern must be non-empty, not start with a period, and contain no spaces."
    hint="Pattern for selecting which outputs to evaluate (default: packages.x86_64-linux.*)"
  >
    <gr-label-help slot="label" doc="reference/wildcards/" title="Learn about evaluation wildcards" />
    <input
      grInput
      id="proj-wildcard"
      [(ngModel)]="newTask.wildcard"
      placeholder="**"
      (keyup.enter)="createTask()"
    />
  </gr-form-field>
</div>

<div grDialogFooter>
  <button
    grButton
    label="Cancel"
    severity="secondary"
    (click)="showCreateDialog.set(false)"
    [disabled]="creating()"
  ></button>
  <button
    grButton
    label="Create"
    (grSubmit)="createTask()"
    [disabled]="!newTask.name || !newTask.display_name || !newTask.repository || wildcardInvalid || names.blocksSubmit() || creating()"
    [loading]="creating()"
  ></button>
</div>
</gr-dialog>
