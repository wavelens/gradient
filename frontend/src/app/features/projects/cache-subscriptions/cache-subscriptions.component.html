<gr-page-layout [breadcrumb]="[{ label: projectDisplayName() || projectName, link: ['/project', projectName] }, { label: 'Settings', link: ['/project', projectName, 'settings'] }, { label: 'Cache Subscriptions' }]" title="Cache Subscriptions" subtitle="Nix binary caches this project pushes builds to">
  <button slot="actions"
      *appWritable="access()"
      grButton
      label="Subscribe to Cache"
      icon="add"
      [appManagedDisable]="access()"
      (click)="openSubscribeDialog()"
    ></button>
  @if (loading()) {
    <gr-loading-spinner message="Loading cache subscriptions..." />
  } @else {
    @if (caches().length === 0) {
      <div class="empty-state">
        <gr-icon name="storage" size="xl" />
        <h3>No cache subscriptions</h3>
        <p class="text-secondary">Subscribe to a Nix binary cache to have builds pushed there automatically.</p>
        <button
          *appWritable="access()"
          grButton
          label="Subscribe to Cache"
          icon="add"
          [appManagedDisable]="access()"
          (click)="openSubscribeDialog()"
        ></button>
      </div>
    } @else {
      <div class="caches-list">
        @for (cache of caches(); track cache.id) {
          <div class="cache-row">
            <div class="cache-info">
              <gr-icon name="storage" />
              <a [routerLink]="['/caches', cache.name]" class="cache-name">{{ cache.name }}</a>
            </div>
            <div class="cache-actions">
              <button
                *appWritable="access()"
                grButton
                label="Unsubscribe"
                icon="close"
                severity="danger"
                [loading]="unsubscribingId() === cache.id"
                [disabled]="unsubscribingId() !== null"
                [appManagedDisable]="access()"
                (click)="unsubscribeCache(cache)"
              ></button>
            </div>
          </div>
        }
      </div>
    }
  }
</gr-page-layout>

<!-- Subscribe Dialog -->
<gr-dialog
  header="Subscribe to Cache"
  [(visible)]="showSubscribeDialog"
  width="440px"
>
  @if (errorMessage()) {
    <div class="dialog-error">
      <gr-icon name="error" />
      {{ errorMessage() }}
    </div>
  }
  <gr-form-field label="Cache Name" for="cache-name" hint="The name of the binary cache you own.">
    <gr-autocomplete
      inputId="cache-name"
      [(ngModel)]="newCacheName"
      [suggestions]="cacheSuggestions()"
      (completeMethod)="onCacheSearch($event)"
      placeholder="e.g. my-cache"
      [forceSelection]="false"
      (enter)="subscribeCache()"
    />
  </gr-form-field>
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="showSubscribeDialog.set(false)" [disabled]="subscribing()"></button>
    <button
      grButton
      label="Subscribe"
      icon="check"
      (click)="subscribeCache()"
      [loading]="subscribing()"
      [disabled]="subscribing() || !newCacheName.trim()"
    ></button>
  </div>
</gr-dialog>
