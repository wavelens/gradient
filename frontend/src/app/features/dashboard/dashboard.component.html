<gr-page-layout title="Dashboard" maxWidth="1240px">
  <div class="layout" [class.layout--start]="newUser()">
    <div class="main">
      @if (newUser()) {
        <app-dashboard-start />
      } @else if (newUser() === false) {
        <app-dashboard-stats />
        <button type="button" class="palette-trigger" (click)="palette.open()">
          <span>Jump to project, task, cache, commit, or paste a store path / hash</span>
          <kbd>{{ paletteKey }}</kbd>
        </button>
        <app-dashboard-task-table />
        <app-dashboard-activity />
      } @else {
        <p class="loading">Loading dashboard...</p>
      }
    </div>
    <app-dashboard-rail [class.hidden]="newUser()" (empty)="newUser.set($event)" />
  </div>
</gr-page-layout>
