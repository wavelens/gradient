<div class="page">
  <h1 class="sr-only">Dashboard</h1>
  @if (pending.count(); as count) {
    <gr-message-banner class="pending-requests" type="info" icon="mail">
      {{ plural(count, 'request') }} {{ count === 1 ? 'needs' : 'need' }} a decision
      <a [routerLink]="links.settings('invites')">View requests</a>
    </gr-message-banner>
  }
  @if (failedDashboardSectionComponents().length) {
    <gr-message-banner type="error">
      Couldn't load {{ failedSectionNamesForErrorBanner() }}.
      <button grButton size="small" [text]="true" label="Retry" (click)="retryFailedSections()"></button>
    </gr-message-banner>
  }
  <div class="layout" [class.layout--start]="newUser()">
    @if (newUser()) {
      <app-dashboard-start />
    } @else {
      <app-dashboard-stats />
      <app-dashboard-task-table />
    }
    <app-dashboard-rail
      [class.hidden]="newUser()"
      (empty)="newUser.set($event)"
    />
    @if (!newUser()) {
      <app-dashboard-activity />
    }
  </div>
</div>
