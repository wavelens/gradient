<div class="page">
  <h1 class="sr-only">Dashboard</h1>
  @if (invites.count(); as count) {
    <gr-message-banner class="invites-banner" type="info" icon="mail">
      {{ count === 1 ? '1 pending invitation' : count + ' pending invitations' }}
      <a [routerLink]="links.settings('invites')">Review invitations</a>
    </gr-message-banner>
  }
  @if (failedDashboardSectionComponents().length) {
    <gr-message-banner type="error">
      Couldn't load the dashboard.
      <button grButton size="small" [text]="true" label="Retry" (click)="retryFailedSections()"></button>
    </gr-message-banner>
  }
  <div class="layout" [class.layout--start]="newUser()">
    <div class="main">
      @if (newUser()) {
        <app-dashboard-start />
      } @else {
        @if (hasAnyProject() !== false) {
          <app-dashboard-stats />
        }
        <app-dashboard-task-table />
        <app-dashboard-activity />
      }
    </div>
    <app-dashboard-rail
      [class.hidden]="newUser()"
      (empty)="newUser.set($event)"
      (hasProjectsOrLoadFailed)="hasAnyProject.set($event)"
    />
  </div>
</div>
