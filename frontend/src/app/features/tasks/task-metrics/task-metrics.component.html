<gr-page-layout [breadcrumb]="[{ label: projectDisplayName() || projectName, link: ['/project', projectName] }, { label: taskDisplayName() || taskName, link: ['/project', projectName, 'task', taskName] }, { label: 'Metrics' }]" title="Task Metrics" [subtitle]="'Build and evaluation statistics over the last ' + (keepEvaluations()) + ' completed evaluations.'">
  @if (loading()) {
    <gr-loading-spinner message="Loading metrics..." />
  } @else if (metrics().length === 0) {
    <gr-empty-state icon="bar_chart" title="No completed evaluations yet." />
  } @else {
    <div class="charts-grid">

      <gr-metric-chart
        title="Total Build Time"
        subtitle="Sum of all completed build durations"
        type="area"
        [height]="200"
        [series]="buildTimeSeries()"
        [categories]="labels()"
        [colors]="buildTimeColor"
        [valueFormatter]="formatSeconds"
        yAxisTitle="seconds"
      />

      <gr-metric-chart
        title="Evaluation Time"
        subtitle="Wall-clock time from start to finish"
        type="area"
        [height]="200"
        [series]="evalTimeSeries()"
        [categories]="labels()"
        [colors]="evalTimeColor"
        [valueFormatter]="formatSeconds"
        yAxisTitle="seconds"
      />

      <gr-metric-chart
        title="Output Size"
        subtitle="Entry-point packages only, excluding dependencies"
        type="area"
        [height]="200"
        [series]="outputSizeSeries()"
        [categories]="labels()"
        [colors]="outputSizeColor"
        [valueFormatter]="formatSize"
      />

      <gr-metric-chart
        title="Closure Size"
        subtitle="All packages including transitive dependencies"
        type="area"
        [height]="200"
        [series]="closureSizeSeries()"
        [categories]="labels()"
        [colors]="closureSizeColors"
        [valueFormatter]="formatSize"
      />

      <gr-metric-chart
        class="chart--full"
        title="Dependencies Count"
        subtitle="Number of dependency builds (excluding entry points)"
        type="area"
        [height]="200"
        [series]="depsSeries()"
        [categories]="labels()"
        [colors]="depsColor"
        [valueFormatter]="formatDeps"
      />

    </div>
  }
</gr-page-layout>
