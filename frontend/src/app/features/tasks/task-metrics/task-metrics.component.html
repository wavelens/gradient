<gr-page-layout [breadcrumb]="breadcrumb()" title="Task Metrics" [subtitle]="'Build and evaluation statistics for the last ' + (keepEvaluations()) + ' evaluations that completed or failed.'">
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="metrics().length === 0"
    loadingMessage="Loading metrics..."
    errorTitle="Failed to load task metrics"
    emptyIcon="bar_chart"
    emptyTitle="No completed or failed evaluations yet."
    (retry)="load()"
  >
    <div class="charts-grid">

      <gr-metric-chart
        title="Total Build Time"
        subtitle="Sum of all completed build durations"
        type="area"
        [height]="200"
        [series]="buildTimeSeries()"
        [categories]="labels()"
        [colors]="buildTimeColor"
        [valueFormatter]="formatDuration"
      />

      <gr-metric-chart
        title="Evaluation Time"
        subtitle="Wall-clock time from start to finish"
        type="area"
        [height]="200"
        [series]="evalTimeSeries()"
        [categories]="labels()"
        [colors]="evalTimeColor"
        [valueFormatter]="formatDuration"
      />

      <gr-metric-chart
        title="Output Size"
        subtitle="Entry-point packages only, excluding dependencies"
        type="area"
        [height]="200"
        [series]="outputSizeSeries()"
        [categories]="labels()"
        [colors]="outputSizeColor"
        [valueFormatter]="formatBytes"
      />

      <gr-metric-chart
        title="Closure Size"
        subtitle="All packages including transitive dependencies"
        type="area"
        [height]="200"
        [series]="closureSizeSeries()"
        [categories]="labels()"
        [colors]="closureSizeColors"
        [valueFormatter]="formatBytes"
      />

      <gr-metric-chart
        class="chart--full"
        title="Dependencies Count"
        subtitle="Number of dependency builds (excluding entry points)"
        type="area"
        [height]="200"
        [series]="depsSeries()"
        [categories]="labels()"
        [colors]="depsColor"
        [valueFormatter]="formatDeps"
      />

    </div>
  </gr-load-state>
</gr-page-layout>
