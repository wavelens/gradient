<gr-page-layout [breadcrumb]="breadcrumb()" [title]="shortEntryPointName()" [subtitle]="'Build history for the last ' + (keepEvaluations()) + ' evaluations that completed or failed.'">
  @if (newestBuildHistoryMetricPoint(); as newest) {
    <a slot="actions" grButton label="View Closure" icon="account_tree" severity="secondary"
      [disabledReason]="closureDisabledReason()"
      [routerLink]="links.closure(projectName, 'build', newest.build_id, { task: taskName, evaluation: newest.evaluation_id })"></a>
  }
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="points().length === 0"
    loadingMessage="Loading metrics..."
    errorTitle="Failed to load metrics for entry points"
    emptyIcon="monitoring"
    emptyTitle="No completed or failed evaluations found for this entry point."
    (retry)="load()"
  >
    <div class="summary-row">
      @for (s of buildStatusCounts(); track s.status) {
        <div class="summary-card">
          <span class="summary-value" [class.success]="s.phase === 'success'" [class.error]="s.phase === 'failure'">{{ s.count }}</span>
          <span class="summary-label">{{ s.label }}</span>
        </div>
      }
      <div class="summary-card">
        <span class="summary-value">{{ points().length }}</span>
        <span class="summary-label">Total evaluations</span>
      </div>
    </div>

    <div class="charts-grid">
      <gr-metric-chart
        title="Build Time"
        explanationText="Time to build this package per evaluation"
        type="area"
        [height]="200"
        [series]="buildTimeSeries()"
        [categories]="labels()"
        [colors]="buildTimeColor"
        [valueFormatter]="formatDuration"
      />

      <gr-metric-chart
        title="Output Size"
        explanationText="Size of this package's build output per evaluation"
        type="area"
        [height]="200"
        [series]="outputSizeSeries()"
        [categories]="labels()"
        [colors]="outputSizeColor"
        [valueFormatter]="formatBytes"
      />

      <gr-metric-chart
        title="Closure Size"
        explanationText="Size including all transitive dependencies"
        type="area"
        [height]="200"
        [series]="closureSizeSeries()"
        [categories]="labels()"
        [colors]="closureSizeColors"
        [valueFormatter]="formatBytes"
      />

      <gr-metric-chart
        title="Dependencies Count"
        explanationText="Number of transitive dependency builds"
        type="area"
        [height]="200"
        [series]="depsSeries()"
        [categories]="labels()"
        [colors]="depsColor"
        [valueFormatter]="formatDeps"
      />
    </div>
  </gr-load-state>
</gr-page-layout>
