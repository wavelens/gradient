<gr-page-layout width="settings" [breadcrumb]="breadcrumb()" title="Flake inputs">
  <app-task-settings-navigation slot="settings-navigation" [projectUrlName]="projectName" [taskUrlName]="taskName" />
  @if (access().canEdit) {
    <a slot="actions" grButton label="Open the Repository page" icon="hub" severity="secondary"
       [routerLink]="links.taskPage(projectName, taskName, 'repository')"></a>
  }
  @if (overrides().length) {
    <button slot="actions"
        *appWritable="access()"
        grButton
        label="New Override"
        icon="add"
        (click)="startCreate()"
      ></button>
  }
  <app-settings-access-state-badge slot="after-title" [access]="access()" kind="task" permission="editTask" showReadOnlyNote />
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="overrides().length === 0"
    loadingMessage="Loading overrides..."
    errorTitle="Failed to load flake inputs"
    emptyIcon="tune"
    emptyTitle="No overrides configured"
    emptyMessage="Evaluations use the task's flake.lock unchanged."
    (retry)="loadOverrides()"
  >
    <button slot="empty-action"
      *appWritable="access()"
      grButton
      label="New Override"
      icon="add"
      (click)="startCreate()"
      ></button>
      <div class="overrides-list">
        @for (override of overrides(); track override.id) {
          <div class="override-row">
            <div class="override-header">
              <div class="override-info">
                <div>
                  <div class="override-name">{{ override.input_name }}</div>
                  <div class="override-meta text-secondary">
                    @if (isPattern(override)) {
                      <gr-badge severity="warning">Glob</gr-badge>
                    }
                    <gr-badge [severity]="override.url === null ? 'success' : 'info'">
                      {{ modeLabel(override) }}
                    </gr-badge>
                    @if (override.url !== null) {
                      <span class="override-url">{{ override.url }}</span>
                    }
                  </div>
                </div>
              </div>
              <div class="override-actions">
                <button
                  *appWritable="access()"
                  grButton
                  label="Edit"
                  icon="edit"
                  severity="secondary"
                  size="small"
                  (click)="startEdit(override)"
                ></button>
                <button
                  *appWritable="access()"
                  grButton
                  label="Delete"
                  icon="delete"
                  severity="danger"
                  size="small"
                  (click)="deleteOverride(override)"
                ></button>
              </div>
            </div>
          </div>
        }
      </div>
  </gr-load-state>
</gr-page-layout>

<!-- Create Dialog -->
<gr-dialog
  header="New Override"
  [(visible)]="showCreateDialog"
  [error]="error()"
  [busy]="saving()"
  width="520px"
  (hide)="cancelEdit()"
>
  <ng-container *ngTemplateOutlet="overrideForm"></ng-container>
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="showCreateDialog.set(false)" [disabled]="saving()"></button>
    <button grButton label="Create" icon="check" (click)="saveCreate()" [loading]="saving()" [disabled]="saving()"></button>
  </div>
</gr-dialog>

<!-- Edit Dialog -->
<gr-dialog
  header="Edit Override"
  [(visible)]="showEditDialog"
  [error]="error()"
  [busy]="saving()"
  width="520px"
  (hide)="cancelEdit()"
>
  <ng-container *ngTemplateOutlet="overrideForm"></ng-container>
  <div grDialogFooter>
    <button grButton label="Cancel" severity="secondary" (click)="showEditDialog.set(false)" [disabled]="saving()"></button>
    <button grButton label="Save" icon="check" (click)="saveEdit()" [loading]="saving()" [disabled]="saving()"></button>
  </div>
</gr-dialog>

<!-- Shared form template -->
<ng-template #overrideForm>
  <gr-form-field label="Input Name" for="fi-input-name" required
    [invalid]="(submitAttempted() || inputNameModel.dirty) && !!inputNameError" [error]="inputNameError ?? ''">
    <gr-label-help slot="label" doc="guides/flake-updates/#1-track-the-inputs" title="Track flake inputs"
      explanationText="Input name from your flake.nix, or a glob like nixpkgs* / * to match many. A literal name wins over a glob." />
    <input
      grInput
      id="fi-input-name"
      [(ngModel)]="form.input_name"
      #inputNameModel="ngModel"
      placeholder="nixpkgs or nixpkgs*"
      (keyup.enter)="submitForm()"
    />
  </gr-form-field>

  <gr-checkbox
      inputId="fi-keep-url"
      [(ngModel)]="form.keepUrl"
      [binary]="true"
    label="Force update using the URL declared in flake.nix"
  />

  @if (!form.keepUrl) {
    <gr-form-field label="URL" for="fi-url" required hint="URL of the Nix flake for this input. Pin to a commit (recommended), for example github:NixOS/nixpkgs/<commit> or ?rev=<commit>."
      [warning]="unpinnedUrlWarning"
      [invalid]="(submitAttempted() || urlModel.touched) && !!urlError" [error]="urlError ?? ''">
      <input
        grInput
        id="fi-url"
        [(ngModel)]="form.url"
        #urlModel="ngModel"
        placeholder="github:NixOS/nixpkgs/<commit>"
        (keyup.enter)="submitForm()"
      />
    </gr-form-field>
  }
</ng-template>
