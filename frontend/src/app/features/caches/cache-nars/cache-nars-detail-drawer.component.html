<gr-dialog
  header="NAR details"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  width="640px"
>
  @if (loading()) {
    <gr-loading-spinner message="Loading NAR..." />
  } @else if (error()) {
    <div class="dialog-error">
      <gr-icon name="error" />
      {{ error() }}
    </div>
  } @else if (detail(); as d) {
    <div class="detail-grid">
      <gr-field-row label="Hash" [value]="d.hash" mono />
      <gr-field-row label="Package" [value]="d.package" />
      <gr-field-row label="Store path" [value]="d.store_path" mono />
      <gr-field-row label="NAR hash" [value]="d.nar_hash ?? '-'" mono />
      <gr-field-row label="File hash" [value]="d.file_hash ?? '-'" mono />
      <gr-field-row label="NAR size" [value]="formatBytes(d.nar_size)" />
      <gr-field-row label="File size" [value]="formatBytes(d.file_size)" />
      <gr-field-row label="Deriver" [value]="d.deriver ?? '-'" mono />
      <gr-field-row label="CA" [value]="d.ca ?? '-'" mono />
      <gr-field-row label="Fetch count" [value]="d.fetch_count" />
      <gr-field-row label="Last fetched" [value]="d.last_fetched_at ?? 'never'" />
      <gr-field-row label="Created" [value]="d.created_at" />
      <gr-field-row label="Signed">
        <gr-badge [severity]="d.signed ? 'success' : 'neutral'">
          {{ d.signed ? 'Signed' : 'Unsigned' }}
        </gr-badge>
      </gr-field-row>
      <div class="references-row">
        <span class="references-label">References ({{ d.references.length }})</span>
        @if (d.references.length === 0) {
          <span class="text-secondary">none</span>
        } @else {
          <ul class="references-list">
            @for (r of d.references; track r) {
              <li><code class="mono">{{ r }}</code></li>
            }
          </ul>
        }
      </div>
    </div>
  }
  <div grDialogFooter>
    <button grButton label="Close" severity="secondary" (click)="onVisibleChange(false)"></button>
  </div>
</gr-dialog>
