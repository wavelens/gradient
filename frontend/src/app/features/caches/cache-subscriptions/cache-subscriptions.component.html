<gr-page-layout
  [breadcrumb]="breadcrumb()"
  title="Subscriptions"
  subtitle="Projects asking to use this cache"
>
  <gr-load-state
    [loading]="loading()"
    [error]="loadError()"
    [empty]="requests().length === 0"
    loadingMessage="Loading subscription requests..."
    errorTitle="Failed to load subscription requests"
    emptyIcon="hub"
    emptyTitle="No pending requests"
    emptyMessage="A project that asks to subscribe to this cache appears here for approval."
    (retry)="load()"
  >
    <gr-row-list>
      @for (request of requests(); track request.project) {
        <gr-row icon="folder">
          {{ request.project_display_name }}
          <span slot="meta">
            Requested by {{ request.requested_by }} ·
            {{ request.created_at | date: 'medium' }}
          </span>
          <button
            slot="actions"
            grButton
            label="Approve"
            icon="check"
            [loading]="deciding() === request.project"
            [disabled]="deciding() !== null"
            (click)="approve(request.project)"
          ></button>
          <button
            slot="actions"
            grButton
            label="Deny"
            icon="close"
            severity="danger"
            [disabled]="deciding() !== null"
            (click)="deny(request.project)"
          ></button>
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-page-layout>
