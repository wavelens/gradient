<gr-page-layout width="form" [title]="packageName() || 'Artefacts'" [breadcrumb]="breadcrumb()">
  <gr-load-state [loading]="loading()" [error]="loadError()" [empty]="artefacts().length === 0"
                 loadingMessage="Loading artefacts..." errorTitle="Failed to load artefacts" (retry)="loadArtefacts()">
    <gr-empty-state slot="empty" icon="inventory_2" title="No artefacts available for this build.">
      <span class="empty-hint">Artefacts are produced via <code>hydra-build-products</code> in the build output.</span>
    </gr-empty-state>
    <gr-row-list>
      @for (artefact of artefacts(); track artefact.name) {
        <gr-row>
          <gr-badge>{{ fileTypeLabel(artefact) }}</gr-badge>
          {{ artefact.name }}
          @if (artefact.size != null) {
            <span slot="meta">{{ formatBytes(artefact.size) }}</span>
          }
          @if (isHtml(artefact)) {
            <a
              slot="actions"
              grButton
              severity="secondary"
              [href]="openArtefactInBrowserUrl(artefact)"
              target="_blank"
              rel="noopener noreferrer"
              [title]="'Open ' + artefact.name"
              icon="open_in_new"
              label="Open"
            ></a>
          } @else {
            <button
              slot="actions"
              grButton
              type="button"
              severity="secondary"
              [title]="'Download ' + artefact.name"
              icon="download"
              label="Download"
              [loading]="artefactNameBeingDownloaded() === artefact.name"
              (click)="downloadBuildArtefactFile(artefact)"
            ></button>
          }
        </gr-row>
      }
    </gr-row-list>
  </gr-load-state>
</gr-page-layout>
