@if (outputs().length > 0) {
  <div class="sidebar-group-header">
    Outputs
    <span class="sidebar-group-count">{{ size(job().outputs_size) }}</span>
  </div>
  @for (output of outputs(); track output.path) {
    <div class="sidebar-item" [title]="output.path + ', updated ' + time(output.updated_at)">
      <a class="sidebar-item-label mono" [href]="url(output.path)">{{ output.path }}</a>
      <span class="size">{{ size(output.size) }}</span>
    </div>
  }
}
