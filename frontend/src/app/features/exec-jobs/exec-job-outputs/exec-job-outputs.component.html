@if (outputs().length > 0) {
  <h3>Outputs <span class="muted">{{ size(job().outputs_size) }}</span></h3>
  <gr-table class="outputs">
    <thead>
      <tr><th>Path</th><th>Size</th><th>Updated</th></tr>
    </thead>
    <tbody>
      @for (output of outputs(); track output.path) {
        <tr>
          <td class="path"><a class="mono" [href]="url(output.path)">{{ output.path }}</a></td>
          <td class="size">{{ size(output.size) }}</td>
          <td>{{ time(output.updated_at) }}</td>
        </tr>
      }
    </tbody>
  </gr-table>
}
