<gr-table class="kv requested">
  <tbody>
    @for (field of fields(); track field.label) {
      <tr>
        <td class="label">{{ field.label }}</td>
        <td class="value">
          <div class="values">
            @for (value of field.values; track value) {
              <span class="mono">{{ value }}</span>
            }
          </div>
        </td>
      </tr>
    }
  </tbody>
</gr-table>
