<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <gr-logo class="auth-logo" />
      <h1>Sign In</h1>
      <p class="text-secondary">Welcome back to Gradient</p>
    </div>

    @if (errorMessage()) {
      <gr-message-banner type="error">{{ errorMessage() }}</gr-message-banner>
    }

    @if (!oidcRequired) {
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <gr-form-field
          label="Username or Email"
          for="username"
          [control]="loginForm.get('username')"
          error="Username or email is required"
        >
          <input
            type="text"
            id="username"
            formControlName="username"
            grInput
            placeholder="Enter your username or email"
            autocomplete="username"
          />
        </gr-form-field>

        <gr-form-field
          label="Password"
          for="password"
          [control]="loginForm.get('password')"
          error="Password is required"
        >
          <gr-password-input
            inputId="password"
            formControlName="password"
            placeholder="Enter your password"
          />
        </gr-form-field>

        <gr-checkbox inputId="rememberMe" formControlName="rememberMe" label="Remember me" />

        <button
          grButton
          type="submit"
          class="w-full"
          [label]="loading() ? 'Signing in...' : 'Sign In'"
          [loading]="loading()"
          [disabled]="!loginForm.valid || loading()"
        ></button>
      </form>
    }

    @if (oidcEnabled) {
      @if (!oidcRequired) {
        <div class="auth-divider">
          <span>OR</span>
        </div>
      }
      <button
        grButton
        type="button"
        class="w-full"
        severity="secondary"
        icon="login"
        label="Sign in with SSO"
        (click)="loginWithOIDC()"
      ></button>
    }

    @if (!registrationDisabled) {
      <div class="auth-footer">
        Don't have an account?
        <a routerLink="/account/register">Sign up</a>
      </div>
    }
  </div>
</div>
