<div class="stat-card" [class.compact]="compact()">
  @if (icon(); as name) {
    <div class="stat-icon">
      <gr-icon [name]="name" size="xl" />
    </div>
  }
  <div class="stat-content">
    <div class="stat-value">
      @if (value() === null) {
        <gr-skeleton width="5ch" height="1lh" />
      } @else {
        {{ value() }}
      }
    </div>
    <span class="stat-label">{{ label() }}</span>
    @if (valueExplanation(); as explanation) {
      <button
        type="button"
        class="stat-label-explanation-button"
        [grTooltip]="explanation"
        tooltipPosition="bottom"
        [attr.aria-label]="'About ' + label()"
        [attr.aria-describedby]="valueExplanationDescriptionId"
      >
        <gr-icon name="info" size="sm" />
      </button>
      <span hidden [id]="valueExplanationDescriptionId">{{ explanation }}</span>
    }
  </div>
</div>
