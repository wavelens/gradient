<input
  type="text"
  class="gr-input gr-autocomplete__input"
  role="combobox"
  aria-autocomplete="list"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  [attr.id]="inputId() || null"
  [value]="text()"
  [placeholder]="placeholder()"
  [disabled]="isDisabled()"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="autocompleteListboxId"
  [attr.aria-activedescendant]="expanded() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
  (click)="openSuggestionPanelAndRequestSuggestionsForCurrentText()"
  (blur)="onBlur()"
/>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="expanded()"
  [cdkConnectedOverlayWidth]="panelWidth() || 0"
  (detach)="open.set(false)"
>
  <ul
    class="gr-autocomplete__panel"
    role="listbox"
    [id]="autocompleteListboxId"
    [attr.aria-label]="suggestionListboxAccessibleName()"
    (mousedown)="$event.preventDefault()"
  >
    @for (suggestion of options(); track $index) {
      <li
        role="option"
        class="gr-autocomplete__option"
        [id]="optionId($index)"
        [class.gr-autocomplete__option--active]="$index === activeIndex()"
        [attr.aria-selected]="$index === activeIndex()"
        (click)="pick(suggestion)"
      >{{ suggestion.label }}@if (suggestion.textBelowLabel) {<small class="gr-autocomplete__option-text-below-label">{{ suggestion.textBelowLabel }}</small>}</li>
    }
  </ul>
</ng-template>
