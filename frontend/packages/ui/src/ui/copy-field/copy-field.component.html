<div
  class="copy-field"
  [class.copy-field--inline]="inline()"
  [class.copy-field--multiline]="multiline()"
>
  @if (inline()) {
    <code class="copy-field__code">{{ value() }}</code>
  } @else if (multiline()) {
    <textarea
      grInput
      class="copy-field__input"
      [class.copy-field__input--mono]="mono()"
      [attr.id]="inputId() || null"
      [attr.aria-label]="name() ?? null"
      [value]="value()"
      readonly
    ></textarea>
  } @else {
    <input
      grInput
      class="copy-field__input"
      [class.copy-field__input--mono]="mono()"
      [attr.id]="inputId() || null"
      [attr.aria-label]="name() ?? null"
      [value]="value()"
      readonly
    />
  }
  <button
    grButton
    class="copy-field__button"
    type="button"
    [text]="true"
    [icon]="copied() ? 'check' : 'content_copy'"
    [severity]="copied() ? 'primary' : 'secondary'"
    [attr.aria-label]="copied() ? copiedLabel() : copyButtonAccessibleName()"
    (click)="copy()"
  ></button>
  <span class="copy-field__status" aria-live="polite">
    @if (copied()) {
      {{ copiedLabel() }}
    }
  </span>
</div>
