<div class="tab-switch" role="tablist" [attr.aria-label]="ariaLabel() || null" (keydown)="selectAndFocusTabOnTabListKeydown($event)">
  @for (option of options(); track $index) {
    <button
      type="button"
      role="tab"
      class="tab-switch__tab"
      [class.is-selected]="isSelected(option)"
      [attr.aria-selected]="isSelected(option)"
      [tabIndex]="$index === getFocusableTabIndex() ? 0 : -1"
      [disabled]="isDisabled()"
      (click)="pick(option)"
    >
      {{ labelOf(option) }}
    </button>
  }
</div>
