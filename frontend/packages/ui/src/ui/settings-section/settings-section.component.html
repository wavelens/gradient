<section class="settings-section" [class.is-danger]="danger()">
  @if (title()) {
    <header class="settings-section__header">
      <div class="settings-section__heading">
        <h2>{{ title() }}</h2>
        @if (description(); as text) {
          <gr-label-explanation-button [iconButtonAriaLabel]="'About ' + title()" [explanationText]="text" />
        }
      </div>
      <div class="settings-section__actions">
        <ng-content select="[slot=actions]"></ng-content>
      </div>
    </header>
  }
  <div class="settings-section__body" [class.settings-section__body--card]="card()">
    <ng-content></ng-content>
  </div>
</section>
