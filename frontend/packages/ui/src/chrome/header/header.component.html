@if (menuOpen()) {
  <div class="header-backdrop gr-dialog-backdrop" aria-hidden="true" (click)="closeMenu()"></div>
}

<header class="main-header" [class.menu-open]="menuOpen()">
  <div class="header-logo">
    <a [routerLink]="brand().href" [attr.aria-label]="brand().label">
      <gr-logo [src]="brand().logoUrl ?? null" />
      @if (brand().tagline; as tagline) {
        <span class="header-tagline">{{ tagline }}</span>
      }
    </a>
  </div>

  <div class="header-content">
    <div class="header-search">
      <ng-content select="[slot=search]" />
    </div>

    <div id="header-menu" class="header-menu" [grDrawer]="menuOpen()" (grDrawerClose)="closeMenu()">
      <nav class="header-nav" aria-label="Main">
        @for (item of navigationLinksWithCurrentPageSignals(); track item.link.href) {
          <a [routerLink]="item.link.href" [class.active]="item.current()" [attr.aria-current]="item.current() ? 'page' : null">
            {{ item.link.label }}
          </a>
        }
      </nav>

      <div class="header-account">
        <ng-content select="[slot=actions]" />
        <ng-content select="[slot=lang]" />
      </div>
    </div>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="header-menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      <gr-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</header>
