version = 1

[[annotations]]
path = [
    "nix/tests/gradient/scheduler/specs/replay.nix",
    "nix/patches/**/*.patch",
    "nix/tests/store-spec/keys/*",
    "nix/tests/gradient/e2e/flake_repository*.lock",
    ".envrc",
    ".gitignore",
    ".github/CODEOWNERS",
    "backend/gradient-migration/src/*.sql",
    "docs/gradient-api.yaml",
    "backend/gradient-web/src/api.md",
    "frontend/src/app/core/models/api.generated.ts",
    "logo/**",
    "frontend/.editorconfig",
    "frontend/.gitignore",
    "frontend/.stylelintignore",
    "frontend/public/images/**",
    "docs/**/*.png",
    "**/Cargo.lock",
    "**/*.json",
    "flake.lock",
    "backend/gradient-ssh/testdata/**",
    "backend/gradient-wire/schema/*.txt",
    "nix/tests/bench/evalbench/fixtures/**/*.jsonl",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wavelens GmbH <info@wavelens.io>"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
    "frontend/public/fonts/inter/*",
    "frontend/public/fonts/space-mono/*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Inter and Space Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "frontend/public/fonts/material-icons/*",
    "frontend/public/fonts/material-symbols-outlined/*",
    "frontend/public/fonts/material-symbols-rounded/*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"
