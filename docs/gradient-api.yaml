openapi: 3.1.1
info:
  title: Gradient API
  description: |-
    Gradient is a Nix-based Continuous Integration system. It evaluates Nix flakes,
    schedules derivation builds across remote machines, and exposes build artefacts
    through an integrated binary cache.

    ## Authentication

    Most endpoints require authentication. Three methods are accepted:

    | Method | How to send | How to obtain |
    |---|---|---|
    | JWT (cookie) | `jwt_token` httpOnly cookie | Set automatically on login |
    | JWT (header) | `Authorization: Bearer <token>` | `POST /auth/basic/login` or OIDC flow |
    | API Key | `Authorization: Bearer GRAD<key>` | `POST /user/keys` |

    Cookie auth is the default for browser clients - the `jwt_token` cookie is set
    by the login and OIDC-callback endpoints and cleared on logout. The
    `Authorization` header is accepted as a fallback (e.g. for CI/scripts).

    ### Artefact downloads

    `GET /builds/{build}/download/{filename}` serves build artefacts declared in
    `nix-support/hydra-build-products`. Access is granted when any of the following
    conditions is met:

    - The owning project is **public** - no credentials required.
    - A short-lived (1 h) **download token** is supplied via `?token=<download_token>`.
      Obtain one from `GET /builds/{build}/download-token` while authenticated.
      Tokens are scoped to the build's derivation and are safe to embed in URLs.
    - A valid session (`jwt_token` cookie or `Authorization: Bearer` header) belonging
      to a member of the owning project, or of any project with a build of the
      same derivation (the rule every other build read uses).

    ## Rate limiting

    All HTTP endpoints enforce a per-client-IP token-bucket rate limit. The
    limiter keys solely on client IP, so authenticated and anonymous requests
    share the same tier. Clients that exceed their bucket receive HTTP
    `429 Too Many Requests`. The tier depends on the route:

    | Tier | Routes | Refill | Burst |
    |---|---|---|---|
    | auth | `/auth/basic/login`, `/auth/basic/register`, `/auth/check-username`, `/auth/verify-email`, `/auth/resend-verification`, `/auth/oauth/*`, `/auth/oidc/*` | 1 req / 6 s | 5 |
    | webhook | `/hooks/*` | 1 req / s | 30 |
    | cache | `/cache/{cache}/*` (public NAR surface) and `/cache/{cache}/proto` | 1 req / 20 ms | 3000 |
    | cache-inspect | `/cache/{cache}/{ls,serve}/*` | 1 req / 333 ms | 180 |
    | cache-log | `/cache/{cache}/log/*` | 1 req / 333 ms | 900 |
    | default | everything else | 1 req / 200 ms | 150 |

    Client IP is taken from `X-Forwarded-For` / `X-Real-IP` (deployments are
    expected behind a reverse proxy), falling back to the connection peer IP.

    ## Request Tracing

    Every response carries an `x-request-id` header. If the client (or an
    upstream reverse proxy) supplies an `x-request-id` on the request, it is
    preserved verbatim; otherwise the server mints a UUID v7. Use this id to
    correlate client-side traces with server logs - every log line emitted
    while the request is in flight (handler, DB, spawned cleanup tasks)
    carries the same id.

    ## Common Response Envelope

    Every JSON response is wrapped in a standard envelope:
    ```json
    { "error": false, "message": <payload> }
    ```
    On errors `"error"` is `true` and `"message"` contains the error description.

    ## Nix Binary Cache

    The integrated Nix binary cache lives outside `/api/v1`. Configure Nix with:
    ```
    substituters = https://gradient.example.com/cache/mycache
    trusted-public-keys = gradient.example.com-mycache:...
    ```
    The public key is returned by `GET /api/v1/caches/{cache}/public-key`.

    ## State Management

    Objects whose `managed` field is `true` are controlled by the NixOS module
    configuration and cannot be mutated through the API.
  contact:
    email: info@wavelens.io
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 1.4.1

externalDocs:
  description: Gradient documentation
  url: https://wavelens.github.io/gradient

servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development server
  - url: https://gradient.example.com/api/v1
    description: Production server

tags:
  - name: general
    description: Health check and server configuration
  - name: board
    description: Job Board - metric queries, live assigned jobs, workers, scoring, and expensive builds
  - name: webhooks
    description: Project, cache and instance webhooks for durable events
  - name: auth
    description: Authentication - login, register, OAuth/OIDC
  - name: user
    description: Current user profile, API keys, and settings
  - name: dashboard
    description: Personal dashboard - the viewer's task table, stat tiles and activity heatmap
  - name: projects
    description: Project management, members, SSH keys, cache subscriptions
  - name: teams
    description: Teams, their members, workers, grants and requests
  - name: tasks
    description: Task management and evaluation triggers
  - name: triggers
    description: Per-task evaluation triggers (polling, reporter_push, reporter_pull_request, time)
  - name: flake-inputs
    description: Per-task flake input URL overrides applied during evaluation fetch.
  - name: evals
    description: Evaluation details, status, and log streaming
  - name: builds
    description: Build details, logs, artefact downloads, and dependency graph
  - name: build-requests
    description: >-
      Ad-hoc build requests from `gradient build` - CLI-uploaded source
      evaluated under a per-project build-request task. Flake inputs served
      over `git+ssh://` are fetched using the project's SSH key, and
      `input_overrides` can override remote flake inputs for the run.
  - name: workers
    description: Worker registration and live status (proto workers connected via WebSocket)
  - name: caches
    description: Binary cache management
  - name: nix-cache
    description: Nix binary cache protocol, served at the server root
  - name: commits
    description: Commit records
  - name: actions
    description: Per-task Actions (Send Mail, Send Web Request, Git Host Status Report)
  - name: git-host-webhooks
    description: Incoming Git host webhooks (external Git hosts -> Gradient push triggers)
  - name: integrations
    description: Per-project named Git host integrations (inbound HMAC secrets + outbound API credentials)
  - name: admin
    description: Server-wide administrative endpoints. All routes require the caller to have the `superuser` flag.
  - name: scim
    description: SCIM 2.0 instance-level provisioning (Users + Groups), bearer-token authenticated, mounted at `/scim/v2` only when SCIM is enabled.

security:
  - bearerAuth: []

paths:

  # ── General ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [general]
      summary: Health check
      description: Returns `200 ALIVE` when the server is running. Does not require authentication.
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "200 ALIVE"

  /metrics:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [general]
      summary: Prometheus metrics
      description: |-
        Prometheus exposition endpoint. Disabled (404) until an operator
        configures `GRADIENT_METRICS_TOKEN_FILE`. Requires a Bearer token
        matching the contents of that file. Returns the standard Prometheus
        text format (version 0.0.4) with build, evaluation, scheduler, and
        cache metrics.
      operationId: getMetrics
      security:
        - metricsAuth: []
      responses:
        '200':
          description: Prometheus exposition (text/plain; version=0.0.4)
          content:
            text/plain:
              schema:
                type: string
                example: |-
                  # HELP gradient_info Build/version metadata; value is always 1.
                  # TYPE gradient_info gauge
                  gradient_info{version="1.1.1"} 1
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Metrics endpoint not configured on this server
        '429':
          description: Rate limit exceeded

  /config:
    get:
      tags: [general]
      summary: Server configuration
      description: Returns feature flags for the frontend (OIDC enabled, registration disabled, email verification).
      security: []
      operationId: getConfig
      responses:
        '200':
          description: Server configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ServerConfig'
              example:
                error: false
                message:
                  oidc_enabled: false
                  registration_enabled: false
                  email_verification_enabled: false
                  quic: false
                  create_project: everyone
                  create_cache: everyone
                  create_team: everyone
                  github_app_enabled: false
                  gradient_ci_enabled: true
                  gradient_ci_url: https://servers.gradient.ci

  /proto:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [general]
      summary: Binary WebSocket protocol endpoint
      description: |-
        Upgrades the connection to a WebSocket carrying binary frames encoded
        by the `Proto` derive of `gradient-wire`. The upgrade always succeeds; a
        server with `GRADIENT_PROTO_DISCOVERABLE=false` then rejects the
        handshake of a worker it did not dial itself with a `403` reject frame.

        **Protocol flow**
        1. Both sides send an 8-byte version frame (`GRAD`, oldest and newest
           supported version as `u16` little-endian) and encode every later
           frame for the highest shared version. Without one, the WebSocket
           closes with code `1002` and the reason.
        2. Client sends `ClientMessage::InitConnection { capabilities, id }`.
        3. Server responds with `ServerMessage::AuthChallenge`, then
           `ServerMessage::InitAck { capabilities, .. }` with the negotiated
           capabilities.
      security: []
      operationId: protoWebSocket
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful
        '503':
          description: Connection limit (`GRADIENT_PROTO_MAX_CONNECTIONS`) reached; retry after `Retry-After`

  # ── Auth ─────────────────────────────────────────────────────────────────────

  /auth/basic/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |-
        Creates a new user account. Fails if registration is disabled (OIDC-only mode)
        or if the username/email is already taken. When email verification is enabled,
        a verification email is sent and login is blocked until the address is confirmed.
      security: []
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeUserRequest'
            example:
              username: alice
              name: Alice Example
              email: alice@example.com
              password: "correct-horse-battery-staple"
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "User 3fa85f64-5717-4562-b3fc-2c963f66afa6 created successfully."
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/basic/login:
    post:
      tags: [auth]
      summary: Login with username/password
      description: |-
        Validates credentials and returns a signed JWT. Pass the token as
        `Authorization: Bearer <token>` on subsequent requests.
        `loginname` accepts either the username or the email address.
        Set `remember_me: true` for a long-lived token.
      security: []
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeLoginRequest'
            example:
              loginname: alice
              password: "correct-horse-battery-staple"
              remember_me: false
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/check-username:
    post:
      tags: [auth]
      summary: Check username availability
      description: |-
        Returns `error: false` if the username is valid and not taken, `error: true` otherwise (non-2xx status is not used - always inspect the `error` field).
      security: []
      operationId: checkUsername
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameRequest'
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              examples:
                available:
                  value: {error: false, message: "Username is available"}
                taken:
                  value: {error: true, message: "Username is already taken"}

  /auth/verify-email:
    get:
      tags: [auth]
      summary: Verify email address
      description: Consumes the one-time token sent in the verification email. Only available when `email_verification_enabled` is true.
      security: []
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: One-time verification token from the email
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend verification email
      description: Issues a fresh verification token and sends a new email. Only available when email verification is enabled.
      security: []
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameRequest'
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/oauth/authorize:
    get:
      tags: [auth]
      summary: OAuth2 callback (GET)
      description: |-
        Handles the authorization code returned by the OAuth2/OIDC provider. Verifies the
        `state` parameter against the `oidc_csrf` cookie set by `POST /auth/oauth/authorize`,
        exchanges the code for tokens, verifies the ID token signature against the provider's
        JWKS, and binds the session to the user identified by `(iss, sub)`.
      security: []
      operationId: oauthAuthorizeGet
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from the OAuth2 provider
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Opaque CSRF state value previously issued via `POST /auth/oauth/authorize`
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [auth]
      summary: Get OAuth2 authorization URL
      description: |-
        Returns the authorization URL to redirect the user to for OIDC login and sets a
        short-lived `oidc_csrf` cookie carrying the signed `state` and `nonce` values that
        must be presented on the callback. Requires OIDC to be enabled.
      security: []
      operationId: oauthAuthorizePost
      responses:
        '200':
          description: Authorization URL
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "oidc_csrf=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=600"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "https://accounts.example.com/oauth2/auth?client_id=..."
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/oidc/login:
    get:
      tags: [auth]
      summary: OIDC login redirect
      description: |-
        Redirects the browser to the OIDC provider's authorization endpoint (HTTP 302) using
        PKCE (S256), and sets a short-lived `oidc_csrf` cookie carrying the signed `state`,
        `nonce`, and PKCE verifier that must be returned on the callback.
      security: []
      operationId: oidcLogin
      responses:
        '302':
          description: Redirect to OIDC provider
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                example: "oidc_csrf=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=600"

  /auth/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC callback
      description: |-
        Handles the OIDC provider redirect. Verifies the `state` parameter against the
        `oidc_csrf` cookie, exchanges the authorization code for tokens, verifies the ID
        token signature using the provider's JWKS (validating `iss`, `aud`, `exp`, and
        `nonce`), and binds the session to the user identified by `(iss, sub)`. Sets the
        `jwt_token` session cookie and clears `oidc_csrf`.
      security: []
      operationId: oidcCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend with session cookie set
          headers:
            Location:
              schema:
                type: string
                example: "/account/oidc-callback"
            Set-Cookie:
              schema:
                type: string
                example: "jwt_token=<jwt>; HttpOnly; SameSite=Strict; Path=/"

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: Invalidates the current session (no-op for stateless JWTs; present for API completeness).
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "Logout Successfully"

  /auth/cli/start:
    post:
      tags: [auth]
      summary: Start a CLI device-authorization flow
      description: |-
        Mints a `device_code` (returned once, opaque to the server thereafter) and a short,
        human-friendly `user_code` that the CLI shows in the terminal and the user confirms
        in the browser at `verification_uri_complete`. The CLI polls `/auth/cli/poll` until
        the browser-side flow completes.
      security: []
      operationId: cliDeviceStart
      responses:
        '200':
          description: Device flow started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CliDeviceStartResponse'

  /auth/cli/poll:
    post:
      tags: [auth]
      summary: Poll a pending CLI device authorization
      description: |-
        Exchanges a `device_code` for a session token once the browser-side flow has been
        approved. Returns `cli_auth_pending` while the user hasn't yet clicked Authorize,
        `cli_auth_denied` if they explicitly denied, and `cli_auth_expired` once the device
        code lifetime elapses.
      security: []
      operationId: cliDevicePoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDevicePollRequest'
      responses:
        '200':
          description: Authorized - session token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          description: Pending, denied, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/cli/info:
    get:
      tags: [auth]
      summary: Look up a pending CLI device authorization
      description: Returns metadata about a pending `user_code` so the browser-side UI can confirm what is being authorized.
      operationId: cliDeviceInfo
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CliDeviceInfoResponse'

  /auth/cli/authorize:
    post:
      tags: [auth]
      summary: Authorize a pending CLI device session
      description: |-
        Marks the device authorization identified by `user_code` as approved, minting a JWT
        session token (remember_me=true, 30-day lifetime) bound to the calling user. The
        token is returned to the CLI on its next `/auth/cli/poll` request.
      operationId: cliDeviceAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDeviceAuthorizeRequest'
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'

  /auth/cli/deny:
    post:
      tags: [auth]
      summary: Deny a pending CLI device session
      operationId: cliDeviceDeny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDeviceAuthorizeRequest'
      responses:
        '200':
          description: Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'

  # ── User ─────────────────────────────────────────────────────────────────────

  /user:
    get:
      tags: [user]
      summary: Get current user
      description: Returns the id, username, display name, and email of the authenticated user.
      operationId: getUser
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/UserInfoResponse'
              example:
                error: false
                message:
                  id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  username: alice
                  name: Alice Example
                  email: alice@example.com
                  superuser: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [user]
      summary: Delete current user
      description: |-
        Permanently deletes the authenticated user and all associated data.
        Requires re-authentication: password-auth users must supply their
        current password in `password`; OIDC-auth users must echo their
        username in `confirm_username`.
      operationId: deleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Password / username confirmation missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'

  /user/keys:
    get:
      tags: [user]
      summary: List API keys
      description: |-
        Returns all API keys belonging to the authenticated user, including
        creation, last-used, expiry, and revocation timestamps.
      operationId: getUserKeys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKeyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [user]
      summary: Create API key
      description: |-
        Creates a new API key. The full key (prefixed with `GRAD`) is returned once -
        it cannot be retrieved again. Use it as `Authorization: Bearer GRAD<key>`.
        Pass `expires_in_days` to make the key auto-expire; omit for no expiry.
        A cache-pinned key may only grant cache permissions the caller already
        holds; members of a project subscribed to the cache are treated as
        read-only, so they can mint read-only cache keys.
      operationId: createUserKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: New API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "GRADabcdef1234567890abcdef1234567890"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [user]
      summary: Delete API key
      description: Deletes the API key with the given name. State-managed keys cannot be deleted.
      operationId: deleteUserKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/ssh-keys:
    get:
      tags: [user]
      summary: List SSH keys
      description: |-
        Returns the SSH public keys of the authenticated user. Each key may log in
        to the Nix daemon over SSH (`ssh-ng://<project>@<host>`). `404` when SSH is disabled.
      operationId: getUserSshKeys
      responses:
        '200':
          description: List of SSH keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/SshKeyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [user]
      summary: Add SSH key
      description: Adds an OpenSSH public key. A key can belong to one user only.
      operationId: createUserSshKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSshKeyRequest'
      responses:
        '200':
          description: Key added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/SshKeyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /user/ssh-keys/{ssh_key_id}:
    delete:
      tags: [user]
      summary: Delete SSH key
      operationId: deleteUserSshKey
      parameters:
        - name: ssh_key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/keys/permissions:
    get:
      tags: [user]
      summary: List API-key permission catalogue
      description: |-
        Returns the full set of capabilities a user-managed API key may grant.
        Used by the create / edit dialog to populate the permission checkbox list.
      operationId: getUserKeyPermissions
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [available_permissions, availableCache]
                        properties:
                          available_permissions:
                            type: array
                            items:
                              type: object
                              required: [id, mutating]
                              properties:
                                id: { type: string }
                                mutating: { type: boolean }
                          availableCache:
                            type: array
                            description: Catalogue of cache-scoped capabilities for cache-pinned API keys.
                            items:
                              type: object
                              required: [id, mutating]
                              properties:
                                id:
                                  $ref: '#/components/schemas/CachePermissionId'
                                mutating:
                                  type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/keys/{api_id}:
    patch:
      tags: [user]
      summary: Update an API key's configurable options
      description: |-
        Edit the key's name, permission set, or project pin in place.
        Permissions replace the existing set wholesale. State-managed keys
        cannot be edited. Cannot be called from an API-key-authenticated
        request - sessions only.
      operationId: patchUserKey
      parameters:
        - name: api_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchApiKeyRequest'
      responses:
        '200':
          description: Updated key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ApiKeyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /user/keys/{api_id}/revoke:
    post:
      tags: [user]
      summary: Revoke an API key
      description: |-
        Marks the key as revoked without deleting the row, so audit trails are
        preserved. A revoked key fails authentication immediately.
      operationId: revokeUserKey
      parameters:
        - name: api_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/invites:
    get:
      tags: [user]
      summary: List my pending invitations
      description: |
        Project and cache invitations addressed to the authenticated user,
        newest first.
      operationId: listUserInvites
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/invites/accept:
    post:
      tags: [user]
      summary: Accept an invitation
      description: |
        Redeems an invitation token and creates the membership. The token must
        address the authenticated user: a token forwarded to somebody else
        answers `404`, so the mailed link is a convenience and never the trust
        boundary. An expired invitation answers `410` and is discarded.
      operationId: acceptUserInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The invitation has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /user/invites/decline:
    post:
      tags: [user]
      summary: Decline an invitation
      description: |
        Discards an invitation addressed to the authenticated user. The same
        token and expiry rules as accept apply.
      operationId: declineUserInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The invitation has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /user/sessions:
    get:
      tags: [user]
      summary: List active sessions
      description: |-
        Returns the caller's non-revoked, non-expired sessions. Each entry
        carries the user-agent and IP captured at login plus a `current` flag
        identifying the session backing this request.
      operationId: getUserSessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/sessions/{session_id}:
    delete:
      tags: [user]
      summary: Revoke a session
      description: |-
        Revokes a single session, immediately invalidating its JWT. Useful for
        signing out a lost device without changing the password.
      operationId: deleteUserSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/audit-log:
    get:
      tags: [user]
      summary: Audit log for the current user
      description: |-
        Paginated list of audit events recorded for the caller (login,
        logout, API-key lifecycle, session revocation, account deletion).
      operationId: getUserAuditLog
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/AuditLogEntry'
                          total:
                            type: integer
                          page:
                            type: integer
                          per_page:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/settings:
    get:
      tags: [user]
      summary: Get user settings
      description: Returns the username, display name, and email of the current user.
      operationId: getUserSettings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/GetUserSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [user]
      summary: Update user settings
      description: |-
        Updates one or more user profile fields. Only fields that are present in the
        request body are changed. Managed users (created via NixOS config) cannot be
        modified through the API.
      operationId: patchUserSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /user/search:
    get:
      tags: [user]
      summary: Search users by username
      description: Returns up to 10 users whose username contains the given query string. Used for autocomplete in member and ownership dialogs.
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Username prefix/substring to search for
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            username:
                              type: string
                            name:
                              type: string
              example:
                error: false
                message:
                  - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    username: alice
                    name: Alice Example
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/tasks:
    get:
      tags: [dashboard]
      summary: Ranked task table of the current user
      description: |-
        Tasks of the viewer's projects plus starred tasks of public projects, PR-triggered evaluations excluded.
        Ranked by tier (`starred_active`, `active`, `starred`, `team`, `member`), then newest latest evaluation first.
        Active means a non-PR evaluation in the last 14 days. `counts` always covers every task; `total` is the number of tasks matching `filter`.
      operationId: getDashboardTasks
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, failing, starred]
            default: all
          description: '`failing`: latest evaluation failed or has failing entry points.'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page; `0` is treated as `1`, a page past the end returns no tasks.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
          description: Clamped to 1-25.
        - name: history
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
          description: Number of history bars per task, clamped to 1-60.
      responses:
        '200':
          description: One page of ranked tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [counts, total, tasks]
                        properties:
                          counts:
                            type: object
                            required: [all, failing, starred]
                            properties:
                              all:
                                type: integer
                              failing:
                                type: integer
                              starred:
                                type: integer
                          total:
                            type: integer
                          tasks:
                            type: array
                            items:
                              type: object
                              required: [project, task, starred, tier, latest, entry_points, delta, speed_ms, history]
                              properties:
                                project:
                                  type: string
                                task:
                                  type: string
                                starred:
                                  type: boolean
                                tier:
                                  type: string
                                  enum: [starred_active, active, starred, team, member]
                                latest:
                                  type: object
                                  nullable: true
                                  description: Latest non-PR evaluation; `null` when there is none.
                                  required: [id, status, commit, created_at]
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    status:
                                      $ref: '#/components/schemas/EvaluationStatus'
                                    commit:
                                      type: string
                                      description: Commit hash, hex.
                                    created_at:
                                      type: string
                                      format: date-time
                                entry_points:
                                  type: object
                                  nullable: true
                                  description: Entry point outcomes of the latest evaluation. `FailedTransient` builds count toward `total` only.
                                  required: [ok, failing, total]
                                  properties:
                                    ok:
                                      type: integer
                                      description: Completed or Substituted.
                                    failing:
                                      type: integer
                                      description: FailedPermanent, FailedTimeout, DependencyFailed or Aborted.
                                    total:
                                      type: integer
                                delta:
                                  type: integer
                                  nullable: true
                                  description: Failing entry points of the latest evaluation minus those of the previous terminal one; `null` while the latest is not terminal or there is no previous.
                                speed_ms:
                                  type: integer
                                  nullable: true
                                  description: Mean duration of the last 30 terminal evaluations.
                                history:
                                  type: array
                                  description: Recent non-PR evaluations up to the latest, oldest first.
                                  items:
                                    type: object
                                    required: [id, status, duration_ms, created_at]
                                    properties:
                                      id:
                                        type: string
                                        format: uuid
                                      status:
                                        $ref: '#/components/schemas/EvaluationStatus'
                                      duration_ms:
                                        type: integer
                                        nullable: true
                                      created_at:
                                        type: string
                                        format: date-time
              example:
                error: false
                message:
                  counts: { all: 1, failing: 0, starred: 1 }
                  total: 1
                  tasks:
                    - project: infra
                      task: hosts
                      starred: true
                      tier: starred_active
                      latest:
                        id: "fe0d108b-d4b5-423e-9ba2-52a43179cf84"
                        status: Completed
                        commit: "918a618ddd5697970775bff76b6494dcc697b58f"
                        created_at: "2026-09-23T10:00:00"
                      entry_points: { ok: 12, failing: 0, total: 12 }
                      delta: 0
                      speed_ms: 540000
                      history:
                        - id: "fe0d108b-d4b5-423e-9ba2-52a43179cf84"
                          status: Completed
                          duration_ms: 510000
                          created_at: "2026-09-23T10:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/stats:
    get:
      tags: [dashboard]
      summary: Stat tiles of the current user
      description: |-
        Totals over the projects the viewer may see (all for a superuser, public plus member projects otherwise).
        `builds_completed` counts recorded derivation metrics; `queue_wait_p50_ms` is the median wait for a worker over the last 24 hours.
        `cache_size_bytes` sums the stored size of each cache the viewer created or reaches through a project membership (all caches for a superuser); each size is recounted every metrics rollup pass, and a path held by two caches counts in both.
        `workers` covers connected workers of visible projects only: `busy_pct` is assigned jobs over summed capacity, capped at 100.
      operationId: getDashboardStats
      responses:
        '200':
          description: Dashboard stat tiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [cpu_time_ms, cpu_time_ms_7d, builds_completed, cache_size_bytes, workers, queue_wait_p50_ms]
                        properties:
                          cpu_time_ms:
                            type: integer
                            format: int64
                          cpu_time_ms_7d:
                            type: integer
                            format: int64
                          builds_completed:
                            type: integer
                            format: int64
                          cache_size_bytes:
                            type: integer
                            format: int64
                          workers:
                            type: object
                            required: [online, busy_pct]
                            properties:
                              online:
                                type: integer
                              busy_pct:
                                type: integer
                                minimum: 0
                                maximum: 100
                          queue_wait_p50_ms:
                            type: integer
                            format: int64
              example:
                error: false
                message:
                  cpu_time_ms: 912345000
                  cpu_time_ms_7d: 45678000
                  builds_completed: 18234
                  cache_size_bytes: 53687091200
                  workers: { online: 3, busy_pct: 42 }
                  queue_wait_p50_ms: 1800
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/activity:
    get:
      tags: [dashboard]
      summary: Daily evaluation activity of the current user
      description: |-
        One entry per day from 370 days ago through today, oldest first, days without evaluations included as zero.
        Counts non-PR evaluations of the projects the viewer may see; `failed` counts evaluations with status `Failed`.
      operationId: getDashboardActivity
      responses:
        '200':
          description: Daily evaluation counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [days]
                        properties:
                          days:
                            type: array
                            items:
                              type: object
                              required: [date, evaluations, failed]
                              properties:
                                date:
                                  type: string
                                  format: date
                                evaluations:
                                  type: integer
                                  format: int64
                                failed:
                                  type: integer
                                  format: int64
              example:
                error: false
                message:
                  days:
                    - { date: "2026-09-22", evaluations: 14, failed: 2 }
                    - { date: "2026-09-23", evaluations: 9, failed: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/rail:
    get:
      tags: [dashboard]
      summary: Sidebar rail of the current user
      description: |-
        Projects: member projects plus starred public ones, sorted by tier (`starred_active`, `active`, `starred`, `team`, `member`), then name.
        Active means a non-PR evaluation in the last 14 days; `status` is the latest non-PR evaluation's status or `null`.
        `tasks` is present only on `starred_active` projects and omitted otherwise.
        Caches: those the viewer created, is a member of or reaches through a member project, plus starred public ones; starred first, then name. Superusers get no extra caches here.
      operationId: getDashboardRail
      responses:
        '200':
          description: Rail projects and caches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [projects, caches]
                        properties:
                          projects:
                            type: array
                            items:
                              type: object
                              required: [name, display_name, starred, tier, status, task_count]
                              properties:
                                name:
                                  type: string
                                display_name:
                                  type: string
                                starred:
                                  type: boolean
                                tier:
                                  type: string
                                  enum: [starred_active, active, starred, team, member]
                                status:
                                  allOf:
                                    - $ref: '#/components/schemas/EvaluationStatus'
                                  nullable: true
                                task_count:
                                  type: integer
                                  format: int64
                                tasks:
                                  type: array
                                  description: Only on `starred_active` projects; omitted otherwise.
                                  items:
                                    type: object
                                    required: [name, status]
                                    properties:
                                      name:
                                        type: string
                                      status:
                                        allOf:
                                          - $ref: '#/components/schemas/EvaluationStatus'
                                        nullable: true
                          caches:
                            type: array
                            items:
                              type: object
                              required: [name, display_name, starred, nar_count]
                              properties:
                                name:
                                  type: string
                                display_name:
                                  type: string
                                starred:
                                  type: boolean
                                nar_count:
                                  type: integer
                                  format: int64
              example:
                error: false
                message:
                  projects:
                    - name: infra
                      display_name: Infra
                      starred: true
                      tier: starred_active
                      status: Completed
                      task_count: 2
                      tasks:
                        - { name: hosts, status: Completed }
                        - { name: home, status: null }
                    - { name: docs, display_name: Docs, starred: false, tier: member, status: null, task_count: 1 }
                  caches:
                    - { name: main, display_name: Main, starred: true, nar_count: 18234 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search:
    get:
      tags: [dashboard]
      summary: Typed search for the command palette
      description: |-
        Classifies `q` and performs every lookup it could mean. The name lookup always takes place, and a project named like a commit hash is still found.
        - Store path or bare 32-char nix32 hash: NARs of that hash in readable caches (`nar`, at most 10).
        - 7 to 40 hex characters: evaluations of commits with that prefix in readable projects, newest first, PR-triggered ones included (`commit`, at most 5).
        - Any text: projects, tasks and caches whose name or display name contains it, at most `limit` per kind, starred first.
        An empty `q` returns the user's starred projects, tasks and caches, labelled by display name like name hits.
        Visibility matches the rest of the API: a project is readable when public or the user is a member; a cache when public, created by, shared with or subscribed to by a project of the user. There is no superuser bypass, so every hit opens a readable page.
        Results are ordered NAR hits, commit hits, then name hits (starred first, then kind, then name).
      operationId: getSearch
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search text, store path, NAR hash or commit hash prefix
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: Name hits per kind; out-of-range values are clamped
      responses:
        '200':
          description: Search hits with the frontend route each one navigates to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          type: object
                          required: [kind, label, sublabel, route, starred]
                          properties:
                            kind:
                              type: string
                              enum: [project, task, cache, nar, commit]
                            label:
                              type: string
                              description: Display name, package name or short commit hash
                            sublabel:
                              type: string
                              description: Owning project, cache or `project / task`; empty when none
                            route:
                              type: string
                              description: |-
                                `/project/{p}`, `/project/{p}/task/{t}`, `/caches/{c}`, `/caches/{c}/nars?hash={hash}` or `/project/{p}/task/{t}?eval={evaluation}`
                            starred:
                              type: boolean
              example:
                error: false
                message:
                  - { kind: commit, label: deadbee, sublabel: infra / hosts, route: "/project/infra/task/hosts?eval=fe0d108b-d4b5-423e-9ba2-52a43179cf84", starred: false }
                  - { kind: task, label: Hosts, sublabel: infra, route: /project/infra/task/hosts, starred: true }
                  - { kind: cache, label: Main, sublabel: "", route: /caches/main, starred: false }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/stars:
    get:
      tags: [user]
      summary: List starred projects, tasks and caches
      description: Returns the names of everything the current user starred and can still read (the visibility of `/search`, no superuser bypass), each list sorted by name. A target the user lost access to is hidden, not unstarred.
      operationId: getUserStars
      responses:
        '200':
          description: Starred names grouped by kind
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [projects, tasks, caches]
                        properties:
                          projects:
                            type: array
                            items:
                              type: string
                          tasks:
                            type: array
                            items:
                              type: object
                              required: [project, task]
                              properties:
                                project:
                                  type: string
                                task:
                                  type: string
                          caches:
                            type: array
                            items:
                              type: string
              example:
                error: false
                message:
                  projects: [infra]
                  tasks:
                    - project: infra
                      task: hosts
                  caches: [main]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/stars/projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    put:
      tags: [user]
      summary: Star a project
      description: Idempotent. `message` is `true`, the project is starred afterwards.
      operationId: starProject
      responses:
        '200':
          description: Project starred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: Unstar a project
      description: Idempotent, also for a project that was never starred. `message` is `false`.
      operationId: unstarProject
      responses:
        '200':
          description: Project unstarred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/stars/tasks/{project}/{task}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    put:
      tags: [user]
      summary: Star a task
      description: Idempotent. `message` is `true`, the task is starred afterwards.
      operationId: starTask
      responses:
        '200':
          description: Task starred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: Unstar a task
      description: Idempotent, also for a task that was never starred. `message` is `false`.
      operationId: unstarTask
      responses:
        '200':
          description: Task unstarred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/stars/caches/{cache}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    put:
      tags: [user]
      summary: Star a cache
      description: Idempotent. `message` is `true`, the cache is starred afterwards.
      operationId: starCache
      responses:
        '200':
          description: Cache starred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: Unstar a cache
      description: Idempotent, also for a cache that was never starred. `message` is `false`.
      operationId: unstarCache
      responses:
        '200':
          description: Cache unstarred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Projects ─────────────────────────────────────────────────────────────

  /projects:
    get:
      tags: [projects]
      summary: List projects
      description: Returns all projects the current user is a member of.
      operationId: listProjects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [projects]
      summary: Create project
      description: Creates a new project owned by the current user.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeProjectRequest'
            example:
              name: my-project
              display_name: My Project
      responses:
        '200':
          description: Project UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/available:
    get:
      tags: [projects]
      summary: Check project name availability
      description: Returns `true` if no project with the given name exists, `false` if it is already taken.
      operationId: checkProjectNameAvailable
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Project name to check
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: boolean
              example:
                error: false
                message: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/public:
    get:
      tags: [projects]
      summary: List public projects
      description: Returns a paginated list of all public projects, ordered by name. Does not require authentication.
      security: []
      operationId: listPublicProjects
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated public project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Project'
                          total:
                            type: integer
                          page:
                            type: integer
                          per_page:
                            type: integer

  /projects/{project}/public:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    post:
      tags: [projects]
      summary: Make project public
      description: >-
        Makes the project, its tasks, evaluations and builds readable without
        authentication. Requires the manage-project-settings permission; rejects
        state-managed projects.
      operationId: makeProjectPublic
      responses:
        '200':
          description: Project is now public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Make project private
      description: >-
        Restricts the project to its members. Requires the
        manage-project-settings permission; rejects state-managed projects.
      operationId: makeProjectPrivate
      responses:
        '200':
          description: Project is now private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      summary: Update project
      description: |
        Updates one or more project fields. Managed projects cannot
        be edited via the API. Requires the caller to hold the **admin** role
        in the project.
      operationId: patchProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [projects]
      summary: Delete project
      description: |
        Permanently deletes the project and all its resources. Requires
        the caller to hold the **admin** role in the project.
      operationId: deleteProject
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/users:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: List project members
      operationId: listProjectUsers
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/StringListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      summary: Invite member
      description: |
        Invites a user to the project by username. Requires the caller to
        hold the **admin** role in the project.

        The user is **not** a member until they accept. The response message is
        `Invitation sent`, and the pending row appears under
        `GET /projects/{project}/invitations` until it is accepted, declined or
        revoked. An invitation expires after 7 days.

        A **superuser** who already holds the permission adds the member
        directly instead, answering `User added`. State-managed projects reject
        this endpoint entirely; their members come from the state file.
      operationId: addProjectUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '200':
          description: Invitation sent, or member added when the caller is a superuser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user is already a member or already invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    patch:
      tags: [projects]
      summary: Update member role
      description: |
        Updates the role or permissions of an existing project member.
        Requires the caller to hold the **admin** role in the project.
      operationId: patchProjectUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Remove member
      description: |
        Removes a user from the project. Requires the caller to hold the
        **admin** role in the project.
      operationId: removeProjectUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUserRequest'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/invitations:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: List pending invitations
      description: |
        Invitations that have been sent but not yet accepted or declined.
        Requires `manageMembers` on the project.
      operationId: listProjectInvitations
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Revoke a pending invitation
      description: Requires `manageMembers` on the project.
      operationId: revokeProjectInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUserRequest'
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/roles:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: List roles available in the project
      description: |
        Returns the three immutable built-in roles (Admin/Write/View) plus any
        custom roles owned by this project, along with the catalogue of
        permissions that custom roles may carry.

        Visible to any member of the project so the add-member UI can
        populate its role dropdown.
      operationId: listProjectRoles
      responses:
        '200':
          description: Role catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      summary: Create a custom role
      description: |
        Creates a new role scoped to this project. The caller must hold
        the **manageRoles** permission. The role's permission set is freely
        chosen from the capabilities returned by `GET /projects/{project}/roles` ->
        `available_permissions`. Built-in role names (Admin, Write, View) and
        any name already used by another role in the same project are rejected
        with `409`.
      operationId: createProjectRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{project}/roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Role identifier (UUIDv7).
    get:
      tags: [projects]
      summary: Fetch a role
      operationId: getProjectRole
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      summary: Update a custom role
      description: |
        Renames a custom role and/or replaces its permission set. The three
        built-in roles (Admin, Write, View) are immutable; attempts to modify
        them return `403`.
      operationId: patchProjectRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [projects]
      summary: Delete a custom role
      description: |
        Deletes a custom role. The built-in roles cannot be deleted (`403`).
        A role currently assigned to one or more members cannot be deleted
        until those members are reassigned (`400`).
      operationId: deleteProjectRole
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/ssh:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: Get SSH public key
      description: |-
        Returns the SSH public key for the project. This key must be added to
        each remote build server's `authorized_keys` to allow Gradient to connect.
      operationId: getProjectSsh
      responses:
        '200':
          description: SSH public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      summary: Regenerate SSH key pair
      description: Generates a new Ed25519 key pair for the project. The previous key will stop working on remote servers immediately.
      operationId: postProjectSsh
      responses:
        '200':
          description: New SSH public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/subscribe:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [projects]
      summary: List cache subscriptions
      description: Returns the binary caches this project currently uses as substituters.
      operationId: listProjectSubscriptions
      responses:
        '200':
          description: Subscribed caches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/subscribe/{cache}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/CacheSlug'
    post:
      tags: [projects]
      summary: Subscribe to cache, or request a subscription
      description: |
        Requires `manageSubscriptions` on the project, and the cache must be
        visible to the caller.

        When the caller also holds `manageCacheSubscriptions` on the cache, or is
        a superuser, the cache is added to the project's substituters
        immediately. Otherwise a **subscription request** is recorded instead and
        the response message is `Subscription requested`; a cache admin then
        approves it through
        `POST /caches/{cache}/subscription-requests/{project}`.
      operationId: subscribeProjectToCache
      responses:
        '200':
          description: Subscribed, or subscription requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [projects]
      summary: Unsubscribe from cache, or cancel a pending request
      description: |
        Removes a binary cache from the project's substituters. When no
        subscription exists but a request is still pending, the request is
        cancelled instead. Requires `manageSubscriptions` on the project.
      operationId: unsubscribeProjectFromCache
      responses:
        '200':
          description: Unsubscribed, or subscription request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Tasks ─────────────────────────────────────────────────────────────────

  /tasks/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [tasks]
      summary: List tasks
      description: Returns all tasks in the given project with full details.
      operationId: listTasks
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [tasks]
      summary: Create task
      description: Creates a new task in the project. `wildcard` is a Nix attribute selector such as `packages.x86_64-linux` or `checks`.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeTaskRequest'
            example:
              name: my-task
              display_name: My Task
              repository: "https://github.com/example/repo.git"
              branch: main
              wildcard: "packages.x86_64-linux"
      responses:
        '200':
          description: Task UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/{project}/{task}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    get:
      tags: [tasks]
      summary: Get task
      operationId: getTask
      responses:
