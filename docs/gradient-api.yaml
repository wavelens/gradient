    post:
      tags:
      - teams
      summary: Grant a team on a cache
      description: |-
        Needs `manageCacheMembers`.
        A grant is active at once when the caller is Admin in the team (or a superuser).
        Otherwise a request waits for a team Admin and the answer is `Request sent`.
      operationId: grantCacheTeam
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCacheRequest'
        required: true
      responses:
        '200':
          description: '`Team granted` or `Request sent`'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/teams/{team}:
    delete:
      tags:
      - teams
      summary: Remove a cache team grant
      description: |-
        Allowed for `manageCacheMembers` on the cache or Admin in the team.
        Without a grant, the pending request is withdrawn instead.
      operationId: removeCacheTeam
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: team
        in: path
