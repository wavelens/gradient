  /api/v1/caches/{cache}:
    get:
      tags:
      - caches
      summary: Get cache
      description: Returns cache details. Public caches are visible to anyone. A private cache is visible to its cache members and to members of any project subscribed to it (matching the visibility of `GET /caches`); other callers receive `404`.
      operationId: getCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache details
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/CacheResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Delete cache
      description: Deletes the cache. Requires `deleteCache`. Managed caches cannot be deleted via the API.
      operationId: deleteCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - caches
      summary: Update cache
      description: Updates one or more cache fields. Requires `manageCacheSettings`. Managed caches cannot be edited via the API.
      operationId: patchCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCacheRequest'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/active:
    post:
      tags:
      - caches
      summary: Enable cache
      description: Also allowed on a state-managed cache. The next server start restores the declared `active` value.
      operationId: enableCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Disable cache
      description: Also allowed on a state-managed cache. The next server start restores the declared `active` value.
      operationId: disableCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/invitations:
    get:
      tags:
      - caches
      summary: List pending cache invitations
      description: Requires `manageCacheMembers`.
      operationId: listCacheInvitations
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingInvitationItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Revoke a pending cache invitation
      description: Requires `manageCacheMembers`.
      operationId: revokeCacheInvitation
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeInvitationRequest'
        required: true
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/key:
    get:
      tags:
      - caches
      summary: Get cache secret signing key
      description: |-
        Returns the Nix-format secret signing key string for the cache, e.g.:
        `gradient.example.com-mycache:AAAA...` (base64-encoded 64-byte ed25519 keypair)

        Requires `manageCacheKeys`. Keep the secret key private - do not add it to `nix.conf`.
        To configure Nix clients use the public key from `GET /caches/{cache}/public-key` instead.
      operationId: getCacheKey
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache secret signing key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/members:
    get:
      tags:
      - caches
      summary: List cache members
      description: Returns all members of the cache and their assigned roles. Requires `viewCache`.
      operationId: listCacheMembers
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - caches
      summary: Invite cache member
      description: |-
        Invites a user to the cache with the given role. Requires
        `manageCacheMembers`.

        The user is **not** a member until they accept; the response message is
        `Invitation sent` and the pending row appears under
        `GET /caches/{cache}/invitations`. An invitation expires after 7 days. A
        **superuser** who already holds the permission adds the member directly
        instead, answering `User added`.
      operationId: addCacheMember
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Invitation sent, or member added when the caller is a superuser
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Remove cache member
      description: |-
        Removes a user from the cache. Requires `manageCacheMembers`. The last
        Admin cannot be removed (`409`).
      operationId: removeCacheMember
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMemberRequest'
        required: true
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - caches
      summary: Update cache member role
      description: Changes the role of an existing cache member. Requires `manageCacheMembers`.
      operationId: patchCacheMember
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/nars:
    get:
      tags:
      - caches
      summary: List cached NARs
      description: |-
        Returns a paginated list of NARs (cached store paths) currently signed by this cache.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: listCacheNars
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: query
        required: false
        schema:
          type: string
      - name: package
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: order
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Paginated NAR list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/Paginated_NarSummary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    post:
      tags:
      - caches
      summary: Upload a NAR to a cache
      description: |-
        Uploads a single NAR (its bytes plus narinfo metadata) to this cache.
        Requires `writeStore`. The server validates the byte length against the
        declared `file_size`, stores the blob, records the cached path, and
        enqueues a signature for this cache. Re-uploading an existing store path
        reuses the cached path and only adds this cache's signature.

        The route's body limit is `GRADIENT_NAR_MAX_UPLOAD_SIZE` (default 512 MiB).
        The bundled reverse proxy additionally caps each request body at 100 MiB,
        so NARs above that must use the chunked endpoints
        (`PUT .../nars/{hash}/chunk` + `POST .../nars/{hash}/finalize`).
      operationId: uploadCacheNar
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NarUploadForm'
        required: true
      responses:
        '201':
          description: NAR stored
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/StoredNar'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/nars/available:
    get:
      tags:
      - caches
      summary: Check whether a NAR is available
      description: |-
        Returns `{ available: true }` when this cache currently holds a signature
        row for the given store-path hash. Cheaper than a `GET /nars/{hash}` round-trip
        for clients that only need a yes/no answer.
      operationId: getCacheNarAvailable
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Availability flag
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/NarAvailable'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/caches/{cache}/nars/stats:
    get:
      tags:
      - caches
      summary: NAR aggregate statistics
      description: |-
        Returns aggregate counts and sizes for all NARs signed by this cache.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: getCacheNarStats
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NAR aggregates
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/NarStats'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/caches/{cache}/nars/{hash}:
    get:
      tags:
      - caches
      summary: Get NAR detail
      description: |-
        Returns full metadata for a NAR signed by this cache, including references,
        deriver, content-addressed flag, fetch count, and signature presence.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: getCacheNar
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NAR detail
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/NarDetail'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Delete a NAR from this cache
      description: |-
        Removes this cache's signature row for the given store-path hash. The delete
        is ref-counted: when other caches still hold the same NAR, only this cache's
        signature is dropped. When this is the last cache holding the NAR, the
        `cached_path` row is removed in the same transaction and the NAR
        blob is garbage-collected asynchronously after the response. Requires
        `writeStore`. Allowed on state-managed caches - NAR content is operational
        data, distinct from cache configuration.
      operationId: deleteCacheNar
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: NAR removed from this cache
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/nars/{hash}/chunk:
    put:
      tags:
      - caches
      summary: Append a chunk of a NAR being uploaded
      description: |-
        Appends one slice of a NAR to a server-side `.partial` staging file,
        one per `(cache, hash)`. Used to upload NARs larger than the reverse
        proxy's per-request body limit by splitting them across several requests.
        Requires `writeStore`. `offset == 0` starts fresh (truncating any stale
        partial); otherwise the chunk is appended only when `offset` equals the
        bytes already staged. The response's `received` is authoritative: the
        client sets its next offset to it (resending if it did not advance) and
        calls `POST .../finalize` once `received` equals the NAR size.
      operationId: uploadCacheNarChunk
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: offset
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/Binary'
        required: true
      responses:
        '200':
          description: Chunk staged
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ChunkReceived'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/nars/{hash}/finalize:
    post:
      tags:
      - caches
      summary: Finalize a chunked NAR upload
      description: |-
        Validates the fully staged NAR against its narinfo (the staged byte
        length must equal `file_size`), imports it exactly like the single-shot
        upload, and drops the `.partial`. Requires `writeStore`.
      operationId: finalizeCacheNarUpload
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarinfoPart'
        required: true
      responses:
        '201':
          description: NAR stored
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/StoredNar'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/public:
    post:
      tags:
      - caches
      summary: Make cache public
      description: Makes the cache readable without authentication, by the API and by Nix clients.
      operationId: makeCachePublic
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache is now public
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Make cache private
      description: Requires credentials to read the cache, by the API and by Nix clients.
      operationId: makeCachePrivate
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache is now private
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/public-key:
    get:
      tags:
      - caches
      summary: Get cache public key
      description: |-
        Returns the Nix-format public key string for the cache, e.g.:
        `gradient.example.com-mycache:AAAA...` (base64-encoded 32-byte ed25519 public key)

        Add this value to `trusted-public-keys` in `nix.conf` or NixOS configuration so
        Nix clients can verify signatures on store paths served from this cache.
      operationId: getCachePublicKey
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache public key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/caches/{cache}/roles:
    get:
      tags:
      - caches
      summary: List cache roles
      description: |-
        Returns the three built-in roles (Admin/Write/View) plus any custom roles
        owned by this cache, along with the full catalogue of cache permissions.
        Visible to any cache member (`viewCache`).
      operationId: listCacheRoles
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Role catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleListResponse_CacheRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - caches
      summary: Create custom cache role
      description: |-
        Creates a new role scoped to this cache. Requires `manageCacheRoles`.
        The role's permission set is chosen from the capabilities returned by
        `GET /caches/{cache}/roles` -> `available_permissions`.
      operationId: createCacheRole
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_CacheRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/roles/{role_id}:
    get:
      tags:
      - caches
      summary: Fetch a cache role
      operationId: getCacheRole
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleId'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_CacheRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - caches
      summary: Delete a custom cache role
      description: |-
        Deletes a custom cache role. Built-in roles cannot be deleted (`403`).
        A role still assigned to members cannot be deleted until those members
        are reassigned (`400`). Requires `manageCacheRoles`.
      operationId: deleteCacheRole
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleId'
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - caches
      summary: Update a custom cache role
      description: |-
        Renames a custom role and/or replaces its permission set. Built-in roles
        (Admin/Write/View) are immutable (`403`). Requires `manageCacheRoles`.
      operationId: patchCacheRole
      parameters:
      - name: cache
        in: path
        required: true
