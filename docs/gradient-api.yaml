  /api/v1/tasks/{project}/{task}/badge:
    get:
      tags:
      - tasks
      summary: Task status badge (SVG)
      description: |-
        Returns a shields.io-compatible SVG badge reflecting the task's latest
        evaluation status. Designed to be embedded in GitHub READMEs, Grafana
        dashboards, or any tool that renders SVG images from a URL.

        **Badge colours:**
        | Status | Colour | Label |
        |--------|--------|-------|
        | No evaluation yet | grey | `unknown` |
        | Queued / Evaluating / Building | blue | `queued` / `evaluating` / `building` |
        | Completed, all entry-point builds passed | green | `passing` |
        | Completed, some entry-point builds failed | amber | `partial` |
        | Failed | red | `failing` |
        | Aborted | yellow | `aborted` |

        **Authentication:**
        - **Public projects** - no credentials required. Embed the URL directly.
        - **Private projects** - supply `?token=GRADxxxx` (API key) or a JWT so the
          image can be fetched by external services without a session cookie.

        Responses include `Cache-Control: no-cache` so badge aggregator CDNs always
        fetch the live status rather than serving a stale image.
      operationId: getTaskBadge
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      - name: style
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BadgeStyle'
      - name: label
        in: query
        required: false
        schema:
          type: string
      - name: eval
        in: query
        required: false
        schema:
          type: string
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SVG badge image.
          content:
            image/svg+xml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/check-repository:
    post:
      tags:
      - tasks
      summary: Check repository accessibility
      description: |-
        Tests whether Gradient can clone the task's repository using the project's SSH key and returns the remote head commit. A `repository` in the body is tested instead of the saved URL, so a new URL can be checked before saving it. Requires Admin or Write role; rejects state-managed tasks.
        Returns `400` with `code: "repository_unreachable"` and the underlying git error when the repository cannot be fetched.
      operationId: checkTaskRepository
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CheckRepositoryRequest'
              - type: 'null'
      responses:
        '200':
          description: Repository is accessible
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/details:
    get:
      tags:
      - tasks
      summary: Get task details
      description: Returns aggregated task data including the latest evaluation, recent evaluation history, and current entry points.
      operationId: getTaskDetails
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/TaskDetailsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/entry-point-downloads:
    get:
      tags:
      - tasks
      summary: Download newest-commit entry point build output
      description: |-
        Serves the named file from `nix-support/hydra-build-products` for the build of
        the given entry point in the task's **newest-commit evaluation**
        (`task.last_evaluation`). Designed as a stable permalink - retriggering an
        older commit does not shadow the latest one. Returns `404` if no evaluation
        has been recorded yet, or if the entry point / file is missing from the
        newest evaluation.

        Authentication:
        - **Public projects** - no credentials required.
        - **Private projects** - supply `?token=GRADxxxx` (API key) or a JWT, **or**
          authenticate via `Authorization: Bearer` header / `jwt_token` session cookie.

        The `eval` value may contain double-quoted Nix attribute segments
        (e.g. `packages."x86_64-linux".hello`). URL-encode `"` as `%22`.
      operationId: downloadEntryPointOutput
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      - name: eval
        in: query
        required: true
        schema:
          type: string
      - name: filename
        in: query
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: File contents with appropriate `Content-Type` and `Content-Disposition` headers.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/Binary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/entry-point-metrics:
    get:
      tags:
      - tasks
      summary: Get entry point metrics
      description: |-
        Returns per-evaluation build metrics for a single entry point identified by its
        Nix attribute path (`eval`), covering the last `keep_evaluations` completed evaluations.

        The `eval` value is the full Nix attribute path as stored in the database, which may
        contain double-quoted segments for attribute names with special characters
        (e.g. `packages."x86_64-linux".hello`). URL-encode `"` as `%22` in query strings.
      operationId: getEntryPointMetrics
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      - name: eval
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entry point metrics
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/EntryPointMetricsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/entry-points:
    get:
      tags:
      - tasks
      summary: List entry points
      description: Returns the root builds (entry points) for the task from the last evaluation by default. Pass `evaluation_id` to retrieve entry points from a specific evaluation instead.
      operationId: listTaskEntryPoints
      parameters:
