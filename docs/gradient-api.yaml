              $ref: '#/components/schemas/PatchTaskRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tasks]
      summary: Delete task
      operationId: deleteTask
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/evaluations:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    get:
      tags: [tasks]
      summary: List and search evaluations
      description: |-
        Returns the `keep_evaluations` most recent evaluations for the task,
        newest first. The `commit`, `status` and `attr` filters combine (AND) to
        answer "has this attribute at this commit been evaluated, and is it still
        running?" without walking the whole history.

        `attr` matches an evaluation's **wildcard**, not its entry points. The
        wildcard is set when the evaluation row is created, so the filter answers
        while the evaluation is still `Queued` or `EvaluatingFlake`; entry points
        do not exist until derivations have resolved. The flip side is that a
        match means the attribute was *in scope*, not that it exists in the flake
        or that it built - read `/tasks/{project}/{task}/entry-points` for that.
      operationId: getTaskEvaluations
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Max evaluations to return, newest first. Defaults to the task's keep_evaluations.
          schema:
            type: integer
            minimum: 1
        - name: commit
          in: query
          required: false
          description: >-
            Full 40-character hex commit hash. Short prefixes are rejected. A
            hash with no evaluations returns an empty list, not `404`.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{40}$'
            example: "9c1a2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3"
        - name: status
          in: query
          required: false
          description: >-
            `active` (Queued, Fetching, EvaluatingFlake, EvaluatingDerivation,
            Building, Waiting), `terminal` (Completed, Failed, Aborted), or one
            exact status name, case-insensitive.
          schema:
            type: string
            example: active
        - name: attr
          in: query
          required: false
          description: |-
            Concrete Nix attribute path. Returns evaluations whose wildcard
            covers it. Must not itself contain wildcard syntax (`*`, `#`, `,`);
            double-quote segments containing dots, exactly as in a wildcard
            (`packages."x86_64-linux".hello`), and URL-encode `"` as `%22`.

            Matching takes place in the server over at most the 1000 most recent
            evaluations that pass the other filters.
          schema:
            type: string
            example: "packages.x86_64-linux.hello"
      responses:
        '200':
          description: List of evaluation summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationSummary'
        '400':
          description: >-
            `commit` is not a 40-character hex hash, `status` is not a known
            status or group, or `attr` carries wildcard syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/details:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    get:
      tags: [tasks]
      summary: Get task details
      description: Returns aggregated task data including the latest evaluation, recent evaluation history, and current entry points.
      operationId: getTaskDetails
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/TaskDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/entry-points:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    get:
      tags: [tasks]
      summary: List entry points
      description: >
        Returns the root builds (entry points) for the task from the last evaluation by default.
        Pass `evaluation_id` to retrieve entry points from a specific evaluation instead.
      operationId: listTaskEntryPoints
      parameters:
        - name: evaluation_id
          in: query
          required: false
          description: UUID of a specific evaluation to retrieve entry points from. Defaults to the task's last evaluation.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size, default 25, at most 500. Entry points are ordered by attribute path. The default is small because the server walks one dependency closure per entry point returned.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Number of entry points to skip.
          schema:
            type: integer
      responses:
        '200':
          description: Entry points
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/PaginatedEntryPoints'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/check-repository:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    post:
      tags: [tasks]
      summary: Check repository accessibility
      description: >-
        Tests whether Gradient can clone the task's repository using the
        project's SSH key. Requires Admin or Write role; rejects
        state-managed tasks.

        Returns `400` with `code: "repository_unreachable"` and the underlying
        git error when the repository cannot be fetched.
      operationId: checkTaskRepository
      responses:
        '200':
          description: Repository is accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          description: >-
            Bad request - invalid input or repository unreachable
            (`code: "repository_unreachable"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/evaluate:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    post:
      tags: [tasks]
      summary: Trigger evaluation
      description: |-
        Queues a new evaluation for the task and returns its UUID in `message`,
        so a caller can follow the run it just started (`GET /evals/{id}`, or the
        `GET /evals/{id}/live` stream). `mode: "restart_failed"` returns the UUID
        of the evaluation created to re-run the previous one's failed builds.

        Returns `400` with `code: "repository_unreachable"` when the repository
        cannot be fetched (DNS failure, authentication failure, unreachable host,
        bad URL, …) - the message includes the underlying git error.
      operationId: triggerEvaluation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [restart_failed]
                  description: >-
                    Skip fetch and evaluation and re-queue the failed builds of
                    the most recent evaluation, a reproducible failure included:
                    a failure is valid for the evaluation that recorded it. Omit
                    for a normal evaluation.
                commit:
                  type: string
                  pattern: '^[0-9a-fA-F]{40}$'
                  description: |-
                    Exact commit to evaluate. Omit to take the branch head, which
                    is what a normal CI run does. The commit must be reachable in
                    the task's repository or the request is refused with
                    `code: "repository_unreachable"` rather than queueing an
                    evaluation that fails fetching.

                    A pinned run is marked `concurrent`, so it neither queues
                    behind nor aborts the task's own CI run, and it does not bump
                    tracked flake inputs - it asks for one exact revision.
                  example: "9c1a2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3"
                attr:
                  type: string
                  description: >-
                    Attribute path or wildcard to evaluate instead of the task's
                    own, e.g. `packages.x86_64-linux.hello`. Narrowing the scope
                    is what makes a per-deployment evaluation cheap.
                  example: "packages.x86_64-linux.hello"
                walk:
                  type: string
                  enum: [pruned, full]
                  default: pruned
                  description: >-
                    `pruned` skips every dependency subtree whose record is
                    complete. `full` walks the whole closure again, the manual
                    recovery for a graph whose record went wrong. Refused with
                    `mode: "restart_failed"`, which walks nothing.
      responses:
        '200':
          description: Evaluation UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '400':
          description: >-
            Bad request - invalid input, evaluation already in progress, or
            repository unreachable (`code: "repository_unreachable"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: true
                code: repository_unreachable
                message: 'Failed to fetch repository state: Git command failed: failed to resolve address for github: Name or service not known'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/{task}/active:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - $ref: '#/components/parameters/TaskSlug'
    post:
      tags: [tasks]
