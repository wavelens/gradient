      - {}
      - cacheBasic: []
  /cache/{cache}/nar/upstream/{upstream_id}/{path}:
    get:
      tags:
      - nix-cache
      summary: Upstream NAR
      description: Streams a NAR from an upstream of the cache. Any upstream serving the same path is tried when the named one is gone.
      operationId: getUpstreamNar
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: upstream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: path
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NAR stream
          content:
            application/x-nix-nar:
              schema:
                $ref: '#/components/schemas/Binary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/nar/{path}:
    get:
      tags:
      - nix-cache
      summary: NAR
      description: Compressed NAR archive of a store path.
      operationId: getNar
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NAR stream
          content:
            application/x-nix-nar:
              schema:
                $ref: '#/components/schemas/Binary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/nix-cache-info:
    get:
      tags:
      - nix-cache
      summary: Nix cache info
      description: Cache metadata read by Nix substituters. `Priority` is the cache priority, or the local priority for clients in `GRADIENT_HTTP_LOCAL_IPS`.
      operationId: getNixCacheInfo
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: json
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Cache metadata
          content:
            text/x-nix-cache-info:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/NixCacheInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/proto:
    get:
      tags:
      - nix-cache
      summary: Cache proto WebSocket
      description: 'Read-only, cache-scoped WebSocket with the `/proto` wire format. Accepts only `CacheQuery` (Normal and Pull) and `NarRequest`. Public caches allow anonymous sessions (`GRADIENT_PROTO_ANONYMOUS_CACHE_ENABLE`), capped per IP by `GRADIENT_PROTO_ANONYMOUS_CACHE_MAX_CONNECTIONS_PER_IP`; private caches need `Authorization: Bearer GRAD<key>`.'
      operationId: cacheProtoWebSocket
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/serve/{hash}/{path}:
    get:
      tags:
      - nix-cache
      summary: Serve file
      description: A single file of a NAR (content type from the file name), or a directory as `tar.zst`. Responses carry sandboxing headers.
      operationId: serveNarFile
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File or directory archive
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/Binary'
            application/zstd:
              schema:
                $ref: '#/components/schemas/Binary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/{path}:
    get:
      tags:
      - nix-cache
      summary: Narinfo
      description: Path info of a store path. A miss here is looked up in the cache's upstream caches, re-signed with the cache key. `X-Cache` reports `HIT` (ours) or `MISS` (upstream).
      operationId: getNarinfo
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: json
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Narinfo
          content:
            text/x-nix-narinfo:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/NixPathInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /metrics:
    get:
      tags:
      - general
      summary: Prometheus metrics
      description: |-
        Prometheus exposition endpoint. Disabled (404) until an operator
        configures `GRADIENT_METRICS_TOKEN_FILE`. Requires a Bearer token
        matching the contents of that file. Returns the standard Prometheus
        text format (version 0.0.4) with build, evaluation, scheduler, and
        cache metrics.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus exposition (text/plain; version=0.0.4)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Metrics endpoint not configured on this server
      security:
      - metricsAuth: []
  /proto:
    get:
      tags:
      - general
      summary: Binary WebSocket protocol endpoint
      description: |-
        Upgrades the connection to a WebSocket carrying binary frames encoded
        by the `Proto` derive of `gradient-wire`. The upgrade always succeeds; a
        server with `GRADIENT_PROTO_DISCOVERABLE=false` then rejects the
        handshake of a worker it did not dial itself with a `403` reject frame.

        **Protocol flow**
        1. Both sides send an 8-byte version frame (`GRAD`, oldest and newest
           supported version as `u16` little-endian) and encode every later
           frame for the highest shared version. Without one, the WebSocket
           closes with code `1002` and the reason.
        2. Client sends `ClientMessage::InitConnection { capabilities, id }`.
        3. Server responds with `ServerMessage::AuthChallenge`, then
           `ServerMessage::InitAck { capabilities, .. }` with the negotiated
           capabilities.
      operationId: protoWebSocket
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful
        '503':
          description: Connection limit (`GRADIENT_PROTO_MAX_CONNECTIONS`) reached; retry after `Retry-After`
      security: []
