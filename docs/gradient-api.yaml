openapi: 3.1.0
info:
  title: Gradient API
  description: |-
    Gradient is a Nix-based Continuous Integration system. It evaluates Nix flakes,
    schedules derivation builds across remote machines, and exposes build artefacts
    through an integrated binary cache.

    ## Authentication

    Most endpoints require authentication. Three methods are accepted:

    | Method | How to send | How to obtain |
    |---|---|---|
    | JWT (cookie) | `jwt_token` httpOnly cookie | Set automatically on login |
    | JWT (header) | `Authorization: Bearer <token>` | `POST /auth/basic/login` or OIDC flow |
    | API Key | `Authorization: Bearer GRAD<key>` | `POST /user/keys` |

    Cookie auth is the default for browser clients - the `jwt_token` cookie is set
    by the login and OIDC-callback endpoints and cleared on logout. The
    `Authorization` header is accepted as a fallback (e.g. for CI/scripts).

    ### Artefact downloads

    `GET /builds/{build}/download/{filename}` serves build artefacts declared in
    `nix-support/hydra-build-products`. Access is granted when any of the following
    conditions is met:

    - The owning project is **public** - no credentials required.
    - A short-lived (1 h) **download token** is supplied via `?token=<download_token>`.
      Obtain one from `GET /builds/{build}/download-token` while authenticated.
      Tokens are scoped to the build's derivation and are safe to embed in URLs.
    - A valid session (`jwt_token` cookie or `Authorization: Bearer` header) belonging
      to a member of the owning project, or of any project with a build of the
      same derivation (the rule every other build read uses).

    ## Rate limiting

    All HTTP endpoints enforce a per-client-IP token-bucket rate limit. The
    limiter keys solely on client IP, so authenticated and anonymous requests
    share the same tier. Clients that exceed their bucket receive HTTP
    `429 Too Many Requests`. The tier depends on the route:

    | Tier | Routes | Refill | Burst |
    |---|---|---|---|
    | auth | `/auth/basic/login`, `/auth/basic/register`, `/auth/check-username`, `/auth/verify-email`, `/auth/resend-verification`, `/auth/oauth/*`, `/auth/oidc/*` | 1 req / 6 s | 5 |
    | webhook | `/hooks/*` | 1 req / s | 30 |
    | cache | `/cache/{cache}/*` (public NAR surface) and `/cache/{cache}/proto` | 1 req / 20 ms | 3000 |
    | cache-inspect | `/cache/{cache}/{ls,serve}/*` | 1 req / 333 ms | 180 |
    | cache-log | `/cache/{cache}/log/*` | 1 req / 333 ms | 900 |
    | cache-upload | `POST /caches/{cache}/nars`, `PUT /caches/{cache}/nars/{hash}/chunk`, `POST /caches/{cache}/nars/{hash}/finalize` | 1 req / 2 ms | 10000 |
    | default | everything else | 1 req / 200 ms | 150 |

    Client IP is taken from `X-Forwarded-For` / `X-Real-IP` (deployments are
    expected behind a reverse proxy), falling back to the connection peer IP.

    ## Request Tracing

    Every response carries an `x-request-id` header. If the client (or an
    upstream reverse proxy) supplies an `x-request-id` on the request, it is
    preserved verbatim; otherwise the server mints a UUID v7. Use this id to
    correlate client-side traces with server logs - every log line emitted
    while the request is in flight (handler, DB, spawned cleanup tasks)
    carries the same id.

    ## Common Response Envelope

    Every JSON response is wrapped in a standard envelope:
    ```json
    { "error": false, "message": <payload> }
    ```
    On errors `"error"` is `true` and `"message"` contains the error description.

    ## Nix Binary Cache

    The integrated Nix binary cache lives outside `/api/v1`. Configure Nix with:
    ```
    substituters = https://gradient.example.com/cache/mycache
    trusted-public-keys = gradient.example.com-mycache:...
    ```
    The public key is returned by `GET /api/v1/caches/{cache}/public-key`.

    ## State Management

    Objects whose `managed` field is `true` are controlled by the NixOS module
    configuration and cannot be mutated through the API.
  contact:
    name: Wavelens GmbH
    email: info@wavelens.io
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: 2.0.1
paths:
  /api/v1/admin/draining:
    post:
      tags:
      - admin
      summary: Toggle instance draining
      description: |-
        Enables or disables draining for the instance. While draining, the
        scheduler stops dispatching queued evaluations and builds, and every
        in-flight evaluation waits (`Waiting`, reason `draining`) so the
        server can be stopped safely. When draining ends, evaluations with a
        finished walk go back to `Building` and the others to `Queued`.

        Draining is in-memory only, so it always clears on the next server
        startup, and the waiting evaluations return automatically.

        Requires `superuser`.
      operationId: setDraining
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDrainingRequest'
        required: true
      responses:
        '200':
          description: Draining state applied
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/DrainingResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/github-app/callback:
    get:
      tags:
      - admin
      summary: GitHub App manifest callback
      description: |-
        Receives the redirect from GitHub after the operator submits the
        manifest. Validates the `state` token, exchanges the temporary `code`
        for the App's permanent credentials, stashes them in a one-shot
        in-memory store per superuser who initiated the manifest
        flow, and redirects the browser to `/admin/github-app?ready=1`.

        **Unauthenticated** - GitHub redirects the operator's browser here
        from `https://github.com/...` and that cross-site navigation does not
        carry a bearer token. CSRF and identity binding are provided by the
        one-shot `state` token issued at `POST /admin/github-app/manifest`,
        which is bound to the initiating superuser at issuance.
      operationId: githubAppManifestCallback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: host
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect to `/admin/github-app?ready=1` on success.
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/admin/github-app/credentials:
    get:
      tags:
      - admin
      summary: Fetch pending GitHub App credentials
      description: |-
        One-shot retrieval of the credentials produced by the most recent
        successful manifest exchange. Calling this endpoint **consumes** the
        pending credentials; a second call returns `404`. Pending entries
        also expire 10 minutes after creation.

        Requires `superuser`.
      operationId: getGithubAppCredentials
      responses:
        '200':
          description: GitHub App credentials (returned exactly once)
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ManifestResult'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/github-app/manifest:
    post:
      tags:
      - admin
      summary: Build GitHub App manifest
      description: |-
        Builds a GitHub App manifest pre-filled with this server's URLs,
        permissions, and events, and returns a one-shot CSRF state token plus
        the GitHub URL the browser should POST the manifest to.

        Requires `superuser`. The state token is consumed by the matching
        `GET /admin/github-app/callback` invocation; it expires after 10
        minutes.
      operationId: createGithubAppManifest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubAppManifestRequest'
        required: true
      responses:
        '200':
          description: Manifest, post URL, and CSRF state
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/GithubAppManifestResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/maintenance/deep-gc:
    post:
      tags:
      - admin
      summary: Request a deep GC round
      description: |-
        Requests a reconciliation between the database and every storage
        backend (NAR files, build-request blobs, build logs, upload partials),
        run without pausing between units. Returns `202` immediately with the
        task id; poll `GET /admin/tasks/{task_id}` for progress and final state.

        When a `deep_gc` round is already `pending` or `running`, that round
        starts over from its first unit and its id is returned.

        Requires `superuser`.
      operationId: startDeepGc
      responses:
        '202':
          description: Round requested
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/StartDeepGcResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/state:
    get:
      tags:
      - admin
      summary: Export the live state configuration
      description: |-
        Reconstructs the current users, projects, tasks, caches,
        custom roles, API keys, teams with their members and grants, workers
        (team workers name their team) and integrations into a
        declarative `services.gradient.state` shape, so operators can codify
        the running system back into their nix configuration.

        Every credential-file field (`password_file`, `private_key_file`,
        `signing_key_file`, `token_file`, `key_file`, `secret_file`,
        `access_token_file`) is redacted to `null` - the hashed/encrypted
        secrets cannot be recovered and must be filled in by hand. GitHub
        integration rows are exported with their `installation_id` /
        `account_login`. The auto-managed `build-request` task and the
        built-in `Admin`/`Write`/`View` roles are omitted.

        Requires `superuser`.
      operationId: exportState
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Exported state configuration
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message: {}
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/tasks:
    get:
      tags:
      - admin
      summary: List recent admin tasks
      description: |-
        Returns the 50 newest admin tasks ordered by `created_at` descending.
        Requires `superuser`.
      operationId: listAdminTasks
      responses:
        '200':
          description: Admin task list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTaskDto'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/tasks/{task_id}:
    get:
      tags:
      - admin
      summary: Get one admin task
      operationId: getAdminTask
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AdminTaskId'
      responses:
        '200':
          description: Admin task
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/AdminTaskDto'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks:
    get:
      tags:
      - webhooks
      summary: List instance webhooks
      description: Requires superuser.
      operationId: listInstanceWebhooks
      parameters: []
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - webhooks
      summary: Create a instance webhook
      description: |-
        Requires superuser. The response carries the signing `secret` once; it is
        never returned again (use `rotate-secret` to replace it).
      operationId: createInstanceWebhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
        required: true
      responses:
        '200':
          description: Created webhook and its secret
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/CreateWebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks/{id}:
    get:
      tags:
      - webhooks
      summary: Read a instance webhook
      operationId: readInstanceWebhook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      responses:
        '200':
          description: Webhook
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/WebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - webhooks
      summary: Delete a instance webhook
      operationId: deleteInstanceWebhook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/DeletedResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - webhooks
      summary: Update a instance webhook
      operationId: updateInstanceWebhook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
        required: true
      responses:
        '200':
          description: Updated webhook
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/WebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks/{id}/deliveries:
    get:
      tags:
      - webhooks
      summary: List a instance webhook's deliveries
      operationId: listInstanceWebhookDeliveries
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryListItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks/{id}/deliveries/{delivery_id}:
    get:
      tags:
      - webhooks
      summary: Read one instance webhook delivery with bodies
      operationId: getInstanceWebhookDelivery
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      - name: delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookDeliveryId'
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/DeliveryDetail_WebhookDeliveryId'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks/{id}/rotate-secret:
    post:
      tags:
      - webhooks
      summary: Replace a instance webhook's signing secret
      operationId: rotateInstanceWebhookSecret
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      responses:
        '200':
          description: The new secret, shown once
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RotatedSecret'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/webhooks/{id}/test:
    post:
      tags:
      - webhooks
      summary: Send a `webhook.ping` to a instance webhook
      description: Delivers immediately (no retry) and returns the recorded delivery.
      operationId: testInstanceWebhook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WebhookId'
      responses:
        '200':
          description: Recorded delivery
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/DeliveryListItem_WebhookDeliveryId'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/workers:
    get:
      tags:
      - admin
      summary: List connected workers
      description: |-
        Returns all workers currently connected to the server via the `/proto`
        WebSocket, including their capabilities and assigned job counts.

        Requires the caller to have the `superuser` flag, unless the server
        is started with `GRADIENT_PUBLIC_STATS=true`.
      operationId: listWorkers
      responses:
        '200':
          description: Worker list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/admin/workers/{worker}:
    get:
      tags:
      - admin
      summary: Get connected worker
      description: |-
        Returns one connected worker with its capabilities, assigned job counts, exec labels and exec devices. Device `free` counts leave out devices held by assigned exec jobs.

        Same access as `listWorkers`. Answers 404 when no worker with this id is connected.
      operationId: getWorker
      parameters:
      - name: worker
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Worker
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/WorkerInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/auth/basic/login:
    post:
      tags:
      - auth
      summary: Login with username/password
      description: |-
        Validates credentials and returns a signed JWT. Pass the token as
        `Authorization: Bearer <token>` on subsequent requests.
        `loginname` accepts either the username or the email address.
        Set `remember_me: true` for a long-lived token.
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeLoginRequest'
        required: true
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/basic/register:
    post:
      tags:
      - auth
      summary: Register a new user
      description: |-
        Creates a new user account. Fails if registration is disabled (OIDC-only mode)
        or if the username/email is already taken. When email verification is enabled,
        a verification email is sent and login is blocked until the address is confirmed.
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeUserRequest'
        required: true
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/check-username:
    post:
      tags:
      - auth
      summary: Check username availability
      description: 'Returns `error: false` if the username is valid and not taken, `error: true` otherwise (non-2xx status is not used - always inspect the `error` field).'
      operationId: checkUsername
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameRequest'
        required: true
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/cli/authorize:
    post:
      tags:
      - auth
      summary: Authorize a pending CLI device session
      description: |-
        Marks the device authorization identified by `user_code` as approved, minting a JWT
        session token (remember_me=true, 30-day lifetime) bound to the calling user. The
        token is returned to the CLI on its next `/auth/cli/poll` request.
      operationId: cliDeviceAuthorize
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDeviceAuthorizeRequest'
        required: true
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/auth/cli/deny:
    post:
      tags:
      - auth
      summary: Deny a pending CLI device session
      operationId: cliDeviceDeny
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDeviceAuthorizeRequest'
        required: true
      responses:
        '200':
          description: Denied
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/auth/cli/info:
    get:
      tags:
      - auth
      summary: Look up a pending CLI device authorization
      description: Returns metadata about a pending `user_code` so the browser-side UI can confirm what it authorizes.
      operationId: cliDeviceInfo
      parameters:
      - name: user_code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/CliDeviceInfoResponse'
        default:
          $ref: '#/components/responses/Error'
