  /metrics/events:
    get:
      tags: [board]
      summary: Stream every event (websocket, debug only)
      description: |-
        Should not be used for production! Best-effort, in-process, per server
        instance, drops on lag. Use webhooks.

        Upgrades to a websocket that sends one `EventEnvelope` JSON object per
        text frame. A subscriber that falls behind receives
        `{"event":"stream.lagged","content":{"skipped":N}}` and keeps streaming.
        Superuser only.
      operationId: getEventsFirehose
      parameters:
        - name: events
          in: query
          required: false
          description: Comma-separated globs, e.g. `build.*,proto.client.*`. Empty streams everything.
          schema: { type: string }
      responses:
        '101':
          description: Switching to websocket; every frame is an `EventEnvelope`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/catalog:
    get:
      tags: [board]
      summary: List every event name
      description: |-
        Every event Gradient emits. `durable` events are delivered to webhooks and
        task actions; the others only reach `/metrics/events`. Names ending in
        `*` are families (`proto.client.*`).
      operationId: getEventsCatalog
      responses:
        '200':
          description: Event catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  message:
                    type: array
                    items: { $ref: '#/components/schemas/EventCatalogEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /metrics/catalog:
    get:
      tags: [board]
      summary: Metric catalog
      description: Lists the queryable metrics with their kind, unit, and dimensions.
      operationId: getMetricsCatalog
      responses:
        '200':
          description: Catalog of available metrics

  /metrics/query:
    get:
      tags: [board]
      summary: Query a metric time-series
      description: |-
        Returns time-bucketed points for a metric from `metric_rollup`, masked to
        the caller's scope (superuser = all projects, member = own + public projects,
        anonymous = public projects). Unknown metrics or out-of-scope projects return 404.
      operationId: getMetricsQuery
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string } }
        - { name: granularity, in: query, schema: { type: string, enum: [minute, hour, day, week] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: project, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Time-series points
        '404':
          description: Unknown metric or project out of scope

  /metrics/tasks/{project}/{task}/evaluations:
    get:
      tags: [board]
      summary: Per-evaluation task metrics
      description: Per-evaluation series (build time, eval time, output/closure sizes, dependencies) for the task's recent completed evaluations.
      operationId: getTaskEvaluationMetrics
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: task, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Per-evaluation metric points

  /metrics/tasks/{project}/{task}/entry-point:
    get:
      tags: [board]
      summary: Per-evaluation entry-point metrics
      description: Per-evaluation build metrics for a single entry point identified by its `eval` attribute path.
      operationId: getEntryPointEvaluationMetrics
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: task, in: path, required: true, schema: { type: string } }
        - { name: eval, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Per-evaluation entry-point metric points

  /board/jobs/dispatched:
    get:
      tags: [board]
      summary: Live assigned jobs
      description: In-flight assigned jobs visible to the caller; out-of-scope jobs collapse to an aggregate `other_running` count.
      operationId: getBoardDispatchedJobs
      responses:
        '200':
          description: Assigned jobs plus other_running count
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DispatchedJobSummary'
                  other_running:
                    type: integer

  /board/jobs/decisions:
    get:
      tags: [board]
      summary: Recent assignment decisions (all candidate scores)
      description: >
        Bounded ring of the most recent assignment decisions, each with every
        scored candidate including the rejected/negative ones the scheduler
        passed over. For tuning scoring rules. Superuser-only, as candidates
        span all projects.
      operationId: getBoardDispatchDecisions
      responses:
        '200':
          description: Recent assignment decisions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DispatchDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a superuser

  /board/jobs/pending:
    get:
      tags: [board]
      summary: Pending (unassigned) jobs
      description: Queued jobs not yet assigned to a worker, visible to the caller; out-of-scope jobs collapse to an aggregate `other_pending` count.
      operationId: getBoardPendingJobs
      responses:
        '200':
          description: Pending jobs plus other_pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingJobSummary'
                  other_pending:
                    type: integer

  /board/jobs/expensive:
    get:
      tags: [board]
      summary: Most expensive builds
      description: Top 20 completed derivation builds by build time, one row per derivation build. The time is the worker-measured `derivation_metric.build_time_ms`, falling back to the latest attempt's start and finish stamps when no metric exists. Project-scoped; `worker_name` is shown only when the worker is registered by a project the caller can see.
      operationId: getBoardExpensiveJobs
      parameters:
        - { name: window_days, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Top builds by build time
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    build_id: { type: string, format: uuid }
                    project: { type: string, format: uuid }
                    name: { type: string }
                    build_time_ms: { type: integer, format: int64 }
                    worker: { type: string, nullable: true }
                    worker_name: { type: string, nullable: true }

  /board/jobs/expensive-by-resource:
    get:
      tags: [board]
      summary: Most expensive builds by resource
      description: Top 20 derivations by a captured per-build resource (peak RAM, CPU time or total disk bytes) from each derivation's latest `derivation_metric` row in the window, skipping zero values. Project-scoped; `worker_name` is shown only when the worker is registered by a project the caller can see.
      operationId: getBoardExpensiveByResource
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [ram, cpu, disk] } }
        - { name: window_days, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Top builds by resource
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    derivation: { type: string, format: uuid }
                    project: { type: string, format: uuid }
                    name: { type: string }
                    value: { type: number }
                    unit: { type: string, enum: [MB, ms, bytes] }
                    worker: { type: string }
                    worker_name: { type: string, nullable: true }
        '404':
          description: Unknown metric

  /board/evals/expensive-by-resource:
    get:
      tags: [board]
      summary: Most expensive evaluations by resource
      description: Top evaluations by a captured per-eval resource (peak RSS/heap, thunks, fn calls, allocated bytes, or total eval time) from `evaluation_metric`. Project-scoped through the evaluation's task.
      operationId: getBoardExpensiveEvalsByResource
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [rss, heap, thunks, fncalls, alloc, time] } }
        - { name: window_days, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Top evaluations by resource
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpensiveEval'
        '404':
          description: Unknown metric

  /board/jobs/{id}:
    get:
      tags: [board]
      summary: Assigned job detail
      description: Full assignment record incl. per-rule scoring breakdown, job/worker/instance contexts. Runner-up candidates are superuser-only.
      operationId: getBoardJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchedJobDetail' }
        '404':
          description: Not found or out of scope

  /board/scoring/summary:
    get:
      tags: [board]
      summary: Aggregate scoring summary
      description: Score histogram and mean per-rule contribution over recently assigned jobs, masked to the caller's projects.
      operationId: getBoardScoringSummary
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 2000 } }
      responses:
        '200':
          description: Scoring summary

  /board/scoring/rules:
    get:
      tags: [board]
      summary: Scoring rule catalog
      description: Static name and human-readable description for every scheduler scoring rule, used by the board UI to explain rule names.
      operationId: getBoardScoringRules
      responses:
        '200':
          description: Rule catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          type: object
                          required: [rule, description]
                          properties:
                            rule: { type: string }
                            description: { type: string }

  /board/workers:
    get:
      tags: [board]
      summary: Connected workers
      description: >-
        Connected workers with capability and live load. `projects` lists the
        served projects visible to the caller; a worker serving none of them has
        its identity and metrics masked for non-superusers.
      operationId: getBoardWorkers
      responses:
        '200':
          description: Connected workers

  /board/workers/load:
    get:
      tags: [board]
      summary: Fleet load by capability, architecture, and feature
      description: >-
        Real per-dimension fleet load: for each capability (eval/fetch/build),
        architecture, and system feature, the in-flight job count against the
        summed slot capacity of the workers that can serve it. Answers whether
        the fleet is eval-, build-, or architecture-bound rather than showing one
        blended busy %. Scoped to the caller's projects (superusers see the whole
        fleet). Each bucket carries `{ key, in_flight, capacity, workers }`;
        busy % = in_flight / capacity.
      operationId: getBoardWorkerLoad
      responses:
        '200':
          description: Fleet load breakdowns

  /board/cache:
    get:
      tags: [board]
      summary: Cache statistics
      description: Cache totals plus hourly traffic and storage-growth series, aggregated across caches (anonymized infra view).
      operationId: getBoardCache
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: Cache statistics

  /board/cache/upstream-caches:
    get:
      tags: [board]
      summary: Per-URL cache latency and narinfo hit-rate
      description: >-
        Per-upstream-URL trailing latency, narinfo hit-rate, and request counts
        with hourly series. Metrics are per URL: the same URL registered
        under several caches/projects contributes to one series; `display_name` is
        the URL host. Project-scoped: superusers see all URLs; members see the URLs
        used by their projects plus public projects. Each series' `url` is the caller's
        own upstream, so it is returned unmasked. The entries are returned as
        `upstream_caches`.
      operationId: getBoardUpstreamCaches
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: Per-upstream cache performance

  /board/live:
    get:
      tags: [board]
      summary: Job Board live events (WebSocket)
      description: |-
        Upgrades to a WebSocket streaming JSON board events (`queue_depth`,
        `job_dispatched`, `worker_connected`, `worker_disconnected`). Per-project
        events are masked to the caller's scope; `worker_connected` reaches members
        of any project the worker serves and names none of them.
      operationId: boardLive
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful

  /board/cache/live:
    get:
      tags: [board]
      summary: Cache change pings (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting a content-free `{"type":"cache_changed"}`
        ping whenever cache contents or stats change. Subscribers refetch their
        own scope-filtered `GET /board/cache` view.
      operationId: boardCacheLive
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful

  /tasks/{project}/{task}/live:
    get:
      tags: [tasks]
      summary: Task live updates (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting `evaluation_status_changed`,
        `build_status_changed`, `evaluation_progress` and `evaluation_activity`
        events for this task, so the task page refetches on change instead of
        polling. `evaluation_progress` fires as builds and entry-points are
        persisted during the evaluation phase, before any build changes status,
        so the build/dependency totals grow live. `evaluation_activity` carries
        an `EvaluationProgress` snapshot at most once per second while the
        evaluation fetches or evaluates. Requires read access.
      operationId: taskLive
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: task, in: path, required: true, schema: { type: string } }
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful

  /evals/{evaluation}/live:
    get:
      tags: [evals]
      summary: Evaluation live updates (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting `evaluation_status_changed`,
        `build_status_changed`, `evaluation_progress` and `evaluation_activity`
        events for this evaluation. `evaluation_progress` fires as builds and
        entry-points are persisted during the evaluation phase so the build
        list grows live. `evaluation_activity` carries an `EvaluationProgress`
        snapshot at most once per second while the evaluation fetches or
        evaluates. Requires read access.
      operationId: evaluationLive
      parameters:
        - { name: evaluation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful

  /builds/{build}/live:
    get:
      tags: [builds]
      summary: Build live updates (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting `build_status_changed` events
        (`build_id`, `derivation_build`, `evaluation_id`, `status`) for every
        build in this build's evaluation (covers its dependency graph), and
        `build_progress` events (`derivation_build`, `phase`, `bytes_done`,
        `bytes_total`, `paths_done`, `paths_total`) while this build prefetches
        its inputs, fetches a Substitute or Download, or uploads its outputs.
        Requires read access.
      operationId: buildLive
      parameters:
        - { name: build, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful

  /board/network:
    get:
      tags: [board]
      summary: Network & API statistics
      description: NAR egress series, per-worker latest upload, download and disk speeds (project-scoped), and per-route HTTP latency/throughput (superuser-only).
      operationId: getBoardNetwork
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: Network statistics

  /board/fleet:
    get:
      tags: [board]
      summary: Worker fleet time-series
      description: Hourly connected / draining / by-capability worker counts derived from worker samples, scoped to the caller's projects.
      operationId: getBoardFleet
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: Fleet time-series

  /board/durations/heatmap:
    get:
      tags: [board]
      summary: Build-duration heatmap
      description: 2D build-duration distribution (duration band × hour) computed on demand from builds, scoped to the caller's projects.
      operationId: getBoardDurationsHeatmap
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: Duration heatmap

  /board/expensive/top-projects:
    get:
      tags: [board]
      summary: Top projects by build time (superuser)
      description: Projects ranked by cumulative completed-build time in a window. Each derivation build counts once per project that built it, timed like `/board/jobs/expensive`; `build_count` counts derivation builds. Superuser only.
      operationId: getBoardTopProjects
      parameters:
        - { name: window_days, in: query, required: false, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: Top projects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    project: { type: string, format: uuid }
                    project_name: { type: string }
                    total_build_ms: { type: integer, format: int64 }
                    build_count: { type: integer, format: int64 }
        '403':
          description: Superuser required

  /board/health:
    get:
      tags: [board]
      summary: System health (superuser)
      description: Process/runtime snapshot, pipeline rollup lag, HTTP route stats, and the instance `draining` flag. Superuser only.
      operationId: getBoardHealth
      responses:
        '200':
          description: System health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          supervised:
                            type: array
                            description: One row per loop in the process supervision tree.
                            items:
                              $ref: '#/components/schemas/SupervisedLoop'
                          proto_sessions:
                            type: integer
                            description: Worker protocol sessions currently open.
                          unconfirmed_nars:
                            type: integer
                            description: cached_path rows whose object the background uploader still owes to storage.
                          pending_deliveries:
                            type: integer
                            description: Effect rows still owed to the outside world (Git host reports, action deliveries, log finalization).
                          failed_deliveries:
                            type: integer
                            description: Effect rows that gave up after their last retry and stay as dead letters until the retention pass.
                          hot_nar_cache:
                            type: object
                            description: The in-memory small-NAR cache.
                            properties:
                              entries: { type: integer }
                              bytes: { type: integer }
                              hits: { type: integer }
                              misses: { type: integer }
                              evictions: { type: integer }
        '403':
          description: Superuser required

  /board/storage:
    get:
      tags: [board]
      summary: Storage and transport health series (superuser)
      description: >-
        Per-label rollup series for NAR storage call latency and errors, worker
        protocol lane fill and send stalls, NAR serve queue depth and serve
        failures. Windows up to 6 h read minute buckets, up to 168 h hour
        buckets, longer windows day buckets. Superuser only.
      operationId: getBoardStorage
      parameters:
        - { name: window_hours, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 2160, default: 6 } }
      responses:
        '200':
          description: Storage and transport health series
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/BoardStorage'
        '403':
          description: Superuser required

  /projects/{project}/workers/{worker_id}/metrics:
    get:
      tags: [board]
      summary: Per-worker metrics
      description: Live-metric sample time-series (CPU, RAM, disk, upload, download, load), connect/disconnect history, and total assigned-job count for one worker. Project members only, and only for a worker registered in the project or enabled for it as a base worker; the telemetry covers everything the worker did, not only this project's jobs.
      operationId: getProjectWorkerMetrics
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: worker_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Worker statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          worker_id:
                            type: string
                            description: The worker's own id, as used on every sample and job row.
                          display_name:
                            type: string
                            description: >-
                              Human-readable name, taken from this project's registration
                              or, failing that, from the base worker it enabled.
                          samples:
                            type: array
                            items: { type: object }
                          connections:
                            type: array
                            items: { type: object }
                          jobs_dispatched:
                            type: integer
        '404':
          description: Project not found, or the worker does not serve it

  # ── SCIM 2.0 ─────────────────────────────────────────────────────────────────
  # Instance-level provisioning (RFC 7643/7644), mounted at /scim/v2 only when
  # SCIM is enabled. All routes use the scimBearer token, not user auth.

  /scim/v2/ServiceProviderConfig:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [scim]
      summary: SCIM service provider configuration
      description: Advertises supported SCIM features (patch, filter, no bulk/sort/etag/change-password).
      operationId: scimServiceProviderConfig
      security:
        - scimBearer: []
      responses:
        '200':
          description: Service provider configuration
          content:
            application/scim+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ScimUnauthorized'

  /scim/v2/ResourceTypes:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [scim]
      summary: SCIM resource types
      description: Lists the supported resource types (User, Group).
      operationId: scimResourceTypes
      security:
        - scimBearer: []
      responses:
        '200':
          description: Resource types
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'

  /scim/v2/Schemas:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [scim]
      summary: SCIM schemas
      description: Lists the supported core schemas (User, Group).
      operationId: scimSchemas
      security:
        - scimBearer: []
      responses:
        '200':
          description: Schemas
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'

  /scim/v2/Users:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    get:
      tags: [scim]
      summary: List / filter SCIM users
      description: |-
        Lists managed (SCIM-provisioned) users. Supports the `userName eq "..."`
        and `externalId eq "..."` filter subset plus `startIndex`/`count` pagination.
      operationId: scimListUsers
      security:
        - scimBearer: []
      parameters:
        - { name: filter, in: query, required: false, schema: { type: string }, example: 'userName eq "alice@example.com"' }
        - { name: startIndex, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: count, in: query, required: false, schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: User list
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
        '400':
          $ref: '#/components/responses/ScimBadRequest'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
    post:
      tags: [scim]
      summary: Provision a SCIM user
      description: Creates a passwordless `managed` user. Login happens later via OIDC (claimable path). `userName` conflicts return 409.
      operationId: scimCreateUser
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '201':
          description: User created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '409':
          $ref: '#/components/responses/ScimConflict'

  /scim/v2/Users/{id}:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [scim]
      summary: Get a SCIM user
      operationId: scimGetUser
      security:
        - scimBearer: []
      responses:
        '200':
          description: User
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '404':
          $ref: '#/components/responses/ScimNotFound'
    put:
      tags: [scim]
      summary: Replace a SCIM user
      operationId: scimReplaceUser
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '200':
          description: User replaced
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '404':
          $ref: '#/components/responses/ScimNotFound'
    patch:
      tags: [scim]
      summary: Patch a SCIM user
      description: Applies a SCIM PatchOp. Typically toggles `active` for deactivation/reactivation.
      operationId: scimPatchUser
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchOp'
      responses:
        '200':
          description: User patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '404':
          $ref: '#/components/responses/ScimNotFound'
    delete:
      tags: [scim]
      summary: Deprovision a SCIM user
      description: |-
        Soft-disables the user (`active=false`) by default; hard-deletes (cascade)
        when `GRADIENT_SCIM_HARD_DELETE=true`.
      operationId: scimDeleteUser
      security:
        - scimBearer: []
      responses:
        '204':
          description: User deprovisioned
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '404':
          $ref: '#/components/responses/ScimNotFound'

  /teams:
    get:
      tags: [teams]
      summary: List my teams
      description: |
        Teams the caller is a member of, with the caller's role, sorted by name.
      operationId: listTeams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [teams]
      summary: Create team
      description: |
        Creates a team and makes the caller its Admin. Who may create teams is set by `--permissions-create-team`.
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeTeamRequest'
      responses:
        '200':
          description: Team created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        format: uuid
                        description: Id of the new team
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`superuser_required` or `creation_disabled` by `--permissions-create-team`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '409':
          description: '`already_exists`: the name is taken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /teams/available:
    get:
      tags: [teams]
      summary: Check a team name
      operationId: teamNameAvailable
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Whether the name is valid and free
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /teams/{team}:
    parameters:
      - $ref: '#/components/parameters/TeamName'
    get:
      tags: [teams]
      summary: Get team
      description: |
        Members of the team and superusers can read it.
      operationId: getTeam
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [teams]
      summary: Change team
      description: |
        Needs Admin in the team. Only superusers set `oidc_group`, `scim_group` and the `new_project_*` fields. State-managed teams refuse changes.
      operationId: patchTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTeamRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not Admin in the team, a state-managed team, or `superuser_required` for the group and new project fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The SCIM group is used by another team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    delete:
      tags: [teams]
      summary: Delete team
      description: |
        Needs Admin in the team. Deletes its grants, requests, invitations and workers; connected team workers lose those projects.
      operationId: deleteTeam
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{team}/evaluations:
    parameters:
      - $ref: '#/components/parameters/TeamName'
    get:
      tags: [teams]
      summary: List recent team evaluations
      description: |
        The ten newest evaluations of projects granting the team with users. Members of the team and superusers can read it.
      operationId: getTeamEvaluations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{team}/members:
    parameters:
      - $ref: '#/components/parameters/TeamName'
    get:
      tags: [teams]
      summary: List team members
      operationId: listTeamMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [teams]
      summary: Invite team member
      description: |
        Needs Admin in the team. The user joins after accepting the invitation (`Invitation sent`); a superuser adds the member directly (`User added`).
      operationId: addTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
      responses:
        '200':
          description: Invitation sent, or member added when the caller is a superuser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user is already a member or already invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    patch:
      tags: [teams]
      summary: Change team member role
      description: |
