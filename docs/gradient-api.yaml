                    $ref: '#/components/schemas/Paginated_AuditLogEntry'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/invites:
    get:
      tags:
      - user
      summary: List my pending invitations
      description: |-
        Project and cache invitations addressed to the authenticated user,
        newest first.
      operationId: listUserInvites
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/InviteItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/invites/accept:
    post:
      tags:
      - user
      summary: Accept an invitation
      description: |-
        Redeems an invitation token and creates the membership. The token must
        address the authenticated user: a token forwarded to somebody else
        answers `404`, so the mailed link is a convenience and never the trust
        boundary. An expired invitation answers `410` and is discarded.
      operationId: acceptUserInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
        required: true
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/invites/decline:
    post:
      tags:
      - user
      summary: Decline an invitation
      description: |-
        Discards an invitation addressed to the authenticated user. The same
        token and expiry rules as accept apply.
      operationId: declineUserInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
        required: true
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/keys:
    get:
      tags:
      - user
      summary: List API keys
      description: |-
        Returns all API keys belonging to the authenticated user, including
        creation, last-used, expiry, and revocation timestamps.
      operationId: getUserKeys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - user
      summary: Create API key
      description: |-
        Creates a new API key. The full key (prefixed with `GRAD`) is returned once -
        it cannot be retrieved again. Use it as `Authorization: Bearer GRAD<key>`.
        Pass `expires_in_days` to make the key auto-expire; omit for no expiry.
        A cache-pinned key may only grant cache permissions the caller already
        holds; members of a project subscribed to the cache are treated as
        read-only, so they can mint read-only cache keys.
      operationId: createUserKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '200':
          description: New API key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - user
      summary: Delete API key
      description: Deletes the API key with the given name. State-managed keys cannot be deleted.
      operationId: deleteUserKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/keys/permissions:
    get:
      tags:
      - user
      summary: List API-key permission catalogue
      description: |-
        Returns the full set of capabilities a user-managed API key may grant.
        Used by the create / edit dialog to populate the permission checkbox list.
      operationId: getUserKeyPermissions
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ApiKeyPermissionsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/keys/{api_id}:
    patch:
      tags:
      - user
      summary: Update an API key's configurable options
      description: |-
        Edit the key's name, permission set, or project pin in place.
        Permissions replace the existing set wholesale. State-managed keys
        cannot be edited. Cannot be called from an API-key-authenticated
        request - sessions only.
      operationId: patchUserKey
      parameters:
      - name: api_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ApiId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchApiKeyRequest'
        required: true
      responses:
        '200':
          description: Updated key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ApiKeyInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/keys/{api_id}/revoke:
    post:
      tags:
      - user
      summary: Revoke an API key
      description: |-
        Marks the key as revoked without deleting the row, so audit trails are
        preserved. A revoked key fails authentication immediately.
      operationId: revokeUserKey
      parameters:
      - name: api_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ApiId'
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/search:
    get:
      tags:
      - user
      summary: Search users by username
      description: Returns up to 10 users whose username contains the given query string. Used for autocomplete in member and ownership dialogs.
      operationId: searchUsers
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSearchResult'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/sessions:
    get:
      tags:
      - user
      summary: List active sessions
      description: |-
        Returns the caller's non-revoked, non-expired sessions. Each entry
        carries the user-agent and IP captured at login plus a `current` flag
        identifying the session backing this request.
      operationId: getUserSessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/sessions/{session_id}:
    delete:
      tags:
      - user
      summary: Revoke a session
      description: |-
        Revokes a single session, immediately invalidating its JWT. Useful for
        signing out a lost device without changing the password.
      operationId: deleteUserSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/settings:
    get:
      tags:
      - user
      summary: Get user settings
      description: Returns the username, display name, and email of the current user.
      operationId: getUserSettings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/GetUserSettingsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - user
      summary: Update user settings
      description: |-
        Updates one or more user profile fields. Only fields that are present in the
        request body are changed. Managed users (created via NixOS config) cannot be
        modified through the API.
      operationId: patchUserSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserSettingsRequest'
        required: true
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/ssh-keys:
    get:
      tags:
      - user
      summary: List SSH keys
      description: |-
        Returns the SSH public keys of the authenticated user. Each key may log in
        to the Nix daemon over SSH (`ssh-ng://<project>@<host>`). `404` when SSH is disabled.
      operationId: getUserSshKeys
      responses:
        '200':
          description: List of SSH keys
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/SshKeyInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - user
      summary: Add SSH key
      description: Adds an OpenSSH public key. A key can belong to one user only.
      operationId: createUserSshKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSshKeyRequest'
        required: true
      responses:
        '200':
          description: Key added
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/SshKeyInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/ssh-keys/{ssh_key_id}:
    delete:
      tags:
      - user
      summary: Delete SSH key
      operationId: deleteUserSshKey
      parameters:
      - name: ssh_key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UserSshKeyId'
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/stars:
    get:
      tags:
      - user
      summary: List starred projects, tasks and caches
      description: Returns the names of everything the current user starred and can still read (the visibility of `/search`, no superuser bypass), each list sorted by name. A target the user lost access to is hidden, not unstarred.
      operationId: getUserStars
      responses:
        '200':
          description: Starred names grouped by kind
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/StarredNames'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/stars/caches/{cache}:
    put:
      tags:
      - user
      summary: Star a cache
      description: Idempotent. `message` is `true`, the cache is starred afterwards.
      operationId: starCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache starred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - user
      summary: Unstar a cache
      description: Idempotent, also for a cache that was never starred. `message` is `false`.
      operationId: unstarCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache unstarred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/stars/projects/{project}:
    put:
      tags:
      - user
      summary: Star a project
      description: Idempotent. `message` is `true`, the project is starred afterwards.
      operationId: starProject
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project starred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - user
      summary: Unstar a project
      description: Idempotent, also for a project that was never starred. `message` is `false`.
      operationId: unstarProject
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project unstarred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/user/stars/tasks/{project}/{task}:
    put:
      tags:
      - user
      summary: Star a task
      description: Idempotent. `message` is `true`, the task is starred afterwards.
      operationId: starTask
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task starred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - user
      summary: Unstar a task
      description: Idempotent, also for a task that was never starred. `message` is `false`.
      operationId: unstarTask
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task unstarred
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /cache/{cache}:
    get:
      tags:
      - nix-cache
      summary: Cache root
      description: Redirects to `nix-cache-info`.
      operationId: getCacheRoot
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to `/cache/{cache}/nix-cache-info`
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/build-trace-v2/{drv}/{output}:
    get:
      tags:
      - nix-cache
      summary: Realisation
      description: The output path a build realised for an output of a content-addressed derivation, signed with the cache key. `{drv}` is the derivation base name and `{output}` the output name with a `.doi` suffix.
      operationId: getRealisation
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: drv
        in: path
        required: true
        schema:
          type: string
      - name: output
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Realisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NixRealisation'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/debuginfo/{build_id}:
    get:
      tags:
      - nix-cache
      summary: Debug info
      description: DWARF debug info for an ELF build id, in the Nix `index-debug-info` format. Indexed from `separateDebugInfo` outputs; a miss falls through to the upstream caches. `X-Cache` reports `HIT` or `MISS`.
      operationId: getDebugInfo
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: build_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Debug info redirect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugInfoRedirect'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/gradient-cache-info:
    get:
      tags:
      - nix-cache
      summary: Gradient cache info
      description: 'Gradient version and server URL behind this cache, for clients probing a substituter. Sends `Access-Control-Allow-Origin: *`.'
      operationId: getGradientCacheInfo
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: json
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Gradient metadata
          content:
            text/x-gradient-cache-info:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/GradientCacheInfo'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/log/{drv}:
    get:
      tags:
      - nix-cache
      summary: Build log
      description: Build log read by `nix log`. Serves this cache's own log, otherwise the first upstream hit. `X-Cache` reports `HIT` or `MISS`.
      operationId: getCacheBuildLog
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: drv
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Build log
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - cacheBasic: []
  /cache/{cache}/ls/{hash}:
    get:
      tags:
      - nix-cache
      summary: NAR listing
      description: File tree of a NAR in the nix-serve `.ls` v1 schema.
      operationId: getNarListing
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NAR listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarList'
