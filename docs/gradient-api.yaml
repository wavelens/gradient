      security:
      - {}
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/evaluate:
    post:
      tags:
      - tasks
      summary: Trigger evaluation
      description: |-
        Fires the task's default trigger and returns the UUID of the evaluation it
        started in `message`, so a caller can follow the run (`GET /evals/{id}`, or the
        `GET /evals/{id}/live` stream). The default trigger decides the branch and the
        task's concurrency policy decides what happens to a running evaluation.
        A `commit` instead evaluates that commit alongside the task's own runs.
        `POST /evals/{evaluation}/retry` re-runs the failed builds of a finished
        evaluation.

        Returns `400` with `code: "repository_unreachable"` when the repository
        cannot be fetched (DNS failure, authentication failure, unreachable host,
        bad URL, …) - the message includes the underlying git error.
      operationId: triggerEvaluation
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/EvaluateRequest'
              - type: 'null'
      responses:
        '200':
          description: Evaluation UUID
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/tasks/{project}/{task}/evaluations:
    get:
      tags:
      - tasks
      summary: List and search evaluations
      description: |-
        Returns the `keep_evaluations` most recent evaluations for the task,
        newest first. The `commit`, `status` and `attr` filters combine (AND) to
        answer "has this attribute at this commit been evaluated, and is it still
        running?" without walking the whole history.

        `attr` matches an evaluation's **wildcard**, not its entry points. The
        wildcard is set when the evaluation row is created, so the filter answers
        while the evaluation is still `Queued` or `EvaluatingFlake`; entry points
        do not exist until derivations have resolved. The flip side is that a
        match means the attribute was *in scope*, not that it exists in the flake
        or that it built - read `/tasks/{project}/{task}/entry-points` for that.
      operationId: getTaskEvaluations
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EvaluationId'
      - name: commit
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: attr
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of evaluation summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationSummary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
