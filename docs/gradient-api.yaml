      summary: Stream every event (websocket, debug only)
      description: |-
        Should not be used for production! Best-effort, in-process, per server
        instance, drops on lag. Use webhooks.

        Upgrades to a websocket that sends one `EventEnvelope` JSON object per
        text frame. A subscriber that falls behind receives
        `{"event":"stream.lagged","content":{"skipped":N}}` and keeps streaming.
        Superuser only.
      operationId: getEventsFirehose
      parameters:
      - name: events
        in: query
        required: false
        schema:
          type: string
      responses:
        '101':
          description: Switching to websocket; every frame is an `EventEnvelope`.
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
