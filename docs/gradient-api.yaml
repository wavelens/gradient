                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlakeGraphNode'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/live:
    get:
      tags:
      - evals
      summary: Evaluation live updates (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting `evaluation_status_changed`,
        `build_status_changed`, `evaluation_progress` and `evaluation_activity`
        events for this evaluation. `evaluation_progress` fires as builds and
        entry-points are persisted during the evaluation phase so the build
        list grows live. `evaluation_activity` carries an `EvaluationProgress`
        snapshot at most once per second while the evaluation fetches or
        evaluates. Requires read access.
      operationId: evaluationLive
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/messages:
    get:
      tags:
      - evals
      summary: List evaluation messages
      description: |-
        Returns all structured messages (errors, warnings, notices) recorded during
        the evaluation. Each message carries a `level`, a human-readable `message`,
        and an optional `source` tag that identifies where the message originated
        (e.g. `"flake-prefetch"`, `"nix-eval"`, `"nix-eval:<attr>"`, `"db-insert"`).
        Messages scoped to specific entry points list their entry-point UUIDs in
        the `entry_points` array; evaluation-wide messages have an empty array.
      operationId: listEvaluationMessages
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationMessageResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/prioritize:
    post:
      tags:
      - evals
      summary: Prioritize evaluation
      description: 'Hands out every build of an active evaluation, including builds it has not resolved yet, ahead of unprioritized work. Requires a superuser (`403` with `code: "superuser_required"` otherwise). A finished evaluation is left unchanged; a failed or aborted one loses its priority.'
      operationId: prioritizeEvaluation
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/evals/{evaluation}/report:
    get:
      tags:
      - evals
      summary: Download an evaluation diagnostic report
      description: |-
        Exports the evaluation, the instance context that explains it, and its
        failed-build logs as a SQLite database, for attaching to a bug report.
        Open it with any SQLite client, or with the `gradient-report` inspector.

        The export carries the direct dependencies of the evaluation's
        derivations, build-time and runtime alike, and their outputs' paths, so
        `blocking_deps` and `missing_runtime_deps` can be recomputed from the file
        alone and an absent row means the instance never had it.

        Requires authentication even for a public project, whose evaluations are
        otherwise browsable anonymously: a report reads every failed build's log
        in one request. Reading the evaluation requires `ViewProject`.
        `include_instance` also requires `ManageWorkers`, since the fleet and
        upstream sections describe more than the evaluation that asked for them;
        it is refused rather than silently dropped, so the report's manifest
        always matches the request.

        Anonymisation replaces identifying strings with tokens derived from a
        per-report salt, stable within one file and uncorrelatable across two.
        Build logs are rewritten against those same tokens, plus any store path
        they name, so a log cannot reintroduce what the columns redacted.
        Nix store hashes are always preserved: they are one-way, and they are
        what makes an upstream cache check possible.

        The parameter defaults below apply to callers that omit them. The web
        dialog asks the inverse question - what to *include* - and always sends
        all four explicitly, with build logs off unless asked for.
      operationId: getEvaluationReport
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      - name: anonymize_identities
        in: query
        required: false
        schema:
          type: boolean
      - name: anonymize_packages
        in: query
        required: false
        schema:
          type: boolean
      - name: include_logs
        in: query
        required: false
        schema:
          type: boolean
      - name: include_instance
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: SQLite report
          content:
            application/vnd.sqlite3:
              schema:
                $ref: '#/components/schemas/Binary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/evals/{evaluation}/retry:
    post:
      tags:
      - evaluations
      summary: Retry evaluation
      description: Starts a new evaluation of the same commit without fetching or evaluating again, and returns its UUID in `message`. The new evaluation queues every failed, timed-out, aborted and dependency-failed build of the finished evaluation again, a reproducible builder failure included, whatever the task's `retry_failed_builds`. Requires project membership. Answers 409 while the evaluation or another evaluation of its task is running.
      operationId: retryEvaluation
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: UUID of the new evaluation
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/evals/{evaluation}/runtime-closure:
    get:
      tags:
      - evals
      summary: Get runtime closure size graph for an evaluation
      description: |-
        Union runtime reference closure of all the evaluation's entry-point build
        outputs. Runtime counterpart of `/evals/{evaluation}/closure`.
      operationId: getEvalRuntimeClosure
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Runtime closure size graph
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ClosureGraph'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/summary:
    get:
      tags:
      - evals
      summary: Summarise what went wrong in an evaluation
      description: |-
        Returns the builds that failed themselves, each with the packages it
        blocks, the attributes that failed to evaluate, and the packages fixed
        since the previous evaluation. A build that only failed because a
        dependency failed is not listed; it is counted under the build that
        caused it.

        `newly_failing` and `fixed` compare against the evaluation in
        `compared_with`. Without a previous evaluation `compared_with` is
        `null`, every `newly_failing` is `false` and `fixed` is empty.
      operationId: getEvaluationSummary
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Failure summary of the evaluation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/EvaluationFailureSummary'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/events/catalog:
    get:
      tags:
      - board
      summary: List every event name
      description: |-
        Every event Gradient emits. `durable` events are delivered to webhooks and
        task actions; the others only reach `/metrics/events`. Names ending in
        `*` are families (`proto.client.*`).
      operationId: getEventsCatalog
      responses:
        '200':
          description: Event catalog
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/exec-jobs/{job}:
    get:
      tags:
      - exec-jobs
      summary: Get exec job
      description: |-
        Returns an exec job with its status, wait reason, requested labels and devices, attempts and phases. `worker` is the worker of the latest attempt and empty while the job waits to start.

        **Access:** Public projects, or members of the project.
      operationId: getExecJob
      parameters:
      - name: job
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ExecJobId'
      responses:
        '200':
          description: Exec job
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ExecJobResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/exec-jobs/{job}/abort:
    post:
      tags:
      - exec-jobs
      summary: Abort exec job
      description: Stops an exec job that has not finished. The job becomes `Aborted`, its worker gets an abort for the running attempt and the job never restarts. Requires project membership or a superuser. Answers 409 when the job has already finished.
      operationId: abortExecJob
      parameters:
      - name: job
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ExecJobId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/exec-jobs/{job}/log:
    get:
      tags:
      - exec-jobs
      summary: Get exec job log
      description: |-
        Returns the program output of one attempt as a single string, the latest attempt unless `attempt` names its number. Empty string before the first attempt. Answers 404 for an attempt number the job does not have.

        **Access:** Public projects, or members of the project.
      operationId: getExecJobLog
