      summary: List cache team grants
      description: Includes pending requests.
      operationId: listCacheTeams
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
