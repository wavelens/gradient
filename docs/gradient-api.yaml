      tags:
      - workers
      summary: Connect Gradient.CI Servers
      description: |-
        Stores a connection token pasted from servers.gradient.ci. `scope = project` creates a
        worker registration for the project (same permission as registering a worker);
        `scope = team` creates a worker of the team (Admin in the team). The server
        dials `wss://<gradientCi.url host>/proto` within 15 s, a team connection only once a
        project grants the team its workers. Turned off by `gradientCi.enable = false`.
      operationId: connectGradientCi
      requestBody:
