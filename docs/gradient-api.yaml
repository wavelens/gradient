                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/upstream-caches:
    get:
      tags:
      - caches
      summary: List upstream caches
      description: 'Returns all upstream caches configured for this cache (both internal Gradient caches and external binary caches), including each upstream''s `public_key` so clients can trust pull-through paths. Follows the same visibility as `GET /caches/{cache}`: public caches are readable by anyone, private caches only by members and subscribed projects.'
      operationId: listUpstreamCaches
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of upstream entries
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/UpstreamCacheItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    put:
      tags:
      - caches
      summary: Add upstream cache
      description: |-
        Adds an upstream cache. Three types are supported, selected by the `type` discriminator:

        - **internal** - another Gradient-managed cache (referenced by name). Supports ReadOnly / ReadWrite / WriteOnly modes.
        - **gradient_proto** - a remote Gradient cache accessed via the binary WebSocket protocol (`/cache/{cache}/proto`). Supports optional `api_key` (stored encrypted at rest; write-only - never returned by the API) and pull mode.
        - **http** - an arbitrary Nix binary cache URL. Always ReadOnly.

        Requires `manageUpstreamCaches`.
      operationId: addUpstreamCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUpstreamRequest'
        required: true
      responses:
        '200':
          description: Upstream added - returns the new upstream UUID
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/CacheUpstreamId'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/upstream-caches/{id}:
    delete:
      tags:
      - caches
      summary: Remove upstream cache
      operationId: deleteUpstreamCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CacheUpstreamId'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - caches
      summary: Update upstream cache
      description: |-
        Updates an upstream entry. For external upstream caches the mode is always forced to ReadOnly;
        `url`, `public_key` and `http1_only` may be updated. For internal upstream caches only `mode` and `display_name` apply.
        `active` toggles any upstream cache. An inactive upstream cache is kept but never queried.
        A state-managed cache accepts only `active`, and the next server start restores the declared value.
        Requires `manageUpstreamCaches`.
      operationId: patchUpstreamCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CacheUpstreamId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUpstreamRequest'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/upstream-caches/{id}/test:
    post:
      tags:
      - caches
      summary: Test an HTTP upstream cache over HTTP/1.1 and HTTP/2
      description: |-
        Fetches the upstream cache's `nix-cache-info` twice in parallel, once over HTTP/1.1 only and once
        over HTTP/2 only, and reports each result. A probe passes on a 2xx body with a `StoreDir:` line.
        Does not change the upstream cache's `http1_only` setting. Only `http` upstream caches can be tested.
        Requires `manageUpstreamCaches`; state-managed caches may be tested.
      operationId: testUpstreamCache
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CacheUpstreamId'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/UpstreamTestResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
