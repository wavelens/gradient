        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project is now public
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - projects
      summary: Make project private
      description: Restricts the project to its members. Requires the manage-project-settings permission; rejects state-managed projects.
      operationId: makeProjectPrivate
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project is now private
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/roles:
    get:
      tags:
      - projects
      summary: List roles available in the project
      description: |-
        Returns the three immutable built-in roles (Admin/Write/View) plus any
        custom roles owned by this project, along with the catalogue of
        permissions that custom roles may carry.

        Visible to any member of the project so the add-member UI can
        populate its role dropdown.
      operationId: listProjectRoles
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Role catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleListResponse_ProjectRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - projects
      summary: Create a custom role
      description: |-
        Creates a new role scoped to this project. The caller must hold
        the **manageRoles** permission. The role's permission set is freely
        chosen from the capabilities returned by `GET /projects/{project}/roles` ->
        `available_permissions`. Built-in role names (Admin, Write, View) and
        any name already used by another role in the same project are rejected
        with `409`.
      operationId: createProjectRole
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_ProjectRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/roles/{role_id}:
    get:
      tags:
      - projects
      summary: Fetch a role
      operationId: getProjectRole
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleId'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_ProjectRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - projects
      summary: Delete a custom role
      description: |-
        Deletes a custom role. The built-in roles cannot be deleted (`403`).
        A role currently assigned to one or more members cannot be deleted
        until those members are reassigned (`400`).
      operationId: deleteProjectRole
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleId'
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - projects
      summary: Update a custom role
      description: |-
        Renames a custom role and/or replaces its permission set. The three
        built-in roles (Admin, Write, View) are immutable; attempts to modify
        them return `403`.
      operationId: patchProjectRole
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRoleRequest'
        required: true
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_ProjectRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/ssh:
    get:
      tags:
      - projects
      summary: Get SSH public key
      description: |-
        Returns the SSH public key for the project. This key must be added to
        each remote build server's `authorized_keys` to allow Gradient to connect.
      operationId: getProjectSsh
      parameters:
