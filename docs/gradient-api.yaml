                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/RoleResponse_CacheRoleOwner'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/caches/{cache}/stats:
    get:
      tags:
      - caches
      summary: Get cache statistics
      description: Returns bandwidth and hit statistics for the cache. Visible to anyone for public caches, and to cache members or members of any project subscribed to a private cache (matching `GET /caches/{cache}`); other callers receive `404`.
      operationId: getCacheStats
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache statistics
          content:
