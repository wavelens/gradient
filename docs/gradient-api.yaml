  /api/v1/hooks/github:
    post:
      tags:
      - git-host-webhooks
      summary: Receive GitHub App webhook
      description: |-
        Receives events from a configured GitHub App. Payloads are authenticated using
        `X-Hub-Signature-256` HMAC-SHA256 verification against the configured
        `GRADIENT_GITHUB_APP_WEBHOOK_SECRET_FILE`.

        **Handled events:**
        - `push` / `pull_request` / `release` - trigger an evaluation on any task whose
          repository URL matches the matching trigger. A `push` carrying an
          all-zero `after` SHA (a branch/tag deletion or a Git host "test" delivery)
          is accepted as a `200` no-op rather than rejected.
        - `merge_group` - `checks_requested` evaluates the merge group head on every push
          trigger whose branch filter matches the queue's base branch.
        - `check_run` - the "Approve and Run" action clears a fork-PR approval gate.
        - `issue_comment` - `/gradient run` / `/gradient approve` / `/gradient summary` maintainer commands.
        - `pull_request_review` - a maintainer's approving review clears a fork-PR approval gate.
        - `installation` / `installation_repositories` - stores or clears the GitHub App
          `installation_id` on the matching Gradient project.
        - `ping` - always returns 200.

        This endpoint is unauthenticated (verified via HMAC signature).
      operationId: githubAppWebhook
      parameters:
      - name: X-GitHub-Event
        in: header
        required: true
        schema:
          type: string
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Webhook processed (may include zero queued evaluations)
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/IncomingWebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/hooks/{git_host}/{project}/{integration_name}:
    post:
      tags:
      - git-host-webhooks
      summary: Receive Git host push webhook
      description: |-
        Receives push events for a named inbound integration.
        Authenticated via the integration's stored HMAC secret.

        Signature header by Git host:
        - `gitea` / `forgejo`: `X-Gitea-Signature` (HMAC-SHA256 hex)
        - `gitlab`: `X-Gitlab-Token` (plain token comparison)

        On a matching push, queues an evaluation for every active task whose
        `task_integration.inbound_integration` points at this row and whose
        repository URL matches the webhook payload's clone URL.

        A push carrying an all-zero `after` SHA (a branch/tag deletion or a
        Git host "test" delivery) is accepted as a `200` no-op rather than rejected.

        This endpoint is unauthenticated (verified via Git host specific signature).
      operationId: gitHostWebhook
      parameters:
      - name: git_host
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: integration_name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Webhook processed (may include zero queued evaluations)
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/IncomingWebhookResponse'
        default:
          $ref: '#/components/responses/Error'
      security: []
