        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Closure size graph
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ClosureGraph'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/exec-jobs:
    get:
