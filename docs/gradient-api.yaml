  /api/v1/search:
    get:
      tags:
      - dashboard
      summary: Typed search for the command palette
      description: |-
        Classifies `q` and performs every lookup it could mean. The name lookup always takes place, and a project named like a commit hash is still found.
        - Store path or bare 32-char nix32 hash: NARs of that hash in readable caches (`nar`, at most 10).
        - 7 to 40 hex characters: evaluations of commits with that prefix in readable projects, newest first, PR-triggered ones included (`commit`, at most 5).
        - Any text: projects, tasks and caches whose name or display name contains it, at most `limit` per kind, starred first.
        An empty `q` returns the user's starred projects, tasks and caches, labelled by display name like name hits.
        Visibility matches the rest of the API: a project is readable when public or the user is a member; a cache when public, created by, shared with or subscribed to by a project of the user. There is no superuser bypass, so every hit opens a readable page.
        Results are ordered NAR hits, commit hits, then name hits (starred first, then kind, then name).
      operationId: getSearch
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Search hits with the frontend route each one navigates to
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchHit'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
