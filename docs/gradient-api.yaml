                    type: boolean
                  message:
                    $ref: '#/components/schemas/Paginated_Cache'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    put:
      tags:
      - caches
      summary: Create cache
      description: Creates a new binary cache with an auto-generated signing key.
