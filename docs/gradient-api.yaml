  # ── Nix Cache Protocol ───────────────────────────────────────────────────────
  # These endpoints live outside /api/v1. The server URL for these is the root,
  # e.g. https://gradient.example.com (no /api/v1 prefix).

  x-nix-cache-paths:
    description: |-
      The following Nix binary cache endpoints are served at the root of the server
      (not under `/api/v1`). They implement the Nix binary cache protocol and are
      used by `nix-store --realise`, `nixos-rebuild`, and other Nix clients.
      Private caches require HTTP Basic Auth (any username, JWT or API key as password).

      ### Substituter surface

      | Endpoint | Description |
      |---|---|
      | `GET /cache/{cache}/nix-cache-info` | Cache metadata for Nix. Add `?json` for JSON response (`NixCacheInfo`). |
      | `GET /cache/{cache}/gradient-cache-info` | Gradient-specific cache metadata. Add `?json` for JSON response (`GradientCacheInfo`). Responds with `Access-Control-Allow-Origin: *` for browser probes. |
      | `GET /cache/{cache}/{hash}.narinfo` | Path info for a store path. Add `?json` for JSON response (`NixPathInfo`). |
      | `GET /cache/{cache}/nar/{hash}.nar.zst` | Compressed NAR archive |
      | `GET /cache/{cache}/debuginfo/{build_id}` | DWARF debug info for an ELF build id, in nix's `index-debug-info` format: `{"archive": "../nar/<file>.nar.zst", "member": "lib/debug/.build-id/<xx>/<yy>.debug"}`. Both `{build_id}` and `{build_id}.debug` resolve. Indexed from `separateDebugInfo` outputs (store paths ending in `-debug`); a miss falls through to the cache's upstream caches with their `archive` link rewritten through `nar/upstream/{id}/...`, so `X-Cache` reports `HIT` (ours) or `MISS` (upstream). Unknown build ids - and any other key this cache does not serve - answer `404`, never a `4xx` that debuginfod clients treat as fatal. |

      ### Gradient Proto surface

      | Endpoint | Description |
      |---|---|
      | `GET /cache/{cache}/proto` | WebSocket upgrade carrying the same binary frames as `/proto`. Read-only, cache-scoped. PUBLIC caches allow anonymous connections (governed by `GRADIENT_PROTO_ANONYMOUS_CACHE_ENABLE`, default `true`); PRIVATE caches require `Authorization: GRAD<key>`. Anonymous sessions are capped per IP by `GRADIENT_PROTO_ANONYMOUS_CACHE_MAX_CONNECTIONS_PER_IP`; the upgrade request shares the NAR-download cache rate-limit tier. Only `CacheQuery` (Normal/Pull modes) and `NarRequest` messages are accepted; Push, job RPCs, and worker registration are rejected. |

      ### Inspection surface

      | Endpoint | Description |
      |---|---|
      | `GET /cache/{cache}/ls/{hash}` | JSON tree listing of the NAR (nix-serve `.ls` v1 schema). Rate-limited at ~180 req/min, burst 180. |
      | `GET /cache/{cache}/serve/{hash}/{path}` | Extract a single file (bytes, Content-Type sniffed) or directory (tar.zst) from a NAR. Rate-limited at ~180 req/min, burst 180. |
      | `GET /cache/{cache}/log/{drv}` | Build log for `<drv>.drv` (substituter compat - `nix log`). Serves this cache's own log for any build that produced one, successful or failed; otherwise asks the cache's upstream caches in order and proxies the first hit, so a pull-through cache exposes logs for paths it substituted rather than built. `X-Cache: HIT` (ours) or `MISS` (upstream). Rate-limited at ~180 req/min, burst 900. |

