  /api/v1/evals/{evaluation}/artefacts:
    get:
      tags:
      - evals
      summary: List evaluation artefacts
      description: |-
        Returns the artefact tree for an evaluation: entry points grouped by
        derivation, derivation outputs grouped under each entry point, and
        `build_product` rows grouped under each output. Consumed by the CLI's
        `gradient download` picker so users can choose what to fetch without
        first listing builds.

        Entry points are sorted by `attr`, outputs by `name`, products by `path`.
      operationId: listEvaluationArtefacts
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: Artefact tree
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ArtefactTree'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
  /api/v1/evals/{evaluation}/builds:
    get:
      tags:
      - evals
      summary: List evaluation builds
      description: |-
        Returns `.drv` builds associated with the evaluation, sorted by status
        (Building, then Queued, then FailedTransient/FailedPermanent/FailedTimeout, then Aborted/DependencyFailed, then Completed/Substituted, then Skipped),
        then by display name. Supports optional `limit` and `offset` query parameters
        for pagination, and an optional `scope` to restrict the list to one
        package's build-time dependency closure.

        Each item is a per-evaluation `build_job`; its `id` is used for log,
        downloads, and dependency-graph endpoints. The build *state* (status,
        timing, log) comes from the global `derivation_build` row, a shared build for
        every evaluation that needs the same derivation, so a derivation is
        built once and the outcome is reused across evaluations and projects.
      operationId: listEvaluationBuilds
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BuildJobId'
      responses:
        '200':
          description: |-
            Paginated build list, ordered by build status (running, then failed,
            aborted, queued, finished), then by dependency layer (`depth`), then
            by derivation name within a layer - so within one status the entry
            point heads the list and every build precedes the builds it needs.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/PaginatedBuilds'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    post:
      tags:
      - evals
      summary: Stream evaluation logs
      description: |-
        Open a streaming NDJSON response: replay the stored logs of all builds
        first, then follow the derivations still building. A derivation-name
        prefix opens each line. Keep the stream open until the evaluation itself
        has reached Completed, Failed or Aborted, not merely until no build is
        pending, so an evaluation without builds yet still has its stream.
        Evaluation-level messages are not part of this stream. Fetch them from
        `GET /evals/{evaluation}/messages`.

        Chunks hold no more than 256 KiB each, split at a line end. Empty strings
        arrive as keepalives after 15 seconds without output. Ignore them.
      operationId: streamEvaluationLogs
      parameters:
      - name: evaluation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvaluationId'
      responses:
        '200':
          description: NDJSON log stream
          content:
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/evals/{evaluation}/closure:
    get:
      tags:
      - evals
      summary: Get closure size graph for an evaluation
      description: |-
        Returns the union dependency closure of all the evaluation's entry-point
        builds with per-node uncompressed NAR sizes and an exact `total_size_bytes`.
        Same shape as `/builds/{build}/closure`.
      operationId: getEvalClosure
      parameters:
