  /api/v1/tasks/{project}/{task}/live:
    get:
      tags:
      - tasks
      summary: Task live updates (WebSocket)
      description: |-
        Upgrades to a WebSocket emitting `evaluation_status_changed`,
        `build_status_changed`, `evaluation_progress` and `evaluation_activity`
        events for this task, so the task page refetches on change instead of
        polling. `evaluation_progress` fires as builds and entry-points are
        persisted during the evaluation phase, before any build changes status,
        so the build/dependency totals grow live. `evaluation_activity` carries
        an `EvaluationProgress` snapshot at most once per second while the
        evaluation fetches or evaluates. Requires read access.
      operationId: taskLive
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: task
        in: path
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols - WebSocket upgrade successful
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
