  # ── Evaluations ──────────────────────────────────────────────────────────────

  /evals/{evaluation}:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: Get evaluation
      description: Returns the evaluation record including status, commit, and timestamps.
      operationId: getEvaluation
      responses:
        '200':
          description: Evaluation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Evaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [evals]
      summary: Evaluation action
      description: |-
        Performs an action on the evaluation. Currently the only supported action is
        `"abort"`, which cancels all in-progress and queued builds.
      operationId: postEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeEvaluationRequest'
            example:
              method: abort
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "Success"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/prioritize:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    post:
      tags: [evals]
      summary: Prioritize evaluation
      description: |-
        Hands out every build of an active evaluation, including builds it has not resolved yet, ahead of unprioritized work. Requires project membership. A finished evaluation is left unchanged; a failed or aborted one loses its priority.
      operationId: prioritizeEvaluation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "Success"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/builds:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: List evaluation builds
      description: |-
        Returns `.drv` builds associated with the evaluation, sorted by status
        (Building, then Queued, then FailedTransient/FailedPermanent/FailedTimeout, then Aborted/DependencyFailed, then Completed/Substituted, then Skipped),
        then by display name. Supports optional `limit` and `offset` query parameters
        for pagination, and an optional `scope` to restrict the list to one
        package's build-time dependency closure.

        Each item is a per-evaluation `build_job`; its `id` is used for log,
        downloads, and dependency-graph endpoints. The build *state* (status,
        timing, log) comes from the global `derivation_build` row, a shared build for
        every evaluation that needs the same derivation, so a derivation is
        built once and the outcome is reused across evaluations and projects.
      operationId: listEvaluationBuilds
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximum number of builds to return. Defaults to all.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of builds to skip (after sorting).
        - name: scope
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |-
            Restrict the result to the build-time dependency closure of this
            build's package (the build itself plus its transitive deps), so a
            failed top-level package shows only the failures that caused it
            rather than every failure in the evaluation. Must be a build in this
            evaluation.
      responses:
        '200':
          description: |-
            Paginated build list, ordered by build status (running, then failed,
            aborted, queued, finished), then by dependency layer (`depth`), then
            by derivation name within a layer - so within one status the entry
            point heads the list and every build precedes the builds it needs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          builds:
                            type: array
                            items:
                              $ref: '#/components/schemas/BuildItem'
                          total:
                            type: integer
                            description: Total number of builds for this evaluation (before pagination).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [evals]
      summary: Stream evaluation logs
      description: |-
        Opens a streaming NDJSON response that first replays every build's stored
        log, then follows the actively building derivations. Each line is prefixed
        with the derivation name. The stream stays open until the evaluation
        itself reaches a terminal state (Completed/Failed/Aborted) - not merely
        until no build is pending - so it does not end before the evaluation has
        created any builds. Evaluation-level messages are not included here; fetch
        them from `GET /evals/{evaluation}/messages`.
      operationId: streamEvaluationLogs
      responses:
        '200':
          description: NDJSON log stream
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One log chunk per line, prefixed with `<name>> `
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/messages:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: List evaluation messages
      description: |-
        Returns all structured messages (errors, warnings, notices) recorded during
        the evaluation. Each message carries a `level`, a human-readable `message`,
        and an optional `source` tag that identifies where the message originated
        (e.g. `"flake-prefetch"`, `"nix-eval"`, `"nix-eval:<attr>"`, `"db-insert"`).
        Messages scoped to specific entry points list their entry-point UUIDs in
        the `entry_points` array; evaluation-wide messages have an empty array.
      operationId: listEvaluationMessages
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/EvaluationMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/report:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: Download an evaluation diagnostic report
      description: |-
        Exports the evaluation, the instance context that explains it, and its
        failed-build logs as a SQLite database, for attaching to a bug report.
        Open it with any SQLite client, or with the `gradient-report` inspector.

        The export carries the direct dependencies of the evaluation's
        derivations, build-time and runtime alike, and their outputs' paths, so
        `blocking_deps` and `missing_runtime_deps` can be recomputed from the file
        alone and an absent row means the instance never had it.

        Requires authentication even for a public project, whose evaluations are
        otherwise browsable anonymously: a report reads every failed build's log
        in one request. Reading the evaluation requires `ViewProject`.
        `include_instance` also requires `ManageWorkers`, since the fleet and
        upstream sections describe more than the evaluation that asked for them;
        it is refused rather than silently dropped, so the report's manifest
        always matches the request.

        Anonymisation replaces identifying strings with tokens derived from a
        per-report salt, stable within one file and uncorrelatable across two.
        Build logs are rewritten against those same tokens, plus any store path
        they name, so a log cannot reintroduce what the columns redacted.
        Nix store hashes are always preserved: they are one-way, and they are
        what makes an upstream cache check possible.

        The parameter defaults below apply to callers that omit them. The web
        dialog asks the inverse question - what to *include* - and always sends
        all four explicitly, with build logs off unless asked for.
      operationId: getEvaluationReport
      parameters:
        - name: anonymize_identities
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Replace repository URLs, project and task names, user emails and worker names with per-report tokens.
        - name: anonymize_packages
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Replace the name half of store paths and flake attribute paths. Off by default, since knowing which package broke is usually the point.
        - name: include_logs
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include the full log of every failed or aborted attempt.
        - name: include_instance
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include worker fleet, upstream caches and the resolved server config. Requires `ManageWorkers`.
      responses:
        '200':
          description: SQLite report
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Instance context requested without the ManageWorkers permission
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/artefacts:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: List evaluation artefacts
      description: |-
        Returns the artefact tree for an evaluation: entry points grouped by
        derivation, derivation outputs grouped under each entry point, and
        `build_product` rows grouped under each output. Consumed by the CLI's
        `gradient download` picker so users can choose what to fetch without
        first listing builds.

        Entry points are sorted by `attr`, outputs by `name`, products by `path`.
      operationId: listEvaluationArtefacts
      responses:
        '200':
          description: Artefact tree
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ArtefactTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/closure:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: Get closure size graph for an evaluation
      description: |-
        Returns the union dependency closure of all the evaluation's entry-point
        builds with per-node uncompressed NAR sizes and an exact `total_size_bytes`.
        Same shape as `/builds/{build}/closure`.
      operationId: getEvalClosure
      responses:
        '200':
          description: Closure size graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ClosureGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/flake-graph:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: Get the walked flake output graph for an evaluation
      description: |-
        Returns the flake output nodes walked during evaluation, each with its
        attribute path, parent, name, kind, and (for derivations) the `.drv` path.
      operationId: getEvalFlakeGraph
      responses:
        '200':
          description: Flake output graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/FlakeGraphNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /evals/{evaluation}/runtime-closure:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [evals]
      summary: Get runtime closure size graph for an evaluation
      description: |-
        Union runtime reference closure of all the evaluation's entry-point build
        outputs. Runtime counterpart of `/evals/{evaluation}/closure`.
      operationId: getEvalRuntimeClosure
      responses:
        '200':
          description: Runtime closure size graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ClosureGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Build Requests ───────────────────────────────────────────────────────────

  /build-requests/manifest:
    post:
      tags: [build-requests]
      summary: Submit a build-request file manifest
      description: |-
        Step 1 of the `gradient build` flow. Posts the list of git-tracked files
        in the working tree, each addressed by BLAKE3 content hash. The server
        returns an `UploadSession` plus the subset of hashes it does not yet
        have on disk; the client uploads those via `POST
        /build-requests/{session}/blobs` and then finalises with `POST
        /build-requests/{session}/dispatch`.

        The combined `size` of all files must not exceed `MAX_BUILD_REQUEST_SIZE`
        (20 MiB). Paths must be relative, free of `.`/`..` components, free of
        null bytes, and unique within the manifest.
      operationId: postBuildRequestManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ManifestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Manifest total size exceeds `MAX_BUILD_REQUEST_SIZE` (20 MiB)

  /build-requests/{session}/blobs:
    parameters:
      - name: session
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Upload session id returned by `POST /build-requests/manifest`.
    post:
      tags: [build-requests]
      summary: Upload missing blobs for an upload session
      description: |-
        Step 2. Sends one or more blobs as multipart parts. Each part's
        **field name** is the 64-character lowercase hex BLAKE3 hash, and the
        part body is the raw file bytes. The server verifies each blob's hash,
        rejects any hash that isn't in the session's `missing` set, persists
        accepted blobs under `nar_storage`, and removes them from `missing`.

        The route's body limit is `MAX_BUILD_REQUEST_SIZE` (20 MiB).
      operationId: postBuildRequestBlobs
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: One part per blob. Field name = 64-char hex hash. Body = raw bytes.
              additionalProperties:
                type: string
                format: binary
      responses:
        '200':
          description: Blobs accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/BlobsResponse'
        '400':
          description: Bad request - malformed part name, hash mismatch, or hash not in `session.missing`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session has already been submitted.
        '410':
          description: Session expired.

  /build-requests/{session}/dispatch:
    parameters:
      - name: session
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Upload session id.
    post:
      tags: [build-requests]
      summary: Finalise an upload session and queue an evaluation
      description: |-
        Step 3. After all `missing` blobs have been uploaded, the client posts
        here to materialise `/nix/store/<hash>-source` from the staged files,
        sign it with the project's cache key, lazily create the per-project reserved
        `build-request` task on first use, and queue a new evaluation
        targeting the supplied `target` attribute path (or the task's
        wildcard when omitted).
      operationId: postBuildRequestDispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: Evaluation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: An input override is not a remote flake ref.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session already submitted or has blobs still missing.
        '410':
          description: Session expired.

  /build-requests/url:
    post:
      tags: [build-requests]
      summary: Queue a build request against a remote repository
      description: |-
        The no-upload build request: the source is already published at a URL, so
        only the URL and a revision are posted and the worker fetches the flake
        itself. Use this to build one attribute of a repository on demand -
        a deployment tool resolving a commit, for instance - without creating a
        task for it.

        Executes on the project's reserved `build-request` task, created lazily on
        first use and shared by every build request in the project, so no task is
        created per job. Evaluations queued here are `concurrent`: build requests
        are independent one-shot jobs and never queue behind or abort each other.

        Supply `rev` for an exact commit, `ref` for a branch or tag the server
        resolves first, or neither to take the repository's default branch. SSH
        URLs are authenticated with the project's deploy key. Local paths
        (`file://`) are rejected.

        Requires the `TriggerEvaluation` permission on the project. This lets a
        caller have Gradient fetch and evaluate an arbitrary remote flake on the
        build fleet - the same capability the source-upload flows already grant.
      operationId: postBuildRequestUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, url]
              properties:
                project:
                  type: string
                  description: Project the build belongs to; supplies the cache, the workers, and the deploy key.
                url:
                  type: string
                  description: Repository URL, `https://`, `ssh://`, or SCP-style.
                  example: "ssh://git@github.com/org/repo.git"
                ref:
                  type: string
                  description: Branch or tag to resolve. Mutually exclusive with `rev`.
                  example: main
                rev:
                  type: string
                  pattern: '^[0-9a-fA-F]{40}$'
                  description: Exact commit to build. Mutually exclusive with `ref`.
                  example: "9c1a2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3"
                target:
                  type: string
                  description: Attribute path or wildcard to evaluate. Defaults to the reserved task's wildcard.
                  example: "packages.x86_64-linux.k8s-resources"
                input_overrides:
                  type: array
                  description: Per-run flake input overrides; only remote flake refs are accepted.
                  items:
                    $ref: '#/components/schemas/InputOverride'
      responses:
        '200':
          description: Evaluation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: >-
            Empty `url`, a local `file://` URL, `ref` and `rev` given together,
            `rev` that is not a 40-character hex hash, an input override that is
            not a remote flake ref, or (`code: "repository_unreachable"`) a `ref`
            the server could not resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /build-requests/source:
    post:
      tags: [build-requests]
      summary: Upload a pre-packed source NAR and queue an evaluation (single-shot)
      description: |-
        One-shot alternative to the manifest/blob flow for clients built with
        the `nix` feature. The client NAR-packs the git-tracked source itself
        and uploads it here; the server computes the `/nix/store/<hash>-source`
        path, signs it, lazily creates the per-project `build-request` task, and
        queues an evaluation. The whole NAR is one request, bounded by
        `max_source_upload_size`; large sources should use the chunked
        `POST /build-requests/source/{upload}/chunk` + `finalize` flow instead.
      operationId: postBuildRequestSource
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nar]
              properties:
                nar:
                  type: string
                  format: binary
                  description: The packed source NAR.
                target:
                  type: string
                  description: >-
                    Eval target: a gradient attr-path wildcard
                    (`packages.x86_64-linux.#`) or a nix-style installable
                    (`.#foo`, expanded client-side to `packages.<system>.foo`).
                    Defaults to the task wildcard.
                system:
                  type: string
                  description: Target system.
      responses:
        '200':
          description: Evaluation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: Missing or empty `nar` field.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /build-requests/source/{upload}/chunk:
    put:
      tags: [build-requests]
      summary: Append a chunk of a source NAR to a staged upload
      description: |-
        Streams a large source NAR to the server in slices so no single request
        hits a body limit. `upload` is a client-chosen id (the CLI uses the NAR's
        content hash, which makes a retry resumable). `offset` must equal the
        bytes already received (`0` starts fresh); a mismatch appends nothing and
        returns the authoritative `received` so the client resumes. The staged
        total is bounded by `max_source_upload_size`. Finalise with
        `POST /build-requests/source/{upload}/finalize`.
      operationId: putBuildRequestSourceChunk
      parameters:
        - name: upload
          in: path
          required: true
          schema:
            type: string
          description: Client-chosen upload id (must not contain `/` or `..`).
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Byte offset this chunk starts at; must equal bytes already received.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk staged; returns total bytes received so far.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          received:
                            type: integer
                            format: int64
        '413':
          description: Staged total would exceed `max_source_upload_size`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /build-requests/source/{upload}/finalize:
    post:
      tags: [build-requests]
      summary: Finalise a chunked source upload and queue an evaluation
      description: |-
        Reassembles the staged source NAR for `upload`, computes its
        `/nix/store/<hash>-source` path, signs it, lazily creates the per-project
        `build-request` task, queues an evaluation, and drops the partial.
      operationId: postBuildRequestSourceFinalize
      parameters:
        - name: upload
          in: path
          required: true
          schema:
            type: string
          description: The upload id whose chunks were staged.
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: >-
                    Eval target: a gradient attr-path wildcard
                    (`packages.x86_64-linux.#`) or a nix-style installable
                    (`.#foo`, expanded client-side to `packages.<system>.foo`).
                    Defaults to the task wildcard.
                system:
                  type: string
                  description: Target system.
                input_overrides:
                  type: array
                  description: >-
                    Per-run flake input overrides applied at eval time; only
                    remote flake refs are accepted (local paths are rejected).
                  items:
                    $ref: '#/components/schemas/InputOverride'
      responses:
        '200':
          description: Evaluation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: >-
            No staged upload for this id, the staged NAR is empty, or an
            input override is not a remote flake ref.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Builds ───────────────────────────────────────────────────────────────────

  /builds/{build}:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get build
      description: |-
        Returns full build details including status, derivation path, architecture, assigned server, and output store paths.

        **Access:** Accessible to members of any project whose evaluation references this derivation (a derivation is built once and shared across projects via cache reachability). See `docs/src/concepts/overview.md#shared-builds`.
      operationId: getBuild
      responses:
        '200':
          description: Build with outputs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/BuildWithOutputs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/prioritize:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    post:
      tags: [builds]
      summary: Prioritize build
      description: |-
        Hands out the build and every open build of its dependency closure ahead of unprioritized work. Requires project membership. A build loses its priority when it fails permanently, dependency-fails, times out, is aborted or is skipped.
      operationId: prioritizeBuild
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "Success"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/log:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get build log
      description: |-
        Returns the complete build log as a single string. Empty string if no log is available yet.

        A `Substituted` build (its outputs came from a cache) has no log of its
        own, so the log of the most recent prior build of the same derivation is
        returned instead. The chunk/lines endpoints fall back the same way.

        **Access:** Accessible to members of any project whose evaluation references this derivation (a derivation is built once and shared across projects via cache reachability). See `docs/src/concepts/overview.md#shared-builds`.
      operationId: getBuildLog
      responses:
        '200':
          description: Build log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [builds]
      summary: Stream build log
      description: |-
        Opens a streaming NDJSON response that first emits the full existing log,
        then incrementally streams new chunks as they arrive. The stream ends when
        the build leaves the `Building` state.
      operationId: streamBuildLog
      responses:
        '200':
          description: NDJSON log stream
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/log/chunks:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get build log chunk index
      description: |-
        Returns the index of the zstd-compressed log chunks written when the build
        finalized: total chunk/line/byte counts and per-chunk line/byte offsets.
        `total_chunks` is `0` for builds whose log has not been finalized yet (use the
        streaming `POST /log` endpoint for in-progress builds).

        **Access:** Same as `GET /builds/{build}/log`.
      operationId: getBuildLogChunks
      responses:
        '200':
          description: Chunk index
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/LogChunkIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/log/chunk/{index}:
    parameters:
      - $ref: '#/components/parameters/BuildId'
      - name: index
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Zero-based chunk index from the chunk index response.
    get:
      tags: [builds]
      summary: Get a single decompressed log chunk
      description: |-
        Returns one chunk's plaintext (server-decompressed) with the active ANSI
        color state at the chunk boundary already prepended, so the chunk renders
        correctly standalone.

        **Access:** Same as `GET /builds/{build}/log`.
      operationId: getBuildLogChunk
      responses:
        '200':
          description: Chunk plaintext
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/log/lines:
    parameters:
      - $ref: '#/components/parameters/BuildId'
      - name: start
        in: query
        schema:
          type: integer
          format: int64
        description: 1-based first line (inclusive). Defaults to 1.
      - name: end
        in: query
        schema:
          type: integer
          format: int64
        description: 1-based last line (inclusive). Defaults to the last line.
      - name: range
        in: query
        schema:
          type: string
        description: Alternative to start/end, e.g. `L1234-L1243` (the `L` is optional).
    get:
      tags: [builds]
      summary: Get a build log line range
      description: |-
        Returns the plaintext for an inclusive 1-based logical line range, resolving
        the covering chunk(s) server-side and prepending the correct color prefix for
        the first line. Hand- and CLI-friendly; the frontend also uses this as its
        lazy fetch path.

        **Access:** Same as `GET /builds/{build}/log`.
      operationId: getBuildLogLines
      responses:
        '200':
          description: Line range plaintext
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/log/search:
    parameters:
      - $ref: '#/components/parameters/BuildId'
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Substring to search for.
      - name: case
        in: query
        schema:
          type: boolean
          default: false
        description: Case-sensitive match when true.
    get:
      tags: [builds]
      summary: Search a build log
      description: |-
        Streams NDJSON search hits in scan order as the server decompresses chunks,
        so first matches and a running count appear immediately. Each line is a
        `LogSearchHit`; the final frame is a `LogSearchDone` carrying `total_matches`.
        Matches are per-line substrings (no multi-line matches).

        **Access:** Same as `GET /builds/{build}/log`.
      operationId: searchBuildLog
      responses:
        '200':
          description: NDJSON stream of search hits, terminated by a done frame
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogSearchHit'
                  - $ref: '#/components/schemas/LogSearchDone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/graph:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get dependency graph
      description: |-
        Returns the full transitive dependency graph rooted at the given build's derivation
        via BFS over the recorded derivation dependencies, capped at 500 nodes. Node ids are
        derivation UUIDs; `build` is the build of the same evaluation, or null for a
        derivation that evaluation does not list. Each edge `source -> target` means
        `source` must be built before `target`.

        **Access:** Accessible to members of any project whose evaluation references this derivation (a derivation is built once and shared across projects via cache reachability). See `docs/src/concepts/overview.md#shared-builds`.
      operationId: getBuildGraph
      responses:
        '200':
          description: Dependency graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/BuildGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/closure:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get closure size graph
      description: |-
        Returns the full dependency closure of the build's derivation with per-node
        uncompressed NAR sizes and an exact `total_size_bytes` over the whole closure.
        The `nodes`/`edges` lists are capped with `truncated` set when the cap is hit:
        the heaviest subtrees are kept, each still linked to a root. `total_size_bytes`
        stays exact regardless. Intended
        for the closure Sankey view and size-trimming tooling.

        **Access:** Same as the dependency graph endpoint.
      operationId: getBuildClosure
      responses:
        '200':
          description: Closure size graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ClosureGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/runtime-closure:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Get runtime closure size graph
      description: |-
        Like `/builds/{build}/closure` but walks runtime store-path references
        (narinfo `References:`) from the build's outputs instead of build-time
        dependencies. Only as complete as the cached outputs; node ids are
        store-path hashes. Same `ClosureGraph` shape.
      operationId: getBuildRuntimeClosure
      responses:
        '200':
          description: Runtime closure size graph
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/ClosureGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/downloads:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: List build artefacts
      description: |-
        Returns downloadable artefacts declared in the build's
        `nix-support/hydra-build-products` file. Each entry has a file type,
        filename, Nix store path, and file size in bytes.

        Accessible without authentication when the owning project is public.

        **Access:** Accessible to members of any project whose evaluation references this derivation (a derivation is built once and shared across projects via cache reachability). See `docs/src/concepts/overview.md#shared-builds`.
      operationId: getBuildDownloads
      responses:
        '200':
          description: Build artefacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/BuildProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/download-token:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      tags: [builds]
      summary: Generate a short-lived download token
      description: |-
        Returns a signed JWT that is valid for **1 hour** and grants access to all
        artefact downloads for the specified build. Pass it as `?token=<value>` on
        `GET /builds/{build}/download/{filename}` to share a link without exposing
        long-lived credentials.

        Requires the caller to be a member of the project that owns the build.
      operationId: getBuildDownloadToken
      responses:
        '200':
          description: Download token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /builds/{build}/download/{filename}:
    parameters:
      - $ref: '#/components/parameters/BuildId'
      - name: filename
        in: path
        required: true
        schema:
          type: string
        description: Filename as returned by the `/downloads` endpoint
    get:
      tags: [builds]
      summary: Download build artefact
      description: |-
        Streams a build artefact. When the build product is a regular file the
        response carries the file's contents and a `Content-Type` derived from
        the extension. When the build product points to a directory inside the
        output, the response is a zstd-compressed tar archive of the subtree;
        `Content-Type` is `application/zstd` and `Content-Disposition`'s
        `filename` ends in `.tar.zst`. Clients should rely on the
        `Content-Disposition` header for the suggested filename in either case.

        Access is granted when **any** of the following is satisfied:
        1. The owning project is public - no credentials required.
        2. `?token=<download_token>` - a short-lived per-build token from
           `GET /builds/{build}/download-token` (1 h validity, safe to embed in URLs).
        3. `jwt_token` cookie or `Authorization: Bearer` header and the caller is a
           member of the owning project, or of any project with a build of the
           same derivation.
      operationId: downloadBuildArtefact
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Short-lived download token obtained from `/download-token`
      security:
        - {}
      responses:
        '200':
          description: File contents (regular file) or zstd-compressed tar archive (directory).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zstd:
              schema:
                type: string
                format: binary
                description: zstd-compressed tar of the directory subtree.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{project}/available:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [tasks]
      summary: Check task name availability
      description: Returns `true` if no task with the given name exists in the project, `false` if it is already taken.
      operationId: checkTaskNameAvailable
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Task name to check
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: boolean
              example:
                error: false
                message: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Workers ──────────────────────────────────────────────────────────────────

  /projects/{project}/workers:
    parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
        description: Project name

    get:
      tags: [workers]
      summary: List registered workers for a project
      description: |
        Returns all workers registered under this project (peer), merged with
        live status from the scheduler for currently connected workers, plus the
        workers of every team the project grants its workers (`team` set, read-only here).
        Live fields (`architectures`, `system_features`, etc.) are only populated
        for build-capable workers that have sent `WorkerCapabilities`.
      operationId: listProjectWorkers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectWorkerEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [workers]
      summary: Register a worker under a project
      description: |
        Registers a worker ID under this project as a peer. Returns a one-time
        plaintext token that the worker operator must add to their worker config.
        The token is shown only once - it cannot be retrieved later.
      operationId: registerProjectWorker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, display_name]
              properties:
                worker_id:
                  type: string
                  description: Persistent worker identity UUID.
                display_name:
                  type: string
                  description: Human-readable display name for this worker.
                url:
                  type: string
                  nullable: true
                  description: Optional WebSocket URL where the worker listens for incoming server connections. When set, the server connects outbound to this URL.
                token:
                  type: string
                  nullable: true
                  description: >
                    Pre-generated token (output of `openssl rand -base64 48`, exactly 64 standard-base64 characters).
                    When provided the server stores its hash and does NOT return the token in the response.
                    Omit to have the server generate a token - it will be returned once and cannot be retrieved again.
                enable_fetch:
                  type: boolean
                  default: true
                  description: Server-side gate for the worker's `fetch` capability for this registration.
                enable_eval:
                  type: boolean
                  default: true
                  description: Server-side gate for the worker's `eval` capability for this registration.
                enable_build:
                  type: boolean
                  default: true
                  description: Server-side gate for the worker's `build` capability for this registration.
      responses:
        '200':
          description: Worker registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/RegisterWorkerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`worker_id` belongs to a team worker, or `url` is set and it belongs to a Gradient.CI connection.'

  /projects/{project}/workers/{worker_id}:
    parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
        description: Project name
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
        description: Worker ID to unregister

    patch:
      tags: [workers]
      summary: Activate or deactivate a worker registration
      description: |
        Sets the `active` flag on a worker registration. Deactivating a worker
        triggers an immediate re-auth request, causing the worker to be disconnected
        if it is currently connected. Active jobs may be aborted.
        A state-managed worker accepts only `active` and answers `409` for other fields.
        The next server start restores the declared value. A team worker answers `409`;
        it is changed on its team.
      operationId: patchProjectWorker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  nullable: true
                  description: Set to false to deactivate the worker, true to reactivate it. Omit to leave unchanged.
                display_name:
                  type: string
                  description: Update the display name. Omit to leave unchanged.
                enable_fetch:
                  type: boolean
                  description: Update the per-registration `fetch` gate. Omit to leave unchanged.
                enable_eval:
                  type: boolean
                  description: Update the per-registration `eval` gate. Omit to leave unchanged.
                enable_build:
                  type: boolean
                  description: Update the per-registration `build` gate. Omit to leave unchanged.
      responses:
        '200':
          description: Worker updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [workers]
      summary: Unregister a worker from a project
      description: |
        Removes the worker registration. The worker may still be connected until
        it disconnects naturally - it will not be able to reconnect after that.
        A team worker answers `409`; it is deleted on its team.
      operationId: deleteProjectWorker
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker unregistered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The id belongs to a team worker, which is managed on its team.

  /projects/{project}/workers/{worker_id}/test:
    post:
      tags: [workers]
      summary: Test worker connectivity and authorization
      description: |
        Checks whether the worker is currently connected and whether it has
        successfully authorized for the given project. Useful for
        verifying worker setup without waiting for a real job.
      operationId: testProjectWorker
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project name
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
          description: Worker ID to test
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/WorkerTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Admin ────────────────────────────────────────────────────────────────────

  /gradient-ci/connections:
    post:
      tags: [workers]
      summary: Connect Gradient.CI Servers
      description: |
        Stores a connection token pasted from servers.gradient.ci. `scope = project` creates a
        worker registration for the project (same permission as registering a worker);
        `scope = team` creates a worker of the team (Admin in the team). The server
        dials `wss://<gradientCi.url host>/proto` within 15 s, a team connection only once a
        project grants the team its workers. Turned off by `gradientCi.enable = false`.
      operationId: connectGradientCi
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradientCiConnectionRequest'
      responses:
        '200':
          description: Connection stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/GradientCiConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The project or the instance is already connected, or the token's worker ID is
            registered elsewhere on this instance.

  /admin/workers:
    get:
      tags: [admin, workers]
      summary: List connected workers
      description: |
        Returns all workers currently connected to the server via the `/proto`
        WebSocket, including their capabilities and assigned job counts.

        Requires the caller to have the `superuser` flag, unless the server
        is started with `GRADIENT_PUBLIC_STATS=true`.
      operationId: listWorkers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkerInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/state:
    get:
      tags: [admin]
      summary: Export the live state configuration
      description: |
        Reconstructs the current users, projects, tasks, caches,
        custom roles, API keys, teams with their members and grants, workers
        (team workers name their team) and integrations into a
        declarative `services.gradient.state` shape, so operators can codify
        the running system back into their nix configuration.

        Every credential-file field (`password_file`, `private_key_file`,
        `signing_key_file`, `token_file`, `key_file`, `secret_file`,
        `access_token_file`) is redacted to `null` - the hashed/encrypted
        secrets cannot be recovered and must be filled in by hand. GitHub
        integration rows are exported with their `installation_id` /
        `account_login`. The auto-managed `build-request` task and the
        built-in `Admin`/`Write`/`View` roles are omitted.

        Requires `superuser`.
      operationId: exportState
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          description: |
            `nix` (default) returns a ready-to-paste Nix expression as
            `text/plain`; `json` returns the `StateConfiguration` object in the
            standard response envelope.
          schema:
            type: string
            enum: [nix, json]
            default: nix
      responses:
        '200':
          description: Exported state configuration
          content:
            text/plain:
              schema:
                type: string
              example: |
                # Generated by `GET /admin/state`. Secret `*_file` fields are null and
                # must be filled in with the credential paths on your host.
                {
                  projects = {
                    myproject = {
                      name = "myproject";
                      id = "018f6f3a-0000-7000-8000-000000000001";
                      private_key_file = null;
                      created_by = "operator";
                    };
                  };
                }
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        description: Declarative state, mirroring `services.gradient.state`.
        '400':
          description: Unknown `format` value.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/maintenance/deep-gc:
    post:
      tags: [admin]
      summary: Request a deep GC round
      description: |
        Requests a reconciliation between the database and every storage
        backend (NAR files, build-request blobs, build logs, upload partials),
        run without pausing between units. Returns `202` immediately with the
        task id; poll `GET /admin/tasks/{task_id}` for progress and final state.

        When a `deep_gc` round is already `pending` or `running`, that round
        starts over from its first unit and its id is returned.

        Requires `superuser`.
      operationId: startDeepGc
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Round requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [task_id, status]
                        properties:
                          task_id:
                            type: string
                            format: uuid
                          status:
                            type: string
                            enum: [pending]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/draining:
    post:
      tags: [admin]
      summary: Toggle instance draining
      description: |
        Enables or disables draining for the instance. While draining, the
        scheduler stops dispatching queued evaluations and builds, and every
        in-flight evaluation is parked (`Waiting`, reason `draining`) so the
        server can be stopped safely. Disabling recovers the parked evaluations
        back to `Queued`.

        Draining is in-memory only, so it always clears on the next server
        startup (parked evaluations are recovered automatically).

        Requires `superuser`.
      operationId: setDraining
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Draining state applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [draining]
                        properties:
                          draining:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tasks:
    get:
      tags: [admin]
      summary: List recent admin tasks
      description: |
        Returns the 50 newest admin tasks ordered by `created_at` descending.
        Requires `superuser`.
      operationId: listAdminTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin task list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tasks/{task_id}:
    get:
      tags: [admin]
      summary: Get one admin task
      operationId: getAdminTask
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Admin task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/AdminTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/github-app/manifest:
    post:
      tags: [admin]
      summary: Build GitHub App manifest
      description: |
        Builds a GitHub App manifest pre-filled with this server's URLs,
        permissions, and events, and returns a one-shot CSRF state token plus
        the GitHub URL the browser should POST the manifest to.

        Requires `superuser`. The state token is consumed by the matching
        `GET /admin/github-app/callback` invocation; it expires after 10
        minutes.
      operationId: createGithubAppManifest
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: GitHub Enterprise host (e.g. `ghe.example.com`). Defaults to `github.com` when omitted or empty.
              example:
                host: github.com
      responses:
        '200':
          description: Manifest, post URL, and CSRF state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [manifest, post_url, state]
                        properties:
                          manifest:
                            type: object
                            description: GitHub App manifest payload (`name`, `url`, `hook_attributes`, `redirect_url`, `setup_url`, `default_permissions`, `default_events`, `public`).
                          post_url:
                            type: string
                            description: Absolute URL the browser should POST the manifest to (e.g. `https://github.com/settings/apps/new`).
                          state:
                            type: string
                            description: Opaque one-shot CSRF token to be replayed in the callback's `state` query param.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/github-app/callback:
    get:
      tags: [admin]
      summary: GitHub App manifest callback
      description: |
        Receives the redirect from GitHub after the operator submits the
        manifest. Validates the `state` token, exchanges the temporary `code`
        for the App's permanent credentials, stashes them in a one-shot
        in-memory store per superuser who initiated the manifest
        flow, and redirects the browser to `/admin/github-app?ready=1`.

        **Unauthenticated** - GitHub redirects the operator's browser here
        from `https://github.com/...` and that cross-site navigation does not
        carry a bearer token. CSRF and identity binding are provided by the
        one-shot `state` token issued at `POST /admin/github-app/manifest`,
        which is bound to the initiating superuser at issuance.
      operationId: githubAppManifestCallback
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Temporary manifest exchange code issued by GitHub.
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The one-shot CSRF token issued by `POST /admin/github-app/manifest`.
        - in: query
          name: host
          required: false
          schema:
            type: string
          description: GitHub Enterprise host. Must match the host used to build the manifest.
      responses:
        '302':
          description: Redirect to `/admin/github-app?ready=1` on success.
          headers:
            Location:
              schema:
                type: string
                example: /admin/github-app?ready=1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: GitHub rejected the code exchange.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: string

  /admin/github-app/credentials:
    get:
      tags: [admin]
      summary: Fetch pending GitHub App credentials
      description: |
        One-shot retrieval of the credentials produced by the most recent
        successful manifest exchange. Calling this endpoint **consumes** the
        pending credentials; a second call returns `404`. Pending entries
        also expire 10 minutes after creation.

        Requires `superuser`.
      operationId: getGithubAppCredentials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: GitHub App credentials (returned exactly once)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        required: [id, slug, html_url, pem, webhook_secret, client_id, client_secret]
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: Numeric GitHub App ID - set as `GRADIENT_GITHUB_APP_ID`.
                          slug:
                            type: string
                            description: GitHub App slug.
                          html_url:
                            type: string
                            description: Public GitHub URL of the App settings page.
                          pem:
                            type: string
                            description: RS256 private key - write to `GRADIENT_GITHUB_APP_PRIVATE_KEY_FILE`.
                          webhook_secret:
                            type: string
                            description: Shared webhook secret - write to `GRADIENT_GITHUB_APP_WEBHOOK_SECRET_FILE`.
                          client_id:
                            type: string
                          client_secret:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Caches ───────────────────────────────────────────────────────────────────

  /caches:
    get:
      tags: [caches]
      summary: List caches
      description: Returns a paginated list of binary caches the current user owns or can access through a project subscription.
      operationId: listCaches
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated cache list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Cache'
                          total:
                            type: integer
                          page:
                            type: integer
                          per_page:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [caches]
      summary: Create cache
      description: Creates a new binary cache with an auto-generated signing key.
      operationId: createCache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeCacheRequest'
            example:
              name: my-cache
              display_name: My Cache
              description: "Packages for my tasks"
              priority: 40
      responses:
        '200':
          description: Cache UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /caches/available:
    get:
      tags: [caches]
      summary: Check cache name availability
      description: Returns `true` if no cache with the given name exists, `false` if it is already taken.
      operationId: checkCacheNameAvailable
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Cache name to check
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: boolean
              example:
                error: false
                message: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /caches/public:
    get:
      tags: [caches]
      summary: List public caches
      description: Returns every public cache. Does not require authentication.
      security: []
      operationId: listPublicCaches
      responses:
        '200':
          description: Public cache list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cache'

  /caches/{cache}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: Get cache
      description: >-
        Returns cache details. Public caches are visible to anyone. A private
        cache is visible to its cache members and to members of any project
        subscribed to it (matching the visibility of `GET /caches`); other
        callers receive `404`.
      operationId: getCache
      responses:
        '200':
          description: Cache details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Cache'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [caches]
      summary: Update cache
      description: Updates one or more cache fields. Requires `manageCacheSettings`. Managed caches cannot be edited via the API.
      operationId: patchCache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCacheRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [caches]
      summary: Delete cache
      description: Deletes the cache. Requires `deleteCache`. Managed caches cannot be deleted via the API.
      operationId: deleteCache
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/active:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    post:
      tags: [caches]
      summary: Enable cache
      description: Also allowed on a state-managed cache. The next server start restores the declared `active` value.
      operationId: enableCache
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Disable cache
      description: Also allowed on a state-managed cache. The next server start restores the declared `active` value.
      operationId: disableCache
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/public:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    post:
      tags: [caches]
      summary: Make cache public
      description: Makes the cache readable without authentication, by the API and by Nix clients.
      operationId: makeCachePublic
      responses:
        '200':
          description: Cache is now public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Make cache private
      description: Requires credentials to read the cache, by the API and by Nix clients.
      operationId: makeCachePrivate
      responses:
        '200':
          description: Cache is now private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/key:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: Get cache secret signing key
      description: |-
        Returns the Nix-format secret signing key string for the cache, e.g.:
        `gradient.example.com-mycache:AAAA...` (base64-encoded 64-byte ed25519 keypair)

        Requires `manageCacheKeys`. Keep the secret key private - do not add it to `nix.conf`.
        To configure Nix clients use the public key from `GET /caches/{cache}/public-key` instead.
      operationId: getCacheKey
      responses:
        '200':
          description: Cache secret signing key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "gradient.example.com-mycache:AAAA..."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/public-key:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: Get cache public key
      description: |-
        Returns the Nix-format public key string for the cache, e.g.:
        `gradient.example.com-mycache:AAAA...` (base64-encoded 32-byte ed25519 public key)

        Add this value to `trusted-public-keys` in `nix.conf` or NixOS configuration so
        Nix clients can verify signatures on store paths served from this cache.
      operationId: getCachePublicKey
      responses:
        '200':
          description: Cache public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
              example:
                error: false
                message: "gradient.example.com-mycache:AAAA..."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/stats:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: Get cache statistics
      description: >-
        Returns bandwidth and hit statistics for the cache. Visible to anyone
        for public caches, and to cache members or members of any project
        subscribed to a private cache (matching `GET /caches/{cache}`); other
        callers receive `404`.
      operationId: getCacheStats
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CacheStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/nars:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List cached NARs
      description: |-
        Returns a paginated list of NARs (cached store paths) currently signed by this cache.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: listCacheNars
      parameters:
        - name: hash
          in: query
          required: false
          schema:
            type: string
          description: Filter by store-path hash prefix
        - name: package
          in: query
          required: false
          schema:
            type: string
          description: Filter by package-name substring
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, nar_size, last_fetched_at]
            default: created_at
          description: Sort field
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-indexed page number
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Items per page (max 200)
      responses:
        '200':
          description: Paginated NAR list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/NarListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [caches]
      summary: Upload a NAR to a cache
      description: |-
        Uploads a single NAR (its bytes plus narinfo metadata) to this cache.
        Requires `writeStore`. The server validates the byte length against the
        declared `file_size`, stores the blob, records the cached path, and
        enqueues a signature for this cache. Re-uploading an existing store path
        reuses the cached path and only adds this cache's signature.

        The route's body limit is `GRADIENT_NAR_MAX_UPLOAD_SIZE` (default 512 MiB).
        The bundled reverse proxy additionally caps each request body at 100 MiB,
        so NARs above that must use the chunked endpoints
        (`PUT .../nars/{hash}/chunk` + `POST .../nars/{hash}/finalize`).
      operationId: uploadCacheNar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [narinfo, nar]
              properties:
                narinfo:
                  type: string
                  description: |-
                    JSON object: `store_path`, `file_hash`, `file_size`,
                    `nar_size`, `nar_hash`, `references` (array), optional `deriver`.
                nar:
                  type: string
                  format: binary
                  description: Raw NAR bytes.
      responses:
        '201':
          description: NAR stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          store_path:
                            type: string
                          created:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Upload capacity exhausted; retry after the given delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.

  /caches/{cache}/nars/{hash}/chunk:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: hash
        in: path
        required: true
        schema:
          type: string
        description: Store-path base name (`<hash>-<name>`) being uploaded.
    put:
      tags: [caches]
      summary: Append a chunk of a NAR being uploaded
      description: |-
        Appends one slice of a NAR to a server-side `.partial` staging file,
        one per `(cache, hash)`. Used to upload NARs larger than the reverse
        proxy's per-request body limit by splitting them across several requests.
        Requires `writeStore`. `offset == 0` starts fresh (truncating any stale
        partial); otherwise the chunk is appended only when `offset` equals the
        bytes already staged. The response's `received` is authoritative: the
        client sets its next offset to it (resending if it did not advance) and
        calls `POST .../finalize` once `received` equals the NAR size.
      operationId: uploadCacheNarChunk
      parameters:
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Byte offset this chunk starts at; must equal bytes already staged.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw NAR slice (≤ the proxy body limit).
      responses:
        '200':
          description: Chunk staged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          received:
                            type: integer
                            format: int64
                            description: Authoritative bytes staged; the client's next offset.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Chunk would push the NAR past `GRADIENT_NAR_MAX_UPLOAD_SIZE`.
        '503':
          description: Upload capacity exhausted; retry after the given delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.

  /caches/{cache}/nars/{hash}/finalize:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: hash
        in: path
        required: true
        schema:
          type: string
        description: Store-path base name (`<hash>-<name>`) being finalized.
    post:
      tags: [caches]
      summary: Finalize a chunked NAR upload
      description: |-
        Validates the fully staged NAR against its narinfo (the staged byte
        length must equal `file_size`), imports it exactly like the single-shot
        upload, and drops the `.partial`. Requires `writeStore`.
      operationId: finalizeCacheNarUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_path, file_hash, file_size, nar_size, nar_hash]
              properties:
                store_path: { type: string }
                file_hash: { type: string }
                file_size: { type: integer, format: int64 }
                nar_size: { type: integer, format: int64 }
                nar_hash: { type: string }
                references:
                  type: array
                  items: { type: string }
                deriver: { type: string, nullable: true }
      responses:
        '201':
          description: NAR stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          store_path:
                            type: string
                          created:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Upload capacity exhausted; retry after the given delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.

  /caches/{cache}/nars/stats:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: NAR aggregate statistics
      description: |-
        Returns aggregate counts and sizes for all NARs signed by this cache.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: getCacheNarStats
      responses:
        '200':
          description: NAR aggregates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/NarStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/nars/available:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: Check whether a NAR is available
      description: |-
        Returns `{ available: true }` when this cache currently holds a signature
        row for the given store-path hash. Cheaper than a `GET /nars/{hash}` round-trip
        for clients that only need a yes/no answer.
      operationId: getCacheNarAvailable
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
          description: Store-path hash to check
      responses:
        '200':
          description: Availability flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/NarAvailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/nars/{hash}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: hash
        in: path
        required: true
        schema:
          type: string
        description: Store-path hash
    get:
      tags: [caches]
      summary: Get NAR detail
      description: |-
        Returns full metadata for a NAR signed by this cache, including references,
        deriver, content-addressed flag, fetch count, and signature presence.
        Public caches allow anonymous access; otherwise requires `readStore`.
      operationId: getCacheNar
      responses:
        '200':
          description: NAR detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/NarDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Delete a NAR from this cache
      description: |-
        Removes this cache's signature row for the given store-path hash. The delete
        is ref-counted: when other caches still hold the same NAR, only this cache's
        signature is dropped. When this is the last cache holding the NAR, the
        `cached_path` row is removed in the same transaction, any matching
        `derivation_output.is_cached` rows are flipped to `false`, and the NAR
        blob is garbage-collected asynchronously after the response. Requires
        `writeStore`. Allowed on state-managed caches - NAR content is operational
        data, distinct from cache configuration.
      operationId: deleteCacheNar
      security:
        - bearerAuth: []
      responses:
        '204':
          description: NAR removed from this cache
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not Found - cache or NAR not found, or caller is not the cache owner.

  /caches/{cache}/upstream-caches:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List upstream caches
      description: >-
        Returns all upstream caches configured for this cache (both internal
        Gradient caches and external binary caches), including each upstream's
        `public_key` so clients can trust pull-through paths. Follows the same
        visibility as `GET /caches/{cache}`: public caches are readable by
        anyone, private caches only by members and subscribed projects.
      operationId: listUpstreamCaches
      responses:
        '200':
          description: List of upstream entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/UpstreamCache'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [caches]
      summary: Add upstream cache
      description: |-
        Adds an upstream cache. Three types are supported, selected by the `type` discriminator:

        - **internal** - another Gradient-managed cache (referenced by name). Supports ReadOnly / ReadWrite / WriteOnly modes.
        - **gradient_proto** - a remote Gradient cache accessed via the binary WebSocket protocol (`/cache/{cache}/proto`). Supports optional `api_key` (stored encrypted at rest; write-only - never returned by the API) and pull mode.
        - **http** - an arbitrary Nix binary cache URL. Always ReadOnly.

        Requires `manageUpstreamCaches`.
      operationId: addUpstreamCache
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUpstreamCacheRequest'
      responses:
        '200':
          description: Upstream added - returns the new upstream UUID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/upstream-caches/{id}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Upstream entry UUID
    patch:
      tags: [caches]
      summary: Update upstream cache
      description: |-
        Updates an upstream entry. For external upstream caches the mode is always forced to ReadOnly;
        `url` and `public_key` may be updated. For internal upstream caches only `mode` and `display_name` apply.
        `active` toggles any upstream cache. An inactive upstream cache is kept but never queried.
        A state-managed cache accepts only `active`, and the next server start restores the declared value.
        Requires `manageUpstreamCaches`.
      operationId: patchUpstreamCache
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUpstreamCacheRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Remove upstream cache
      operationId: deleteUpstreamCache
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/upstream-caches/{id}/test:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Upstream entry UUID
    post:
      tags: [caches]
      summary: Test an HTTP upstream cache over HTTP/1.1 and HTTP/2
      description: |-
        Fetches the upstream cache's `nix-cache-info` twice in parallel, once over HTTP/1.1 only and once
        over HTTP/2 only, and reports each result. A probe passes on a 2xx body with a `StoreDir:` line.
        Does not change the upstream cache's `http1_only` pin. Only `http` upstream caches can be tested.
        Requires `manageUpstreamCaches`; state-managed caches may be tested.
      operationId: testUpstreamCache
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/UpstreamTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/members:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List cache members
      description: Returns all members of the cache and their assigned roles. Requires `viewCache`.
      operationId: listCacheMembers
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/CacheMemberItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [caches]
      summary: Invite cache member
      description: |
        Invites a user to the cache with the given role. Requires
        `manageCacheMembers`.

        The user is **not** a member until they accept; the response message is
        `Invitation sent` and the pending row appears under
        `GET /caches/{cache}/invitations`. An invitation expires after 7 days. A
        **superuser** who already holds the permission adds the member directly
        instead, answering `User added`.
      operationId: addCacheMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCacheMemberRequest'
      responses:
        '200':
          description: Invitation sent, or member added when the caller is a superuser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user is already a member or already invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    patch:
      tags: [caches]
      summary: Update cache member role
      description: Changes the role of an existing cache member. Requires `manageCacheMembers`.
      operationId: patchCacheMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCacheMemberRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Remove cache member
      description: |
        Removes a user from the cache. Requires `manageCacheMembers`. The last
        Admin cannot be removed (`409`).
      operationId: removeCacheMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCacheMemberRequest'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /caches/{cache}/invitations:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List pending cache invitations
      description: Requires `manageCacheMembers`.
      operationId: listCacheInvitations
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Revoke a pending cache invitation
      description: Requires `manageCacheMembers`.
      operationId: revokeCacheInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCacheMemberRequest'
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/subscription-requests:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List subscription requests
      description: |
        Projects that have asked to subscribe to this cache and are waiting for
        a decision. Requires `manageCacheSubscriptions`.
      operationId: listCacheSubscriptionRequests
      responses:
        '200':
          description: Pending requests, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/subscription-requests/{project}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - $ref: '#/components/parameters/ProjectSlug'
    post:
      tags: [caches]
      summary: Approve a subscription request
      description: |
        Turns the pending request into a real subscription, using the mode the
        project asked for, and re-queues any evaluation parked for want of a
        cache. Requires `manageCacheSubscriptions`.
      operationId: approveCacheSubscriptionRequest
      responses:
        '200':
          description: Subscription approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [caches]
      summary: Deny a subscription request
      description: Requires `manageCacheSubscriptions`.
      operationId: denyCacheSubscriptionRequest
      responses:
        '200':
          description: Subscription request denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /caches/{cache}/roles:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [caches]
      summary: List cache roles
      description: |
        Returns the three built-in roles (Admin/Write/View) plus any custom roles
        owned by this cache, along with the full catalogue of cache permissions.
        Visible to any cache member (`viewCache`).
      operationId: listCacheRoles
      responses:
        '200':
          description: Role catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CacheRoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [caches]
      summary: Create custom cache role
      description: |
        Creates a new role scoped to this cache. Requires `manageCacheRoles`.
        The role's permission set is chosen from the capabilities returned by
        `GET /caches/{cache}/roles` -> `available_permissions`.
      operationId: createCacheRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCacheRoleRequest'
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CacheRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /caches/{cache}/roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Role identifier (UUIDv7).
    get:
      tags: [caches]
      summary: Fetch a cache role
      operationId: getCacheRole
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CacheRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [caches]
      summary: Update a custom cache role
      description: |
        Renames a custom role and/or replaces its permission set. Built-in roles
        (Admin/Write/View) are immutable (`403`). Requires `manageCacheRoles`.
      operationId: patchCacheRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCacheRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/CacheRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [caches]
      summary: Delete a custom cache role
      description: |
        Deletes a custom cache role. Built-in roles cannot be deleted (`403`).
        A role still assigned to members cannot be deleted until those members
        are reassigned (`400`). Requires `manageCacheRoles`.
      operationId: deleteCacheRole
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Commits ──────────────────────────────────────────────────────────────────

  /commits/{commit}:
    parameters:
      - name: commit
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Commit UUID
    get:
      tags: [commits]
      summary: Get commit
      description: |
        Returns commit metadata (message, hash, author). Visibility follows the
        commit's reachability: the caller must be a member of a project
        that owns an evaluation (or direct build) referencing the commit, or
        that project must be public. Anonymous callers may read commits
        reachable through public projects only. All other cases return
        `404` so existence isn't leaked.
      operationId: getCommit
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Commit'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Project integrations ────────────────────────────────────────────────

  /projects/{project}/integrations:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [integrations]
      summary: List integrations
      description: List all inbound and outbound integrations in this project.
      operationId: listProjectIntegrations
      responses:
        '200':
          description: List of integrations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/Integration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [integrations]
      summary: Create integration
      description: |-
        Creates a named inbound or outbound integration. `secret` and
        `access_token` are stored encrypted and never returned in responses.
        Name is unique within `(project, kind)`.

        One **inbound** integration can serve Gitea/Forgejo/GitLab
        simultaneously - the caller picks the Git host path segment in the webhook
        URL (`/hooks/gitea/...`, `/hooks/forgejo/...`, `/hooks/gitlab/...`).
        The stored `git_host_type` is display metadata only for inbound.

        `git_host_type: "github"` integrations are creatable by supplying
        `installation_id`. The server App must be configured (else `400`);
        the installation id is validated against the App (invalid id returns
        `400`). An inbound and outbound integration pair is created
        automatically, named `github-<account>`. Multiple installations per project
        are supported (one per GitHub account).
      operationId: createProjectIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '200':
          description: Integration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Integration'
        '400':
          description: Invalid name / kind / git_host_type
        '409':
          description: Name already in use within this kind
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/integrations/summary:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
    get:
      tags: [integrations]
      summary: List integration summaries (credential-free)
      description: |-
        List integrations as credential-free summaries. Available to **any
        project member**, in contrast to the full listing which requires
        `ManageIntegrations`.

        The response excludes `secret`, `endpoint_url`, `access_token`, and
        the `has_secret` / `has_access_token` booleans so non-admin members
        cannot fingerprint credential state. Intended for UIs that only need
        an integration's name and Git host type - e.g. populating the trigger
        create/edit dropdown for users who hold `EditTask` but not
        `ManageIntegrations`.
      operationId: listProjectIntegrationSummaries
      responses:
        '200':
          description: List of integration summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        type: array
                        items:
                          $ref: '#/components/schemas/IntegrationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project}/integrations/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectSlug'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Integration UUID
    get:
      tags: [integrations]
      summary: Get integration
      operationId: getProjectIntegration
      responses:
        '200':
          description: Integration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Integration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [integrations]
      summary: Update integration
      description: |-
        Patch-updates an integration. Omit a field to leave it unchanged.
        Pass an empty string for `secret` or `access_token` to **clear** it.

        `git_host_type=github` rows are managed by the App and installation; PATCH
        rejects them with `400`. Delete the row to remove the integration.
      operationId: patchProjectIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIntegrationRequest'
      responses:
        '200':
          description: Updated integration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/Integration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Name already in use within this kind
    delete:
      tags: [integrations]
      summary: Delete integration
      description: >-
        Deletes an integration. Any task `task_integration` rows
        referencing it are cleared via `ON DELETE SET NULL`.
        `git_host_type=github` rows can be deleted; deleting removes the
        installation binding for that account.
      operationId: deleteProjectIntegration
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Git Host Webhooks (incoming) ───────────────────────────────────────────────

  /hooks/github:
    post:
      tags: [git-host-webhooks]
      summary: Receive GitHub App webhook
      description: |-
        Receives events from a configured GitHub App. Payloads are authenticated using
        `X-Hub-Signature-256` HMAC-SHA256 verification against the configured
        `GRADIENT_GITHUB_APP_WEBHOOK_SECRET_FILE`.

        **Handled events:**
        - `push` / `pull_request` / `release` - trigger an evaluation on any task whose
          repository URL matches the matching trigger. A `push` carrying an
          all-zero `after` SHA (a branch/tag deletion or a Git host "test" delivery)
          is accepted as a `200` no-op rather than rejected.
        - `check_run` - the "Approve and Run" action clears a fork-PR approval gate.
        - `issue_comment` - `/gradient run` / `/gradient approve` maintainer commands.
        - `pull_request_review` - a maintainer's approving review clears a fork-PR approval gate.
        - `installation` / `installation_repositories` - stores or clears the GitHub App
          `installation_id` on the matching Gradient project.
        - `ping` - always returns 200.

        This endpoint is unauthenticated (verified via HMAC signature).
      operationId: githubAppWebhook
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: GitHub event type (e.g. `push`, `installation`, `ping`)
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the body (`sha256=<hex>`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub event payload (varies by event type)
      responses:
        '200':
          description: Webhook processed (may include zero queued evaluations)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Unparseable JSON payload or unsupported Git host
        '401':
          description: Invalid webhook signature
        '404':
          description: Integration not found
        '500':
          description: Internal error
        '503':
          description: GitHub App not configured (GitHub endpoint only)

  /hooks/{git_host}/{project}/{integration_name}:
    parameters:
      - name: git_host
        in: path
        required: true
        schema:
          type: string
          enum: [gitea, forgejo, gitlab]
        description: >-
          Git host type path segment. Determines the HMAC scheme; does **not**
          filter the integration lookup - a single inbound integration can
          serve all three Git hosts. GitHub deliveries go through
          `POST /hooks/github` (the App webhook) instead.
      - name: project
        in: path
        required: true
        schema:
          type: string
        description: Gradient project name
      - name: integration_name
        in: path
        required: true
        schema:
          type: string
        description: Name of the inbound integration within the project
    post:
      tags: [git-host-webhooks]
      summary: Receive Git host push webhook
      description: |-
        Receives push events for a named inbound integration.
        Authenticated via the integration's stored HMAC secret.

        Signature header by Git host:
        - `gitea` / `forgejo`: `X-Gitea-Signature` (HMAC-SHA256 hex)
        - `gitlab`: `X-Gitlab-Token` (plain token comparison)

        On a matching push, queues an evaluation for every active task whose
        `task_integration.inbound_integration` points at this row and whose
        repository URL matches the webhook payload's clone URL.

        A push carrying an all-zero `after` SHA (a branch/tag deletion or a
        Git host "test" delivery) is accepted as a `200` no-op rather than rejected.

        This endpoint is unauthenticated (verified via Git host specific signature).
      operationId: gitHostWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Git host push event payload
      responses:
        '200':
          description: Webhook processed (may include zero queued evaluations)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      message:
                        $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Unparseable JSON payload or unsupported Git host
        '401':
          description: Invalid webhook signature
        '404':
          description: Integration not found
        '500':
          description: Internal error

  # ── Nix Cache Protocol ───────────────────────────────────────────────────────
  # Served at the server root, not under /api/v1. Public caches need no
  # credentials; private caches take HTTP Basic auth.

  /cache/{cache}:
    servers:
      - url: http://127.0.0.1:3000
        description: Local development server
      - url: https://gradient.example.com
        description: Production server
    parameters:
      - $ref: '#/components/parameters/CacheSlug'
    get:
      tags: [nix-cache]
      summary: Cache root
      description: >-
        Redirects to `nix-cache-info`.
      operationId: getCacheRoot
      security:
        - {}
        - cacheBasic: []
      responses:
        '302':
          description: Redirect to `/cache/{cache}/nix-cache-info`

