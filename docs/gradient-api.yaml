  /api/v1/projects/{project}/integrations:
    get:
      tags:
      - integrations
      summary: List integrations
      description: List all inbound and outbound integrations in this project.
      operationId: listProjectIntegrations
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of integrations
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    put:
      tags:
      - integrations
      summary: Create integration
      description: |-
        Creates a named inbound or outbound integration. `secret` and
        `access_token` are stored encrypted and never returned in responses.
        Name is unique within `(project, kind)`.

        One **inbound** integration can serve Gitea/Forgejo/GitLab
        simultaneously - the caller picks the Git host path segment in the webhook
        URL (`/hooks/gitea/...`, `/hooks/forgejo/...`, `/hooks/gitlab/...`).
        The stored `git_host_type` is display metadata only for inbound.

        `git_host_type: "github"` integrations are creatable by supplying
        `installation_id`. The server App must be configured (else `400`);
        the installation id is validated against the App (invalid id returns
        `400`). An inbound and outbound integration pair is created
        automatically, named `github-<account>`. Multiple installations per project
        are supported (one per GitHub account).
      operationId: createProjectIntegration
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
        required: true
      responses:
        '200':
          description: Integration created
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/IntegrationResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/integrations/summary:
    get:
      tags:
      - integrations
      summary: List integration summaries (credential-free)
      description: |-
        List integrations as credential-free summaries. Available to **any
        project member**, in contrast to the full listing which requires
        `ManageIntegrations`.

        The response excludes `secret`, `endpoint_url`, `access_token`, and
        the `has_secret` / `has_access_token` booleans so non-admin members
        cannot fingerprint credential state. Intended for UIs that only need
        an integration's name and Git host type - e.g. populating the trigger
        create/edit dropdown for users who hold `EditTask` but not
        `ManageIntegrations`.
      operationId: listProjectIntegrationSummaries
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of integration summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationSummaryResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/integrations/{id}:
    get:
      tags:
      - integrations
      summary: Get integration
      operationId: getProjectIntegration
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IntegrationId'
      responses:
        '200':
          description: Integration
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/IntegrationResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - integrations
      summary: Delete integration
      description: Deletes an integration. Any task `task_integration` rows referencing it are cleared via `ON DELETE SET NULL`. `git_host_type=github` rows can be deleted; deleting removes the installation binding for that account. State-managed integrations are rejected with `403`, other integrations of a state-managed project can be deleted.
      operationId: deleteProjectIntegration
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IntegrationId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - integrations
      summary: Update integration
      description: |-
        Patch-updates an integration. Omit a field to leave it unchanged.
        Pass an empty string for `secret` or `access_token` to **clear** it.

        `git_host_type=github` rows are managed by the App and installation; PATCH
        rejects them with `400`. Delete the row to remove the integration.
        State-managed integrations are rejected with `403`.
      operationId: patchProjectIntegration
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IntegrationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIntegrationRequest'
        required: true
      responses:
        '200':
          description: Updated integration
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/IntegrationResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
