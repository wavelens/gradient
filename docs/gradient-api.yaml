    patch:
      tags:
      - teams
      summary: Change a cache team grant
      description: Needs `manageCacheMembers`.
      operationId: patchCacheTeam
      parameters:
      - name: cache
        in: path
        required: true
        schema:
          type: string
      - name: team
        in: path
        required: true
        schema:
          type: string
