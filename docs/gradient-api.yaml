        schema:
          type: string
      responses:
        '200':
          description: SSH public key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - projects
      summary: Regenerate SSH key pair
      description: Generates a new Ed25519 key pair for the project. The previous key will stop working on remote servers immediately.
      operationId: postProjectSsh
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New SSH public key
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/subscribe:
    get:
      tags:
      - projects
      summary: List cache subscriptions
      description: Returns the binary caches this project currently uses as substituters.
      operationId: listProjectSubscriptions
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscribed caches
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/CacheSubscriptionItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/subscribe/{cache}:
    post:
      tags:
      - projects
      summary: Subscribe to cache, or request a subscription
      description: |-
        Requires `manageSubscriptions` on the project, and the cache must be
        visible to the caller.

        When the caller also holds `manageCacheSubscriptions` on the cache, or is
        a superuser, the cache is added to the project's substituters
        immediately. Otherwise a **subscription request** is recorded instead and
        the response message is `Subscription requested`; a cache admin then
        approves it through
        `POST /caches/{cache}/subscription-requests/{project}`.
      operationId: subscribeProjectToCache
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: cache
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SubscribeCacheRequest'
              - type: 'null'
      responses:
        '200':
          description: Subscribed, or subscription requested
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - projects
      summary: Unsubscribe from cache, or cancel a pending request
      description: |-
        Removes a binary cache from the project's substituters. When no
        subscription exists but a request is still pending, the request is
        cancelled instead. Requires `manageSubscriptions` on the project.
      operationId: unsubscribeProjectFromCache
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: cache
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unsubscribed, or subscription request cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/teams:
    get:
      tags:
      - teams
      summary: List project team grants
      description: Includes pending requests.
      operationId: listProjectTeams
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamGrantEntry'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    post:
      tags:
      - teams
      summary: Grant a team on a project
      description: |-
        Needs `manageMembers` when the grant includes users and `manageWorkers` when it includes workers.
        A grant is active at once when the caller is Admin in the team (or a superuser).
        Otherwise a request waits for a team Admin and the answer is `Request sent`.
      operationId: grantProjectTeam
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantProjectRequest'
        required: true
      responses:
        '200':
          description: '`Team granted` or `Request sent`'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/teams/{team}:
    delete:
      tags:
      - teams
      summary: Remove a project team grant
      description: |-
        Allowed for Admin in the team, or on the project for `manageWorkers` when the grant includes only workers and `manageMembers` otherwise. Removing workers aborts their running jobs of the project.
        Without a grant, the pending request is withdrawn instead.
      operationId: removeProjectTeam
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: team
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '`Team grant removed` or `Request withdrawn`'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - teams
      summary: Change a project team grant
      description: Needs the project permission of the changed part. Turning workers on also needs Admin in the team.
      operationId: patchProjectTeam
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: team
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectGrantRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
  /api/v1/projects/{project}/users:
    get:
      tags:
      - projects
      summary: List project members
      operationId: listProjectUsers
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberItem'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
    post:
      tags:
      - projects
      summary: Invite member
      description: |-
        Invites a user to the project by username. Requires the caller to
        hold the **admin** role in the project.

        The user is **not** a member until they accept. The response message is
        `Invitation sent`, and the pending row appears under
        `GET /projects/{project}/invitations` until it is accepted, declined or
        revoked. An invitation expires after 7 days.

        A **superuser** who already holds the permission adds the member
        directly instead, answering `User added`. State-managed projects reject
        this endpoint entirely; their members come from the state file.
      operationId: addProjectUser
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Invitation sent, or member added when the caller is a superuser
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - projects
      summary: Remove member
      description: |-
        Removes a user from the project. Requires the caller to hold the
        **admin** role in the project.
      operationId: removeProjectUser
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMemberRequest'
        required: true
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - projects
      summary: Update member role
      description: |-
        Updates the role or permissions of an existing project member.
        Requires the caller to hold the **admin** role in the project.
      operationId: patchProjectUser
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: boolean
                  message:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
