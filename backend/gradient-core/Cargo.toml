[package]
name        = "gradient-core"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish     = false

[lib]
name    = "gradient_core"
path    = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
# Internal
gradient-entity = { workspace = true }
gradient-graph = { workspace = true }
gradient-types = { workspace = true }
gradient-wire = { workspace = true }
gradient-util = { workspace = true }
gradient-storage = { workspace = true }
gradient-notify = { workspace = true }
gradient-pool = { workspace = true }
gradient-db = { workspace = true }
gradient-git-host = { workspace = true }
gradient-sources = { workspace = true }
gradient-ci = { workspace = true }
gradient-state = { workspace = true }

# Workspace
anyhow                = { workspace = true }
async-trait           = { workspace = true }
base64                = { workspace = true }
bytes                 = { workspace = true }
chrono                = { workspace = true }
futures               = { workspace = true }
harmonia-file-nar              = { workspace = true }
hex                   = { workspace = true }
reqwest               = { workspace = true }
utoipa            = { workspace = true }
sea-orm               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tempfile              = { workspace = true }
thiserror             = { workspace = true }
tokio                 = { workspace = true, features = ["process", "macros", "fs", "io-util"] }
tracing               = { workspace = true }
url                   = { workspace = true }
uuid                  = { workspace = true }
zstd                  = { workspace = true }

ed25519-compact   = { workspace = true }
tar               = { workspace = true }

[dev-dependencies]
harmonia-file-nar = { workspace = true, features = ["test"] }
gradient-fixtures = { workspace = true }
gradient-test-support = { workspace = true }
wiremock     = { workspace = true }
zstd         = { workspace = true }
