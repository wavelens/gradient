[package]
name = "gradient-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "gradient_graph"
path = "src/lib.rs"
doctest = false

[features]
stub = []
testing = ["dep:gradient-fixtures", "dep:tempfile", "dep:clap"]

[lints]
workspace = true

[dependencies]
gradient-db      = { workspace = true }
gradient-entity  = { workspace = true }
gradient-fixtures = { workspace = true, optional = true }
gradient-sources = { workspace = true }
gradient-storage = { workspace = true }
gradient-types   = { workspace = true }
gradient-wire = { workspace = true }
gradient-util    = { workspace = true }

anyhow     = { workspace = true }
chrono     = { workspace = true }
clap       = { workspace = true, optional = true }
ractor     = { workspace = true }
sea-orm    = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true, optional = true }
tokio      = { workspace = true, features = ["macros", "sync", "time"] }
tracing    = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
gradient-fixtures = { workspace = true }
clap     = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "sync", "time", "rt-multi-thread", "test-util"] }
