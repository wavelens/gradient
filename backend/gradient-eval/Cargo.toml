# Self-contained manifest (no workspace inheritance) so this crate is usable as a
# lone path dependency from the separate gradient-cli workspace.
[package]
name = "gradient-eval"
description = "Standalone Nix flake evaluator shared by the gradient worker and CLI"
version = "2.0.1"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Wavelens GmbH <info@wavelens.io>"]
repository = "https://github.com/wavelens/gradient"
publish = false

[lib]
name = "gradient_eval"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow       = { version = "1.0", default-features = false, features = ["std"] }
async-trait  = { version = "0.1", default-features = false }
futures      = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc         = { version = "0.2", default-features = false }
nix          = { version = "0.31", default-features = false, features = ["signal", "process"] }
nix-bindings = { version = "0.2352", default-features = false, features = ["flake", "main"] }
rkyv         = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
serde        = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json   = { version = "1.0", default-features = false, features = ["std"] }
sysinfo      = { version = "0.39", default-features = false, features = ["system"] }
tokio        = { version = "1.50", default-features = false, features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
tracing      = { version = "0.1", default-features = false, features = ["std", "attributes"] }
