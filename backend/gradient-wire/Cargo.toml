[package]
name        = "gradient-wire"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish     = false

[lints]
workspace = true

[features]
testing = []

[dependencies]
gradient-api-types = { workspace = true }
gradient-util        = { workspace = true }
gradient-derive = { workspace = true }
gradient-secret = { workspace = true }

anyhow            = { workspace = true }
async-trait       = { workspace = true }
axum              = { workspace = true, features = ["ws", "tokio"] }
base64            = { workspace = true }
bytes            = { workspace = true }
futures           = { workspace = true }
harmonia-store-content-address = { workspace = true }
harmonia-store-path            = { workspace = true }
harmonia-utils-hash            = { workspace = true }
hex            = { workspace = true }
password-auth     = { workspace = true }
serde             = { workspace = true }
sha2              = { workspace = true }
subtle            = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true, features = ["sync", "net", "rt", "time", "macros"] }
tokio-tungstenite = { workspace = true }
tokio-util        = { workspace = true, features = ["codec"] }
tracing           = { workspace = true }
utoipa            = { workspace = true }
uuid              = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "test-util", "io-util"] }
proptest = { workspace = true }
serde_json = { workspace = true }
