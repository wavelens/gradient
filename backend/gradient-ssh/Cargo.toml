[package]
name = "gradient-ssh"
description = "Nix daemon protocol over SSH, answered from the Gradient cache"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow                         = { workspace = true }
async-compression              = { workspace = true }
async-stream                   = { workspace = true }
bytes                          = { workspace = true }
futures                        = { workspace = true }
gradient-core                  = { workspace = true }
gradient-daemon                = { workspace = true }
gradient-db                    = { workspace = true }
gradient-derivation            = { workspace = true }
gradient-entity                = { workspace = true }
gradient-graph                 = { workspace = true }
gradient-proto                 = { workspace = true }
gradient-scheduler             = { workspace = true }
gradient-sources               = { workspace = true }
gradient-storage               = { workspace = true }
gradient-types                 = { workspace = true }
gradient-util                  = { workspace = true }
gradient-wire                  = { workspace = true }
harmonia-file-nar              = { workspace = true }
harmonia-protocol              = { workspace = true }
harmonia-store-content-address = { workspace = true }
harmonia-store-derivation      = { workspace = true }
harmonia-store-path            = { workspace = true }
harmonia-store-path-info       = { workspace = true }
harmonia-utils-hash            = { workspace = true }
harmonia-utils-signature       = { workspace = true }
rand                           = { workspace = true }
russh                          = { workspace = true }
sea-orm                        = { workspace = true }
serde_json                     = { workspace = true }
shell-words                    = { workspace = true }
tempfile                       = { workspace = true }
thiserror                      = { workspace = true }
tokio                          = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing                        = { workspace = true }
uuid                           = { workspace = true }

[dev-dependencies]
gradient-test-support = { workspace = true }
harmonia-store-remote = { workspace = true }
