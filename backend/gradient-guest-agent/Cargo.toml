[package]
name        = "gradient-guest-agent"
description = "Gradient guest agent - runs exec jobs inside a worker guest"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish     = false

[[bin]]
name = "gradient-guest-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gradient-util = { workspace = true }
gradient-wire = { workspace = true }

anyhow      = { workspace = true }
nix         = { workspace = true, features = ["signal", "term", "user"] }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "process", "time"] }
tokio-util  = { workspace = true }
tokio-vsock = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
