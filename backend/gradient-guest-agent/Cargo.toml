[package]
name        = "gradient-guest-agent"
description = "Gradient guest agent - runs exec jobs inside a worker guest"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish     = false

[[bin]]
name = "gradient-guest-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gradient-redact = { workspace = true }
gradient-util = { workspace = true }
gradient-wire = { workspace = true }

anyhow             = { workspace = true }
axum               = { workspace = true, features = ["tokio", "http1", "query"] }
bytes              = { workspace = true }
clap               = { workspace = true }
futures            = { workspace = true }
git2               = { workspace = true }
http-body-util     = { workspace = true }
hyper              = { workspace = true }
hyper-util         = { workspace = true }
nix                = { workspace = true, features = ["process", "signal", "term", "user"] }
rustix             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "process", "time"] }
tokio-util         = { workspace = true, features = ["rt"] }
tokio-vsock        = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower    = { workspace = true, features = ["util"] }
