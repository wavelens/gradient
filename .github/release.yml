changelog:
  exclude:
    authors:
      - gradient-ci[bot]
      - dependabot[bot]
  categories:
    - title: Breaking Changes
      labels: [breaking]
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other Changes
      labels: ["*"]
