name: "Rust"

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "cli/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "backend/**"
      - "cli/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  lint:
    name: "fmt + deny (${{ matrix.workspace }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [ backend, cli ]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: "Toolchain (rust-toolchain.toml)"
        run: rustup show

      - name: "rustfmt"
        run: cargo fmt --all --check

      - name: "Forbid lazy #[allow]"
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target \
               '#!?\[allow\((unused_imports|unused|dead_code)' .; then
            echo "::error::bare #[allow(unused_imports|unused|dead_code)] is forbidden - fix the underlying warning instead"
            exit 1
          fi

      - name: "Forbid status writes outside the transition builders"
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target \
               -e 'Set\((EvaluationStatus|BuildStatus)::' \
               -e '(CEvaluation|CDerivationBuild)::Status,' . \
               | grep -v -e 'gradient-db/src/status/evaluation_status.rs' \
                         -e 'gradient-db/src/status/derivation_build_status.rs'; then
            echo "::error::write a build or evaluation status through build_change, evaluation_change or change_evaluation_status with a named transition"
            exit 1
          fi

      - name: "Forbid claim statements outside the pending delivery consumer"
        run: |
          if grep -rlE --include='*.rs' --exclude-dir=target 'SKIP LOCKED' . \
               | grep -v -e 'gradient-db/src/deliveries/pending.rs' \
                         -e 'gradient-db/src/evaluations/counters.rs' \
                         -e 'gradient-ci/src/actions/executor.rs' \
                         -e 'gradient-ci/src/webhooks/deliver.rs'; then
            echo "::error::add a PendingDeliveryKind and enqueue it instead of a new SKIP LOCKED claim statement"
            exit 1
          fi

      - name: "Forbid the whole server state outside the entry points"
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target \
               -e '&(Arc<)?(ServerState|AppState)\b' \
               -e '[a-z_]+: Arc<(ServerState|AppState)>' . \
               | grep -v -E -e '^\./gradient-(core|test-support)/' \
                   -e '^\./gradient-web/src/(lib|otlp|audit|scope|authorization/oidc|endpoints/webhooks/scope)\.rs' \
                   -e '^\./gradient-(effects|ssh|scheduler)/src/lib\.rs' \
                   -e '^\./gradient-ssh/src/session\.rs' \
                   -e '^\./gradient-proto/src/(outbound|handler/handles|handler/inbound|handler/upload/commit)\.rs' \
                   -e '^\./gradient-cache/src/(schedule|deep_gc/mod)\.rs'; then
            echo "::error::take the handles in use (a pool, DbContext, CiContext, the config) instead of ServerState"
            exit 1
          fi

      - name: "Forbid server state literals outside the two builders"
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target '\b(ServerState|AppState) \{' . \
               | grep -v -E -e '^\./gradient-(core|test-support)/' -e '\b(impl|for)\b'; then
            echo "::error::build the server state with TestState in tests and with init_state in the binaries"
            exit 1
          fi

      - name: "Forbid requests to a Git host outside the shared client"
        run: |
          if grep -rsnE --include='*.rs' '\.send\(\)' gradient-git-host/src \
               | grep -v '^gradient-git-host/src/client\.rs'; then
            echo "::error::send the request through a HostClient method"
            exit 1
          fi

      - name: "Forbid handler routes without a spec entry"
        run: |
          if grep -rsnE --include='*.rs' '\.route\(' gradient-web/src \
               | grep -v -e 'cache_root' -e '/tests/' -e 'tests\.rs' -e '^gradient-web/src/api_spec\.rs'; then
            echo "::error::annotate the handler with utoipa::path and add it with routes!"
            exit 1
          fi

      - name: "Forbid database queries in the web crate"
        run: |
          if grep -rsnE --include='*.rs' \
               '\b(EntityTrait|ActiveModelTrait|QueryFilter|QuerySelect|QueryOrder)\b' gradient-web/src \
               | grep -v -E '^gradient-web/src/(access|lookup|endpoints/membership/mod)\.rs'; then
            echo "::error::write the query as a function in gradient-db and call it from the handler"
            exit 1
          fi

      - name: "cargo-deny (licenses, bans, sources)"
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          command: check bans licenses sources
