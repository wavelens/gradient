name: Release Branches

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency: release-branches

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ssh-key: ${{ secrets.RELEASE_BRANCHES_DEPLOY_KEY }}

      - name: Move latest and beta to the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit="$(git rev-parse "$TAG^{commit}")"
          branches=(latest beta)
          if [[ "$TAG" == *-* ]]; then
            branches=(beta)
          fi

          for branch in "${branches[@]}"; do
            current="$(git rev-parse --verify --quiet "origin/$branch" || true)"
            other_releases=""
            if [ -n "$current" ]; then
              other_releases="$(git tag --points-at "$current" --list 'v*' | grep -vxF "$TAG" || true)"
            fi
            if [ -z "$current" ] || git merge-base --is-ancestor "$current" "$commit"; then
              git push origin "$commit:refs/heads/$branch"
            elif [ "$branch" = beta ] && [ -z "$other_releases" ]; then
              git push --force origin "$commit:refs/heads/$branch"
            else
              echo "::warning::$branch is not behind $TAG, leaving it in place"
              continue
            fi
            echo "$branch -> $TAG"
          done
