site_name: Gradient
site_description: Nix-based Continuous Integration System
site_url: https://wavelens.github.io/gradient
repo_url: https://github.com/wavelens/gradient
repo_name: wavelens/gradient
copyright: Copyright &copy; 2026 Wavelens GmbH

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

docs_dir: docs/src

nav:
  - Home: index.md
  - Get Started:
      - Quick Start: get-started/quick-start.md
      - First Project: get-started/first-project.md
      - Installation: get-started/installation.md
  - Concepts:
      - Overview: concepts/overview.md
      - Projects and Tasks: concepts/projects-and-tasks.md
      - Evaluations and Builds: concepts/evaluations-and-builds.md
      - Workers: concepts/workers.md
      - Caches: concepts/caches.md
      - Declarative State: concepts/declarative-state.md
  - Guides:
      - Add a Remote Worker: guides/remote-worker.md
      - Connect GitHub: guides/forge-github.md
      - Connect Gitea or Forgejo: guides/forge-gitea.md
      - Connect GitLab: guides/forge-gitlab.md
      - Build Before Pushing: guides/build-before-push.md
      - Share a Cache: guides/share-a-cache.md
      - Upload NARs: guides/upload-nars.md
      - Pull Deployment: guides/pull-deployment.md
      - Notify with Actions: guides/actions.md
      - Update Flake Inputs: guides/flake-updates.md
      - Set Up Single Sign-On: guides/sso.md
      - Manage Gradient with Nix: guides/manage-with-nix.md
      - Connect an AI Assistant: guides/mcp.md
      - Monitor Gradient: guides/monitoring.md
      - Report a Bug: guides/diagnostic-report.md
  - Using the UI:
      - Dashboard: ui/dashboard.md
      - Job Board: ui/job-board.md
      - Closure View: ui/closure-view.md
      - Members and Roles: ui/members-and-roles.md
      - Settings: ui/settings.md
  - Reference:
      - Configuration: reference/configuration.md
      - Declarative State: reference/state.md
      - Evaluation Wildcards: reference/wildcards.md
      - CLI: reference/cli.md
      - API: reference/api.md
      - Events and Webhooks: reference/events.md
      - Scheduler Policies: reference/scheduler-policies.md
  - Contributors:
      - Architecture: contributors/architecture.md
      - Internals: contributors/internals.md
      - Scheduler:
          - Build Anchors: contributors/scheduler/build-anchors.md
          - Promotion and Counters: contributors/scheduler/promotion-and-counters.md
          - Reconciler: contributors/scheduler/reconciler.md
          - Upstream Substitution: contributors/scheduler/upstream-substitution.md
          - Cache Closure: contributors/scheduler/cache-closure.md
          - Waiting and Recovery: contributors/scheduler/waiting-and-recovery.md
          - Scoring: contributors/scheduler/scoring.md
      - Eval Worker Setup: contributors/eval-worker.md
      - Migrations: contributors/migrations.md
      - Proto:
          - Connection: contributors/proto/connection.md
          - Capabilities and Dispatch: contributors/proto/capabilities-and-dispatch.md
          - Jobs: contributors/proto/jobs.md
          - Messages: contributors/proto/messages.md
          - Transfer: contributors/proto/transfer.md
          - Federation: contributors/proto/federation.md
      - Evaluation Metrics: contributors/eval-metrics.md
      - Diagnostic Reports: contributors/diagnostic-reports.md
      - Tests: contributors/tests.md
      - Frontend Style Guide: contributors/frontend-style-guide.md
      - Contributing: contributors/contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - fenced_code
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
